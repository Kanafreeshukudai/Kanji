<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Kanji Flashcard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230B0D10'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23D9694F' font-family='serif'%3E%E6%BC%A2%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;800&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#0B0D10;
    --bg-2:#15181c;
    --ink:#ECE7DC;
    --ink-soft:#9BA1A6;
    --ink-faint:#6b7075;
    --panel-1:#1D2126;
    --panel-2:#24282e;
    --back-1:#152731;
    --back-2:#0d1b22;
    --accent:#D9694F;
    --accent-soft:#e5876f;
    --gold:#C9A66B;
    --moss:#7C9A6B;
    --moss-soft:#93b17f;
    --card-w: min(84vw, 360px);
    --card-h: min(120vw, 460px);

    --glass-bg: rgba(255,255,255,0.07);
    --glass-bg-strong: rgba(255,255,255,0.12);
    --glass-border: rgba(255,255,255,0.32);
    --glass-border-soft: rgba(255,255,255,0.14);
    --glass-highlight: rgba(255,255,255,0.55);
    --glass-shadow: rgba(0,0,0,0.45);

    /* glass blur/saturation levels — kept as variables so low-power (lite) mode
       can cheaply turn every backdrop-filter down at once instead of editing
       each rule individually */
    --blur-1:14px;
    --blur-2:18px;
    --blur-3:20px;
    --blur-4:22px;
    --sat-1:150%;
    --sat-2:160%;
    --blob-blur:70px;
  }
  /* ---------- LITE MODE (auto-detected weak/low-end devices) ----------
     Lowering blur radius (not disabling it) keeps the glassy look intact
     while cutting the GPU compositing cost dramatically on cheap Android
     phones, where large backdrop-filter blurs are the single biggest
     source of jank. */
  html.lite{
    --blur-1:6px;
    --blur-2:7px;
    --blur-3:8px;
    --blur-4:9px;
    --sat-1:120%;
    --sat-2:120%;
    --blob-blur:36px;
  }
  html.lite .bg-scene .blob{ animation:none !important; }
  html.lite .bg-scene .blob.b3,
  html.lite .bg-scene .blob.b4{ display:none; }
  html.lite .card.flipped .face.back{ animation:none !important; }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  html{scrollbar-gutter:stable both-edges; overscroll-behavior-y:none;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg-1);
    color:var(--ink);
    font-family:'Zen Maru Gothic', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow-x:hidden;
    position:relative;
    isolation:isolate;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
  }

  /* ---------- LIVING BACKDROP (soft blurred color, so the glass has something nice to catch) ---------- */
  .bg-scene{
    position:fixed;
    inset:0;
    z-index:-1;
    overflow:hidden;
    background:var(--bg-1);
    contain:strict;
  }
  .bg-scene .blob{
    position:absolute;
    border-radius:50%;
    filter:blur(var(--blob-blur));
    opacity:0.55;
    will-change:transform;
    contain:layout style paint;
  }
  .bg-scene .blob.b1{
    width:60vw; height:60vw; max-width:480px; max-height:480px;
    top:-14%; left:-18%;
    background:radial-gradient(circle, var(--accent) 0%, transparent 70%);
    animation:drift1 22s ease-in-out infinite;
  }
  .bg-scene .blob.b2{
    width:55vw; height:55vw; max-width:440px; max-height:440px;
    bottom:-16%; right:-14%;
    background:radial-gradient(circle, var(--moss) 0%, transparent 70%);
    animation:drift2 26s ease-in-out infinite;
  }
  .bg-scene .blob.b3{
    width:44vw; height:44vw; max-width:360px; max-height:360px;
    top:38%; right:4%;
    background:radial-gradient(circle, var(--gold) 0%, transparent 70%);
    opacity:0.35;
    animation:drift3 20s ease-in-out infinite;
  }
  .bg-scene .blob.b4{
    width:38vw; height:38vw; max-width:320px; max-height:320px;
    bottom:20%; left:6%;
    background:radial-gradient(circle, var(--back-1) 0%, transparent 70%);
    opacity:0.5;
    animation:drift1 30s ease-in-out infinite reverse;
  }
  .bg-scene::after{
    content:"";
    position:absolute; inset:0;
    background:rgba(11,13,16,0.35);
  }
  @keyframes drift1{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(6%, 8%) scale(1.08); }
  }
  @keyframes drift2{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(-7%, -6%) scale(1.1); }
  }
  @keyframes drift3{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(-5%, 10%) scale(0.92); }
  }
  @media (prefers-reduced-motion: reduce){
    .bg-scene .blob{animation:none !important;}
  }

  header{
    width:100%;
    max-width:480px;
    padding:26px 20px 8px;
    text-align:center;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:0.32em;
    color:var(--accent);
    font-weight:700;
    text-transform:uppercase;
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-size:24px;
    margin:6px 0 0;
    font-weight:600;
    letter-spacing:0.01em;
    color:var(--ink);
  }

  .known-banner{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    margin:16px auto 0;
    max-width:480px;
    width:calc(100% - 40px);
    border:1px solid rgba(124,154,107,0.45);
    background:linear-gradient(165deg, rgba(124,154,107,0.28), rgba(124,154,107,0.14));
    backdrop-filter:var(--blur-1) saturate(var(--sat-1));
    -webkit-backdrop-filter:var(--blur-1) saturate(var(--sat-1));
    color:var(--moss-soft);
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:800;
    font-size:14px;
    letter-spacing:0.02em;
    padding:11px 14px;
    border-radius:16px;
    cursor:pointer;
    transition:all .25s ease;
  }
  .known-banner:active{transform:scale(0.98);}
  .known-banner.active{
    background:linear-gradient(165deg, rgba(124,154,107,0.5), rgba(124,154,107,0.28));
    border-color:var(--moss);
    color:#eafce0;
  }
  .known-banner-icon{font-size:16px;}
  .known-banner-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:22px;
    font-size:11.5px;
    background:var(--moss);
    color:#0B0D10;
    padding:2px 7px;
    border-radius:999px;
    font-weight:900;
  }

  .banner-row{
    display:flex;
    gap:10px;
    margin:16px auto 0;
    max-width:480px;
    width:calc(100% - 40px);
  }
  .banner-row .known-banner, .banner-row .all-banner{
    margin:0;
    width:auto;
    flex:1;
  }
  .all-banner{
    border-color:rgba(201,166,107,0.45);
    background:linear-gradient(165deg, rgba(201,166,107,0.28), rgba(201,166,107,0.14));
    color:var(--gold);
  }
  .all-banner.active{
    background:linear-gradient(165deg, rgba(201,166,107,0.5), rgba(201,166,107,0.28));
    border-color:var(--gold);
    color:#fff4de;
  }
  .all-banner .known-banner-badge{background:var(--gold);}

  .all-day-group{margin:0;}
  .all-day-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin:18px 4px 8px;
    cursor:pointer;
    user-select:none;
  }
  .all-day-group:first-child .all-day-heading{margin-top:4px;}
  .all-day-heading-left{
    display:flex;
    align-items:center;
    gap:7px;
    min-width:0;
  }
  .all-day-arrow{
    flex-shrink:0;
    width:9px;
    height:9px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .all-day-arrow::before{
    content:"";
    display:block;
    width:7px;
    height:7px;
    border-right:2px solid var(--ink-soft);
    border-bottom:2px solid var(--ink-soft);
    transform:rotate(-45deg);
    transition:transform .2s ease;
  }
  .all-day-group.collapsed .all-day-arrow::before{transform:rotate(45deg);}
  .all-day-heading-label{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:800;
    font-size:13px;
    letter-spacing:0.04em;
    color:var(--ink-soft);
    text-transform:uppercase;
  }
  .all-day-heading-count{
    font-size:10.5px;
    font-weight:600;
    color:var(--ink-soft);
    opacity:0.6;
    flex-shrink:0;
  }
  .all-kanji-collapse{
    display:grid;
    grid-template-rows:1fr;
    transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1), opacity .28s ease;
    opacity:1;
  }
  .all-kanji-collapse > .all-kanji-grid{
    overflow:hidden;
    min-height:0;
  }
  .all-day-group.collapsed .all-kanji-collapse{
    grid-template-rows:0fr;
    opacity:0;
  }
  .all-day-select-btn{
    flex-shrink:0;
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.01em;
    color:var(--ink-soft);
    background:rgba(255,255,255,0.06);
    border:1px solid var(--glass-border-soft);
    padding:4px 10px;
    border-radius:999px;
    cursor:pointer;
    transition:all .2s ease;
  }
  .all-day-select-btn:active{transform:scale(0.94);}
  .all-day-select-btn.all-selected{
    color:var(--accent-soft);
    border-color:rgba(217,105,79,0.4);
    background:rgba(217,105,79,0.14);
  }
  .all-kanji-grid{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:10px;
  }
  .all-kanji-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    border:1px solid var(--glass-border-soft);
    background:rgba(255,255,255,0.05);
    border-radius:12px;
    padding:8px 2px 6px;
    cursor:pointer;
    transition:border-color .15s ease, background-color .15s ease, transform .15s ease;
    min-width:0;
    contain:content;
  }
  .all-kanji-item:active{transform:scale(0.95);}
  .all-kanji-item .aki-kanji{
    font-family:'Shippori Mincho', serif;
    font-size:19px;
    line-height:1.15;
    color:var(--ink);
    max-width:100%;
    overflow-wrap:break-word;
    text-align:center;
  }
  .all-kanji-item .aki-romaji{
    font-size:9px;
    color:var(--ink-soft);
    font-weight:600;
    text-align:center;
    overflow-wrap:break-word;
    max-width:100%;
  }
  .all-kanji-item.selected{
    border-color:var(--accent);
    background:linear-gradient(165deg, rgba(217,105,79,0.32), rgba(217,105,79,0.16));
  }
  .all-kanji-item.selected .aki-kanji, .all-kanji-item.selected .aki-romaji{
    color:var(--accent-soft);
  }
  .all-selected-note{
    text-align:center;
    font-size:12.5px;
    color:var(--ink-soft);
    margin:14px 0 2px;
  }
  .all-clear-btn{
    display:block;
    margin:8px auto 0;
    background:rgba(217,105,79,0.14);
    border:1px solid rgba(217,105,79,0.4);
    color:var(--accent-soft);
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:0.02em;
    padding:5px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:opacity .2s ease, transform .2s ease;
    opacity:1;
    transform:scale(1);
  }
  .all-clear-btn:active{transform:scale(0.95);}
  /* kept in normal flow (space reserved) instead of display:none, so the
     kanji grid below never jumps when the button appears/disappears */
  .all-clear-btn.slot-empty{
    opacity:0;
    pointer-events:none;
    visibility:hidden;
  }

  .tabs-wrap{
    margin:18px auto 0;
    max-width:480px;
    width:calc(100% - 40px);
  }
  .tabs-wrap.tabs-hidden{
    display:none;
  }
  nav.tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:0;
    width:100%;
  }
  .tab-btn{
    flex:1;
    min-width:64px;
    border:1px solid var(--glass-border-soft);
    background:var(--glass-bg);
    backdrop-filter:var(--blur-1) saturate(var(--sat-1));
    -webkit-backdrop-filter:var(--blur-1) saturate(var(--sat-1));
    color:var(--ink-soft);
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:13.5px;
    padding:9px 6px;
    border-radius:999px;
    cursor:pointer;
    transition:all .25s ease;
  }
  .tab-btn.active{
    background:rgba(236,231,220,0.92);
    color:var(--bg-1);
    border-color:rgba(236,231,220,0.92);
  }
  .tab-btn .badge{
    display:inline-block;
    margin-left:5px;
    font-size:10.5px;
    background:var(--accent);
    color:#fff;
    padding:1px 6px;
    border-radius:999px;
    font-weight:700;
  }
  .tab-btn.active .badge{background:var(--gold); color:var(--bg-1);}

  .tab-btn.kunlar-btn{
    flex:0.9;
    background:linear-gradient(165deg, rgba(163,35,35,0.34), rgba(163,35,35,0.16));
    border-color:rgba(163,35,35,0.6);
    color:#e0776b;
  }
  .tab-btn.kunlar-btn.active{
    background:linear-gradient(165deg, #a32323, #6e1717);
    border-color:#a32323;
    color:#f5e2df;
  }
  .tab-btn.kunlar-btn.open{
    background:linear-gradient(165deg, rgba(163,35,35,0.55), rgba(163,35,35,0.3));
    border-color:#a32323;
    color:#f5e2df;
  }
  .kunlar-arrow{
    display:inline-block;
    margin-left:3px;
    font-size:10px;
    transition:transform .25s ease;
  }
  .tab-btn.kunlar-btn.open .kunlar-arrow{
    transform:rotate(180deg);
  }

  .tabs-older-collapse{
    display:grid;
    grid-template-rows:0fr;
    opacity:0;
    transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1), opacity .28s ease;
  }
  .tabs-older-collapse.open{
    grid-template-rows:1fr;
    opacity:1;
  }
  .tabs-older-inner{
    overflow:hidden;
    min-height:0;
  }
  .tabs-older-label{
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-faint);
    font-weight:700;
    margin:12px 2px 6px;
  }
  .tabs-older-grid{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding-bottom:2px;
  }
  .tabs-older-grid .tab-btn{
    flex:0 1 auto;
    min-width:74px;
  }

  main{
    width:100%;
    max-width:480px;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 40px;
  }

  /* ---------- STAGE / SWIPE CARD ---------- */
  .stage{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    height:var(--card-h);
    touch-action:pan-y;
  }
  .card{
    position:relative;
    width:var(--card-w);
    height:var(--card-h);
    cursor:grab;
    user-select:none;
    will-change:transform;
    touch-action:pan-y;
    perspective:1400px;
    -webkit-perspective:1400px;
  }
  .card:active{cursor:grabbing;}
  .card-inner{
    width:100%; height:100%;
    position:relative;
    transform-style:preserve-3d;
    -webkit-transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.2,.8,.2,1);
    transform:rotateY(0deg);
    -webkit-transform:rotateY(0deg);
  }
  .card.flipped .card-inner{transform:rotateY(180deg); -webkit-transform:rotateY(180deg);}

  .card.flipped .face.back{
    animation:cardGlow 2.2s ease-in-out infinite;
  }
  @keyframes cardGlow{
    0%,100%{
      border-color:var(--glass-border-soft);
      box-shadow:
        0 24px 50px -16px var(--glass-shadow),
        0 2px 10px rgba(0,0,0,0.3),
        inset 0 1px 0 rgba(255,255,255,0.18),
        inset 0 0 0 1px rgba(255,255,255,0.04),
        0 0 0 0 rgba(201,166,107,0);
    }
    50%{
      border-color:var(--gold);
      box-shadow:
        0 24px 50px -16px var(--glass-shadow),
        0 2px 10px rgba(0,0,0,0.3),
        inset 0 1px 0 rgba(255,255,255,0.18),
        inset 0 0 0 1px rgba(255,255,255,0.04),
        0 0 26px 6px rgba(201,166,107,0.55);
    }
  }

  .face{
    position:absolute; inset:0;
    border-radius:22px;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    -webkit-transform:translateZ(0) rotateY(0deg);
    transform:translateZ(0) rotateY(0deg);
    display:flex;
    flex-direction:column;
    padding:26px 22px;
    box-shadow:
      0 24px 50px -16px var(--glass-shadow),
      0 2px 10px rgba(0,0,0,0.3),
      inset 0 1px 0 rgba(255,255,255,0.18),
      inset 0 0 0 1px rgba(255,255,255,0.04);
    border:1px solid var(--glass-border-soft);
    background:var(--glass-bg);
    backdrop-filter:var(--blur-4) saturate(var(--sat-2));
    -webkit-backdrop-filter:var(--blur-4) saturate(var(--sat-2));
    overflow:hidden;
  }
  .face::before{
    /* glass sheen streak */
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:55%;
    background:linear-gradient(180deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0.03) 60%, transparent 100%);
    pointer-events:none;
  }
  .face::after{
    /* subtle border glow to sell the glass edge */
    content:"";
    position:absolute; inset:0;
    border-radius:22px;
    border:1px solid transparent;
    background:linear-gradient(160deg, var(--glass-highlight), transparent 30%, transparent 70%, rgba(255,255,255,0.15)) border-box;
    -webkit-mask:linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    opacity:0.35;
    pointer-events:none;
  }
  .face.front{
    justify-content:center;
    align-items:center;
  }
  .face.front > *{ position:relative; z-index:1; }
  /* Old tarafning ramkasida — bir burchakdan boshlanib qarama-qarshi burchakda so'nadigan,
     ingichka, oynaga xos statik yorug'lik chizig'i (aylanmaydi). */
  .face.front::after{
    content:"";
    position:absolute; inset:0;
    border-radius:22px;
    border:1.4px solid transparent;
    background:
      linear-gradient(135deg,
        rgba(255,255,255,0.98) 0%,
        rgba(255,255,255,0.8)  4%,
        rgba(255,255,255,0.42) 11%,
        rgba(255,255,255,0.14) 21%,
        rgba(255,255,255,0.03) 33%,
        transparent 46%,
        transparent 82%,
        rgba(255,255,255,0.05) 94%,
        rgba(255,255,255,0.14) 100%
      ) border-box;
    -webkit-mask:linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    filter:drop-shadow(0 0 2px rgba(255,255,255,0.45));
    opacity:0.95;
    pointer-events:none;
  }
  .face.back{
    transform:translateZ(0) rotateY(180deg);
    -webkit-transform:translateZ(0) rotateY(180deg);
    color:var(--ink);
    justify-content:space-between;
    background:linear-gradient(165deg, rgba(21,39,49,0.35), rgba(13,27,34,0.28)), var(--glass-bg);
  }
  .face.back > *{ position:relative; z-index:1; }

  .face-top-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }
  .type-badge{
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.08em;
    padding:4px 10px;
    border-radius:999px;
    border:1px solid currentColor;
    text-transform:uppercase;
  }
  .front .type-badge{color:var(--accent-soft); border-color:var(--accent-soft);}
  .back .type-badge{color:var(--gold); border-color:var(--gold);}

  .hanko{
    width:32px; height:32px;
    border-radius:8px;
    background:rgba(217,105,79,0.16);
    color:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;
    font-family:'Shippori Mincho',serif;
    font-size:16px;
    font-weight:700;
  }
  .back .hanko{background:rgba(201,166,107,0.14); color:var(--gold);}

  .kanji-display{

  /* ---------- QUIZ ---------- */
  .quiz-wrap{width:100%;}

  .quiz-bar-fill{height:100%; background:var(--accent); border-radius:6px; transition:width .3s ease;}
  .quiz-card{
    background:var(--glass-bg);

  .quiz-opt.wrong{background:var(--accent); border-color:var(--accent); color:#fff;}

  .quiz-feedback{
    min-height:38px;

  .quiz-feedback-badge{

    gap:8px;
    padding:8px 18px;

    font-family:'Zen Maru Gothic',sans-serif;
    font-weight:800;
    font-size:14.5px;
    letter-spacing:0.01em;
    backdrop-filter:var(--blur-1) saturate(var(--sat-1));
    -webkit-backdrop-filter:var(--blur-1) saturate(var(--sat-1));
    border:1.5px solid transparent;
    opacity:0;

    animation:feedbackPop .5s cubic-bezier(.2,1.4,.4,1) forwards;

  .quiz-feedback-badge .fb-emoji{
    font-size:19px;
    display:inline-block;
    animation:feedbackEmojiBounce .6s ease .05s 1;
  }
  .quiz-feedback-badge.correct{
    background:linear-gradient(165deg, rgba(124,154,107,0.38), rgba(124,154,107,0.18));
    border-color:rgba(124,154,107,0.55);
    color:#eafce0;
  }
  .quiz-feedback-badge.wrong{
    background:linear-gradient(165deg, rgba(217,105,79,0.32), rgba(217,105,79,0.16));
    border-color:rgba(217,105,79,0.55);
    color:#ffe3d9;
  }
  @keyframes feedbackPop{
    0%{opacity:0; transform:scale(0.6) translateY(6px);}
    60%{opacity:1; transform:scale(1.06) translateY(0);}
    100%{opacity:1; transform:scale(1) translateY(0);}
  }
  @keyframes feedbackEmojiBounce{
    0%,100%{transform:translateY(0) rotate(0deg);}
    30%{transform:translateY(-5px) rotate(-8deg);}
    60%{transform:translateY(0) rotate(6deg);}
  }
  @media (prefers-reduced-motion: reduce){
    .quiz-feedback-badge, .quiz-feedback-badge .fb-emoji{animation:none !important; opacity:1 !important; transform:none !important;}
  }

  .page-flash{
    position:fixed;
    inset:0;
    z-index:9999;
    pointer-events:none;
    opacity:0;
    mix-blend-mode:normal;
  }
  .page-flash.flash-correct{
    background:radial-gradient(circle at 50% 38%, rgba(124,154,107,0.55) 0%, rgba(124,154,107,0.18) 45%, transparent 75%);
    animation:pageFlashPulse .8s ease-out;
  }
  .page-flash.flash-wrong{
    background:radial-gradient(circle at 50% 38%, rgba(217,105,79,0.5) 0%, rgba(217,105,79,0.16) 45%, transparent 75%);
    animation:pageFlashShake .8s ease-out;
  }
  @keyframes pageFlashPulse{
    0%{opacity:0;}
    12%{opacity:1;}
    100%{opacity:0;}
  }
  @keyframes pageFlashShake{
    0%{opacity:0; transform:translateX(0);}
    10%{opacity:1; transform:translateX(-6px);}
    20%{transform:translateX(6px);}
    30%{transform:translateX(-4px);}
    40%{transform:translateX(4px);}
    50%{transform:translateX(0);}
    100%{opacity:0; transform:translateX(0);}
  }
  @media (prefers-reduced-motion: reduce){
    .page-flash.flash-correct, .page-flash.flash-wrong{animation:none !important; opacity:0 !important;}
  }
  .quiz-opt.disabled{pointer-events:none; opacity:0.55;}

  /* ---------- VAQT SINOVI (timed recall quiz) ---------- */
  .quiz-card-timed{cursor:pointer;}
  .quiz-timer-bar{
    width:100%; height:6px; background:var(--glass-bg); border-radius:6px; overflow:hidden;
    margin:16px 0 2px; border:1px solid var(--glass-border-soft);

    font-weight:900;
    font-size:14.5px;

  /* ---------- SPLASH / INTRO ---------- */
  .splash-screen{

    flex-direction:column;
    align-items:center;
    justify-content:center;

    transition:opacity .75s cubic-bezier(.4,0,.2,1), filter .75s cubic-bezier(.4,0,.2,1), transform .75s cubic-bezier(.4,0,.2,1);

  @keyframes splashKanjiCycle{

    100%{opacity:0;}
  }
  .splash-title{
    margin-top:24px;
    font-family:'Shippori Mincho', serif;

    padding:12px 34px;

<script>
  // ---------- LITE MODE AUTO-DETECT ----------
  // Runs before body paint so weak devices never render the heavy version first.
  // Heuristics: low core/RAM count, "reduce data"/"reduce motion" OS setting, or a
  // save-data network hint — all common on budget Android phones.
  (function(){
    try{
      var nav = navigator;
      var weakHW = (nav.hardwareConcurrency && nav.hardwareConcurrency <= 4) ||
                   (nav.deviceMemory && nav.deviceMemory <= 4);
      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var saveData = nav.connection && nav.connection.saveData;
      if(weakHW || reduceMotion || saveData){
        document.documentElement.classList.add('lite');
      }
    }catch(e){}
  })();
</script>

  // ---------- PERSISTENCE ----------
  const STORAGE_KEY = 'kanji-flashcard-state';
  // Ilova (artifact) muhitida window.storage bo'ladi — bo'lmasa, brauzerning
  // o'zida (shu qurilmada) saqlash uchun localStorage'ga tushamiz.
  const hasArtifactStorage = typeof window !== 'undefined'
    && window.storage
    && typeof window.storage.get === 'function'
    && typeof window.storage.set === 'function';

  async function loadState(){
    try{
      let raw = null;
      if(hasArtifactStorage){
        try{
          const res = await window.storage.get(STORAGE_KEY);
          raw = res ? res.value : null;
        }catch(e){ raw = null; } // hali saqlangan holat yo'q
      } else {
        raw = localStorage.getItem(STORAGE_KEY);
      }
      if(raw){
        const data = JSON.parse(raw);
        const validIds = new Set(WORDS.map(w=>w.id));
        if(data.queues && typeof data.queues === 'object'){
          DAY_ORDER.forEach(d=>{
            const saved = Array.isArray(data.queues[d]) ? data.queues[d].filter(id=>validIds.has(id)) : [];
            queues[d] = saved;
          });
        } else if(Array.isArray(data.queue)){
          // eski format bilan moslik (bitta umumiy navbat)
          queues[DAY_ORDER[0]] = data.queue.filter(id=>validIds.has(id));
        }
        known = Array.isArray(data.known) ? data.known.filter(id=>validIds.has(id)) : [];
        // har bir so'z aynan bitta joyda (navbat yoki bilganlar) bo'lishini ta'minlash
        const seen = new Set([...Object.values(queues).flat(), ...known]);
        WORDS.forEach(w=>{ if(!seen.has(w.id)) queues[w.day].push(w.id); });
        if(DAY_ORDER.includes(data.currentDay)){
          currentDay = data.currentDay;
        }
      }
    }catch(e){ /* no saved state yet — use defaults */ }
  }

  async function saveState(){
    try{
      const payload = JSON.stringify({queues, known, currentDay});
      if(hasArtifactStorage){
        await window.storage.set(STORAGE_KEY, payload);
      } else {
        localStorage.setItem(STORAGE_KEY, payload);
      }
    }catch(e){ console.error('Saqlashda xatolik:', e); }
  }

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'tab-btn' + (currentTab==='learn' && currentDay===d ? ' active' : '');

    btn.addEventListener('click', onSelect);
    return btn;
  }

  function renderTabs(){
    tabsNav.innerHTML = "";
    tabsOlderGrid.innerHTML = "";

    const recentDays = DAY_ORDER.slice(-RECENT_DAY_COUNT);
    const olderDays = DAY_ORDER.slice(0, -RECENT_DAY_COUNT);

    if(olderDays.length){
      const isOlderActive = currentTab==='learn' && olderDays.includes(currentDay);
      const kunlarBtn = document.createElement('button');
      kunlarBtn.type = 'button';
      kunlarBtn.className = 'tab-btn kunlar-btn' + (isOlderActive ? ' active' : '') + (kunlarOpen ? ' open' : '');

        kunlarOpen = !kunlarOpen;
        renderTabs();
      });
      tabsNav.appendChild(kunlarBtn);
    }

    recentDays.forEach(d=>{
      tabsNav.appendChild(dayTabBtn(d, ()=>{ currentDay = d; kunlarOpen = false; saveState(); showTab('learn'); }));

  let allListBuilt = false;
  function renderAll(){
    if(!allListBuilt){
      const lastDay = DAY_ORDER[DAY_ORDER.length-1];
      allList.innerHTML = DAY_ORDER.map(d=>{
        const items = ALL_KANJI.filter(w=>w.day===d);
        if(items.length === 0) return '';
        const collapsed = d !== lastDay; // eng oxirgi kun ochiq, qolganlari yopiq boshlanadi
        return `
          <div class="all-day-group${collapsed ? ' collapsed' : ''}" data-day-group="${d}">
            <div class="all-day-heading">
              <span class="all-day-heading-left">
                <span class="all-day-arrow"></span>
                <span class="all-day-heading-label">${DAY_LABELS[d]}</span>
                <span class="all-day-heading-count">(${items.length})</span>
              </span>
              <button class="all-day-select-btn" data-day="${d}" type="button">Hammasini tanlash</button>
            </div>
            <div class="all-kanji-collapse">
              <div class="all-kanji-grid">
                ${items.map(w=>`
                  <button class="all-kanji-item" data-id="${w.id}" type="button">
                    <span class="aki-kanji">${w.kanji}</span>
                    <span class="aki-romaji">${w.romaji}</span>
                  </button>`).join('')}
              </div>
            </div>
          </div>`;
      }).join('');
      // bitta umumiy listener (event delegation) — har bir tugma uchun alohida emas, tezroq va tejamli
      allList.addEventListener('click', (e)=>{
        const dayBtn = e.target.closest('.all-day-select-btn');
        if(dayBtn){
          const d = Number(dayBtn.getAttribute('data-day'));
          const dayIds = ALL_KANJI.filter(w=>w.day===d).map(w=>w.id);
          const allAlreadySelected = dayIds.every(id=>selectedKanji.has(id));
          if(allAlreadySelected){
            dayIds.forEach(id=>selectedKanji.delete(id));
          } else {
            dayIds.forEach(id=>selectedKanji.add(id));
          }
          refreshAllSelectionUI();
          return;
        }
        const heading = e.target.closest('.all-day-heading');
        if(heading){
          const group = heading.closest('.all-day-group');
          if(group) group.classList.toggle('collapsed');
          return;
        }
        const btn = e.target.closest('.all-kanji-item');
        if(!btn) return;
        const id = btn.getAttribute('data-id');
        if(selectedKanji.has(id)){ selectedKanji.delete(id); btn.classList.remove('selected'); }
        else { selectedKanji.add(id); btn.classList.add('selected'); }
        refreshAllSelectionUI();
      });
      allListBuilt = true;
    } else {
      refreshAllSelectionUI();
    }
    updateAllQuizButtons();
  }

  // kanji tugmalari va har-kunlik "hammasini tanlash" tugmalarini joriy tanlovga moslashtirish
  function refreshAllSelectionUI(){
    allList.querySelectorAll('.all-kanji-item').forEach(btn=>{
      btn.classList.toggle('selected', selectedKanji.has(btn.getAttribute('data-id')));
    });
    allList.querySelectorAll('.all-day-select-btn').forEach(btn=>{
      const d = Number(btn.getAttribute('data-day'));
      const dayIds = ALL_KANJI.filter(w=>w.day===d).map(w=>w.id);
      const allSelected = dayIds.length > 0 && dayIds.every(id=>selectedKanji.has(id));
      btn.classList.toggle('all-selected', allSelected);
      btn.textContent = allSelected ? "Olib tashlash" : "Hammasini tanlash";
    });
    updateAllQuizButtons();
  }

  function updateAllQuizButtons(){
    const n = selectedKanji.size;
    btnAllQuizTranslate.disabled = n === 0;
    btnAllQuizRomaji.disabled = n === 0;
    btnAllQuizTimed.disabled = n === 0;
    btnAllClear.classList.toggle('slot-empty', n === 0);
    allSelectedNote.textContent = n === 0
      ? "Viktorina uchun kanjilarni tanlang"
      : `${n} ta kanji tanlandi`;
  }

  btnAllClear.addEventListener('click', ()=>{
    selectedKanji.clear();
    refreshAllSelectionUI();
  });
  btnAllQuizTranslate.addEventListener('click', ()=>{
    startQuiz([...selectedKanji], 'all', 'translate');

  // ---------- SWIPE / DRAG ----------
  function attachCardEvents(card){
    // decided: null = not yet decided, 'h' = horizontal drag, 'v' = vertical scroll (ignore)
    let startX=0, startY=0, curX=0, dragging=false, moved=false, decided=null, rafId=null, pendingDx=0;
    const inner = card.querySelector('.card-inner');
    const tagLeft = card.querySelector('.swipe-tag.left');
    const tagRight = card.querySelector('.swipe-tag.right');

    // real finger taps always wobble a few pixels — this must be big enough that a tap
    // never gets mistaken for the start of a drag, but small enough that an intentional
    // swipe still feels immediate.
    const INTENT_PX = 14;

    function pointerDown(e){
      dragging = true; moved = false; decided = null;
      const p = e.touches ? e.touches[0] : e;
      startX = p.clientX; startY = p.clientY; curX = 0;
      inner.style.transition = 'none';
    }
    function applyTransform(dx){
      const rot = dx / 18;
      card.style.transform = `translateX(${dx}px) rotate(${rot}deg)`;
      const op = Math.min(Math.abs(dx)/80, 1);
      if(dx < 0){ tagLeft.style.opacity = op; tagRight.style.opacity = 0; }
      else { tagRight.style.opacity = op; tagLeft.style.opacity = 0; }
    }
    function pointerMove(e){
      if(!dragging || decided === 'v') return;
      const p = e.touches ? e.touches[0] : e;
      const dx = p.clientX - startX;
      const dy = p.clientY - startY;

      if(decided === null){
        const adx = Math.abs(dx), ady = Math.abs(dy);
        if(adx < INTENT_PX && ady < INTENT_PX) return; // still just a tap-sized wobble, do nothing yet
        if(adx > ady * 1.3){
          decided = 'h'; // clear sideways intent — start the card drag
        } else {
          decided = 'v'; // vertical/ambiguous intent — let the page scroll, don't touch the card
          dragging = false;
          return;
        }
      }

      moved = true;
      curX = dx;
      pendingDx = dx;
      if(rafId === null){
        rafId = requestAnimationFrame(()=>{ applyTransform(pendingDx); rafId = null; });
      }
      e.preventDefault && e.cancelable && e.preventDefault();
    }
    function pointerUp(){
      if(rafId !== null){ cancelAnimationFrame(rafId); rafId = null; }
      if(!dragging){ return; }
      dragging = false;
      inner.style.transition = '';
      const threshold = 90;
      if(curX <= -threshold){
        flyOut(-1, markKnown);
      } else if(curX >= threshold){
        flyOut(1, markLater);
      } else if(moved){
        card.style.transition = 'transform .35s cubic-bezier(.2,.8,.2,1)';
        card.style.transform = '';
        tagLeft.style.opacity = 0; tagRight.style.opacity = 0;
        setTimeout(()=>{ card.style.transition=''; }, 350);
      }
    }
    function flyOut(dir, cb){
      card.style.transition = 'transform .4s ease, opacity .4s ease';
      card.style.transform = `translateX(${dir*600}px) rotate(${dir*35}deg)`;
      card.style.opacity = '0';
      setTimeout(cb, 220);
    }
    function click(){
      if(moved) return; // was a drag, not a tap
      card.classList.toggle('flipped');
    }

    card.addEventListener('mousedown', pointerDown);
    window.addEventListener('mousemove', pointerMove);
    window.addEventListener('mouseup', pointerUp);
    card.addEventListener('touchstart', pointerDown, {passive:true});
    card.addEventListener('touchmove', pointerMove, {passive:false});
    card.addEventListener('touchend', pointerUp);
    card.addEventListener('click', click);
  }

  function startQuiz(ids, returnTab, mode){
    if(ids.length === 0) return;

  function shuffle(arr){
    const a = [...arr];
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function renderQuizQuestion(){
    if(timedRevealTimeout){ clearTimeout(timedRevealTimeout); timedRevealTimeout = null; }

    const word = byId[quizItems[quizIdx]];
    // build 4 options: correct + 3 distractors (shu viktorina o'z manbasidan, kifoya bo'lmasa hammasidan)
    const pool = quizPool.length >= 4 ? quizPool : WORDS.map(w=>w.id);
    let distractors = shuffle(pool.filter(id=>id!==word.id)).slice(0,3);
    const options = shuffle([word.id, ...distractors]);

    const modeLabel = quizType === 'romaji' ? "Kanjining romajisini toping" : "Kanjining ma'nosini toping";
    wrap.innerHTML = `

  // ---------- VAQT SINOVI (timed recall quiz) ----------
  // Markazda kanji chiqadi, 10 soniya beriladi; chiziq o'ng tarafdan chap
  // tarafga qarab kamayadi. Vaqt tugagach (yoki kartaga bosilsa) romaji va
  // tagida kichikroq tarjima ochiladi, so'ng keyingi so'zga o'tiladi.
  const TIMED_QUIZ_SECONDS = 10;
  const TIMED_QUIZ_URGENT_AT = 3; // oxirgi necha soniyada chiziq qizarib milt-milt qiladi
  function renderTimedQuizQuestion(){
    const wrap = document.getElementById('quizWrap');
    const word = byId[quizItems[quizIdx]];
    wrap.innerHTML = `
      <div class="quiz-progress">
        <span>Savol ${quizIdx+1} / ${quizItems.length}</span>

        <div class="qr-uz">${word.uz}</div>
      </div>
      <button class="quiz-timed-next" id="timedNext" disabled>Keyingisi →</button>
    `;
    const fill = document.getElementById('timedFill');
    const card = document.getElementById('timedCard');
    const nextBtn = document.getElementById('timedNext');
    let revealed = false;

    function reveal(){
      if(revealed) return;
      revealed = true;
      if(timedRevealTimeout){ clearTimeout(timedRevealTimeout); timedRevealTimeout = null; }
      if(timedUrgentTimeout){ clearTimeout(timedUrgentTimeout); timedUrgentTimeout = null; }
      fill.style.transition = 'none';
      fill.style.width = '0%';
      fill.classList.remove('urgent');
      document.getElementById('timedHint').classList.add('hidden');
      document.getElementById('timedReveal').classList.add('show');
      nextBtn.disabled = false;
    }

    // chiziqni o'ng tarafdan chap tarafga qarab kamaytirish
    requestAnimationFrame(()=>{
      fill.style.transition = `width ${TIMED_QUIZ_SECONDS}s linear`;
      fill.style.width = '0%';
    });
    timedRevealTimeout = setTimeout(reveal, TIMED_QUIZ_SECONDS * 1000);
    // oxirgi 3 soniyada chiziq qizarib, milt-milt qiladi
    timedUrgentTimeout = setTimeout(()=>{ fill.classList.add('urgent'); }, (TIMED_QUIZ_SECONDS - TIMED_QUIZ_URGENT_AT) * 1000);

    card.addEventListener('click', reveal);
    nextBtn.addEventListener('click', ()=>{
      quizIdx++;
      renderQuizQuestion();
    });
  }

  // ---------- TOVUSH EFFEKTLARI (Web Audio API, fayl talab qilmaydi) ----------
  let audioCtx = null;
  function getAudioCtx(){
    if(!audioCtx){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return null;
      audioCtx = new Ctx();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function playTone(freq, startOffset, duration, type, peakGain){
    const ctx = getAudioCtx();
    if(!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime + startOffset);
    gain.gain.setValueAtTime(0.0001, ctx.currentTime + startOffset);
    gain.gain.linearRampToValueAtTime(peakGain, ctx.currentTime + startOffset + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + startOffset + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime + startOffset);
    osc.stop(ctx.currentTime + startOffset + duration + 0.03);
  }
  function playCorrectSound(){
    try{
      playTone(659.25, 0,    0.14, 'sine', 0.15);  // E5
      playTone(987.77, 0.09, 0.24, 'sine', 0.15);  // B5 — yorqin, ijobiy jaranglash
    }catch(e){}
  }
  function playWrongSound(){
    try{
      playTone(196.00, 0,    0.26, 'sawtooth', 0.10); // G3
      playTone(174.61, 0.07, 0.30, 'sawtooth', 0.09); // F3 — past, xiralashgan tovush
    }catch(e){}
  }

  // ---------- SPLASH / INTRO ----------
  // yumshoq "ting" jiringlagan qo'ng'iroq ohangi — mavjud playTone infratuzilmasidan
  // foydalanadi (zen qo'ng'irog'iga o'xshash yumshoq, jaranglagan tovush)
  let introTingPlayed = false;
  function playTing(){
    try{
      // toza, iliq "ding" qo'ng'irog'i — ikkita uyg'un ton (kvinta oralig'ida),
      // biroz kechikib jaranglaydi va sekin-asta so'nadi; hech qanday
      // detune yoki tembr aralashmasi yo'q, shu bois toza va sokin eshitiladi
      playTone(587.33, 0,    1.5, 'sine', 0.20); // D5 — asosiy urg'u
      playTone(880.00, 0.14, 1.8, 'sine', 0.14); // A5 — mos keluvchi kvinta, davomli
    }catch(e){ /* audio ijozat berilmagan yoki qo'llab-quvvatlanmaydi — sezilmasdan o'tkazib yuboriladi */ }
  }
  // Brauzerlar sahifa ochilgan zahoti, foydalanuvchi hali birror joyga tegmasdan
  // turib tovush chiqarishga ruxsat bermaydi. Shu sababli avval urinib ko'ramiz;
  // agar brauzer bloklab qo'ysa (odatiy holat), foydalanuvchi ekranga birinchi
  // marta tegishi bilanoq — xuddi o'sha kirish animatsiyasi ohangi bir marta chalinadi.
  function tryPlayIntroTing(){
    if(introTingPlayed) return;
    const ctx = getAudioCtx();
    if(!ctx) return;
    if(ctx.state === 'running'){
      introTingPlayed = true;
      playTing();
    } else {
      ctx.resume().then(()=>{
        if(!introTingPlayed && ctx.state === 'running'){
          introTingPlayed = true;
          playTing();
        }
      }).catch(()=>{});
    }
  }
  // "Boshlash" tugmasi bosilganda chaqiriladi — bu haqiqiy foydalanuvchi
  // teginishi bo'lgani uchun brauzer tovushni bemalol ruxsat beradi.
  function hideSplash(evt){
    const splash = document.getElementById('splashScreen');
    if(!splash || splash.classList.contains('splash-hide')) return;

    // aynan bosilgan nuqtani aniqlaymiz — bo'lmasa (masalan xavfsizlik
    // taymeri chaqirsa) ekran markazini olamiz
    let ox = window.innerWidth / 2, oy = window.innerHeight / 2;
    if(evt){
      if(evt.changedTouches && evt.changedTouches.length){
        ox = evt.changedTouches[0].clientX; oy = evt.changedTouches[0].clientY;
      } else if(typeof evt.clientX === 'number' && (evt.clientX || evt.clientY)){
        ox = evt.clientX; oy = evt.clientY;
      }
    }
    document.documentElement.style.setProperty('--origin-x', ox + 'px');
    document.documentElement.style.setProperty('--origin-y', oy + 'px');

    splash.classList.add('splash-hide');
    const shell = document.getElementById('appShell');
    const flare = document.getElementById('introFlare');
    const ripple = document.getElementById('introRipple');

    if(ripple){
      ripple.classList.add('play');
      setTimeout(()=>ripple.classList.remove('play'), 950);
    }
    if(shell) shell.classList.add('app-shell-reveal');
    if(flare){
      flare.classList.add('play');
      tryPlayIntroTing();
      setTimeout(()=>flare.classList.remove('play'), 1400);
    }
    setTimeout(()=>{ splash.style.display = 'none'; }, 750);
  }
  // yuklanish tugagach shu funksiya chaqiriladi — endi ekran avtomatik yopilmaydi,
  // "Boshlash" tugmasi ko'rinadigan bo'ladi va foydalanuvchi bosishini kutadi
  function showStartButton(){
    const track = document.getElementById('splashBarTrack');
    const btn = document.getElementById('splashStartBtn');
    if(track) track.classList.add('splash-bar-fade');
    if(btn){
      btn.classList.add('show');
      btn.addEventListener('click', (e)=>hideSplash(e), {once:true});
    }
  }
  // xavfsizlik: nimadir noto'g'ri ketib, tugma hech qachon bosilmasa ham,
  // ilova abadiy osilib qolmasligi uchun (tovushsiz, sokin o'tadi)
  setTimeout(hideSplash, 20000);

  // ---------- INIT ----------
  (async function init(){
    const splashStart = Date.now();
    await loadState();
    showTab('learn');
    updateCounts();
    const MIN_SPLASH_MS = 2400;
    const wait = Math.max(0, MIN_SPLASH_MS - (Date.now() - splashStart));
    setTimeout(showStartButton, wait);
  })();

})();
</script>
</body>
</html>
