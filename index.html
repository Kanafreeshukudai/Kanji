<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;800&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#000000;
    --bg-2:#15181c;
    --ink:#ECE7DC;
    --ink-soft:#9BA1A6;
    --ink-faint:#6b7075;
    --panel-1:#1D2126;
    --panel-2:#24282e;
    --back-1:#152731;
    --back-2:#0d1b22;
    --accent:#D9694F;
    --accent-soft:#e5876f;
    --gold:#C9A66B;
    --moss:#7C9A6B;
    --moss-soft:#93b17f;
    --slate:#5C82A6;
    --plum:#9B6FA0;
    --card-w: min(84vw, 360px);
    --card-h: min(120vw, 460px);
    /* Kartochka aylanishi: darhol javob beradi (kutdirmaydi), oxirida uzoq va yumshoq tinchlanadi */
    --flip-dur: .72s;
    /* Simmetrik ease-in-out: avvalgi egri chiziq (.3,.8,.2,1) burilishning ~75% ini birinchi
       ~170ms da bajarib, qolganini sekin tinchlantirardi — old yuz bir zumda "uzilib" ketib,
       tepa/pastki chetlar sakrab, oxirida qotib qolgandek ko'rinardi. */
    --flip-ease: cubic-bezier(.37,0,.2,1);
    /* umumiy kontent kengligi — kichik ekranda 480px, katta ekranlarda
       pastdagi @media qoidalari orqali kengayadi, shu bilan kartochkalar
       katta ekranda markazdagi tor ustunga siqilib qolmaydi */
    --content-max: 480px;

    --glass-bg: rgba(255,255,255,0.07);
    --glass-bg-strong: rgba(255,255,255,0.12);
    --glass-border: rgba(255,255,255,0.32);
    --glass-border-soft: rgba(255,255,255,0.14);
    --glass-highlight: rgba(255,255,255,0.55);
    --glass-shadow: rgba(0,0,0,0.45);

    /* glass blur/saturation levels — kept as variables so low-power (lite) mode
       can cheaply turn every backdrop-filter down at once instead of editing
       each rule individually */
    --blur-1:14px;
    --blur-2:18px;
    --blur-3:20px;
    --blur-4:22px;
    --sat-1:150%;
    --sat-2:160%;
    --blob-blur:70px;
  }
  .splash-screen{
    position:fixed;
    inset:0;
    z-index:10000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:var(--bg-1);
    transition:opacity .75s cubic-bezier(.4,0,.2,1), filter .75s cubic-bezier(.4,0,.2,1), transform .75s cubic-bezier(.4,0,.2,1);
    transform-origin:var(--origin-x,50%) var(--origin-y,50%);
    touch-action:none;
    overscroll-behavior:none;
    overflow:hidden;
  }
  /* ---------- SUZUVCHI CHIZIQ (splash effekti) ----------
     Rangsiz (faqat --ink kulrang-oq tusda), o'zi chizilib, orqasi
     asta o'chib boruvchi bitta chiziq — ekran markazi atrofida tasodifiy
     yo'nalishda "suzadi", tezligi vaqti-vaqti bilan sekinlashib-tezlashib
     turadi. Barcha matn/tugmalar ORTIDA (z-index pastroq) joylashadi. */
  .splash-line-canvas{
    position:absolute;
    inset:0;
    z-index:0;
    pointer-events:none;
    display:block;
  }
  .splash-content{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    flex:1 1 auto;
    min-height:0;
    width:100%;
  }
  .splash-artwork, .splash-kanji-stage, .splash-title, .splash-sub, .splash-bar-track, .splash-login-btn, .splash-start-btn, .splash-credit{
    position:relative;
    z-index:1;
  }
  /* ---------- SPLASH ARTWORK (qo'shiq ustidagi rasm) ----------
     Kanji animatsiyasi (qo'shiq turgan joy) tepasida turadi va qo'shiqqa
     "nafas olayotgandek" mos ravishda ozgina yaqinlashib-uzoqlashib turadi —
     musiqaning zarb tempiga mos, silliq va sezilarsiz masofada. */
  /* Rasm + uning ortidan ramka o'lchamida tarqaladigan qizil to'lqinlar (bas urilganda) */
  .splash-artwork-wrap{
    position:relative;
    z-index:1;
    flex:none;
    width:132px;
    height:132px;
    margin-bottom:20px;
  }
  .splash-artwork-waves{
    position:absolute;
    inset:0;
    z-index:0;
    pointer-events:none;
  }
  .splash-wave{
    position:absolute;
    inset:0;
    border-radius:26px;
    border:2px solid rgba(240,72,62,0.9);
    box-shadow:0 0 14px 1px rgba(217,60,52,0.55), inset 0 0 12px rgba(217,60,52,0.35);
    opacity:0;
    transform:scale(1);
    will-change:transform, opacity;
    animation:splashWaveOut 0.95s cubic-bezier(.16,.7,.3,1) forwards;
  }
  @keyframes splashWaveOut{
    0%{ transform:scale(1);    opacity:var(--wa, 0.85); }
    100%{ transform:scale(1.95); opacity:0; }
  }
  html.perf .splash-wave{ box-shadow:none; }
  @media (prefers-reduced-motion: reduce){
    .splash-wave{ display:none; }
  }
  .splash-artwork{
    position:relative;
    z-index:1;
    width:132px;
    height:132px;
    margin-bottom:0;
    border-radius:26px;
    overflow:hidden;
    background:#000;
    border:2px solid #000;
    box-shadow:0 0 0 1px rgba(0,0,0,0.4), 0 18px 40px rgba(0,0,0,0.55), 0 0 70px calc(14px + var(--beat, 0) * 10px) rgba(217,60,52,calc(0.32 + var(--beat, 0) * 0.3));
    animation:splashArtworkPulse 1.05s ease-in-out infinite;
    animation-play-state:paused;
    will-change:transform;
  }
  /* Faqat qo'shiq chalinayotganda (play bosilganda) "nafas olish" animatsiyasi
     ishlaydi — pauza qilinganda to'xtaydi (statik holatda qoladi). */
  .splash-artwork.playing{
    animation-play-state:running;
  }
  .splash-artwork img{
    width:100%;
    height:100%;
    display:block;
    object-fit:contain;
    object-position:center center;
    pointer-events:none;
    user-select:none;
  }
  @keyframes splashArtworkPulse{
    0%, 100%{ transform:scale(1); box-shadow:0 0 0 1px rgba(0,0,0,0.4), 0 18px 40px rgba(0,0,0,0.55), 0 0 55px 10px rgba(217,60,52,0.26); }
    50%{ transform:scale(1.045); box-shadow:0 0 0 1px rgba(0,0,0,0.4), 0 18px 44px rgba(0,0,0,0.6), 0 0 95px 20px rgba(217,60,52,0.48); }
  }
  @media (prefers-reduced-motion: reduce){
    .splash-artwork{ animation:none !important; }
  }
  /* Splash ekrani ichidagi "Google bilan kirish" tugmasi — "Boshlash"
     tugmasidan tepada joylashadi */
  .splash-login-btn{
    margin-top:30px;
  }
  .splash-screen.splash-hide{
    opacity:0;
    filter:blur(22px) brightness(1.2);
    transform:scale(1.22);
    pointer-events:none;
  }
  .splash-kanji-stage{
    position:relative;
    width:130px;
    height:130px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .splash-kanji{
    position:absolute;
    font-family:'Shippori Mincho', serif;
    font-size:76px;
    color:var(--ink);
    text-shadow:0 0 30px rgba(201,166,107,0.35);
    opacity:0;
    animation:splashKanjiCycle 2.7s ease-in-out infinite;
  }
  .splash-kanji:nth-child(2){animation-delay:.9s;}
  .splash-kanji:nth-child(3){animation-delay:1.8s;}
  @keyframes splashKanjiCycle{
    0%{opacity:0; transform:scale(0.7) rotate(-4deg);}
    14%{opacity:1; transform:scale(1) rotate(0deg);}
    32%{opacity:1; transform:scale(1) rotate(0deg);}
    46%{opacity:0; transform:scale(1.18) rotate(3deg);}
    100%{opacity:0;}
  }
  .splash-title{
    margin-top:24px;
    font-family:'Shippori Mincho', serif;
    font-size:22px;
    letter-spacing:0.05em;
    color:var(--ink);
    opacity:0;
    animation:splashFadeUp .9s ease .35s forwards;
  }
  .splash-sub{
    margin-top:7px;
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--accent-soft);
    opacity:0;
    animation:splashFadeUp .9s ease .55s forwards;
  }
  @keyframes splashFadeUp{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  /* ---------- LOADING CHIZIG'I (haqiqiy yuklanishga bog'langan) ----------
     Matn chiziqning aynan markazida; chiziq to'lgan qismida matn rangi
     avtomatik to'q rangga o'tadi (ikki qatlamli matn + clip-path). */
  .splash-bar-track{
    --bar-w:min(250px, 70vw);
    position:relative;
    margin-top:30px;
    width:var(--bar-w);
    height:18px;
    border-radius:999px;
    background:linear-gradient(180deg, #f6f3ec, #d8d2c4);
    border:1px solid rgba(255,255,255,0.7);
    box-shadow:inset 0 2px 5px rgba(0,0,0,0.25), 0 0 0 1px rgba(0,0,0,0.35), 0 10px 26px -12px rgba(0,0,0,0.75);
    overflow:hidden;
    transition:opacity .5s ease, visibility .5s ease, transform .5s ease, box-shadow .5s ease;
    /* paydo bo'lish: fade bilan (backwards — yakunlangach class bilan boshqariladi) */
    animation:splashBarIn .6s ease backwards;
  }
  @keyframes splashBarIn{
    from{ opacity:0; transform:translateY(-4px) scale(0.97); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  .splash-bar-track.splash-bar-fade{opacity:0; transform:translateY(-4px) scale(0.97); pointer-events:none;}
  .splash-bar-track.is-done{box-shadow:inset 0 2px 6px rgba(0,0,0,0.4), 0 0 0 1px rgba(0,0,0,0.4), 0 0 24px rgba(201,166,107,0.5);}
  .splash-bar-label{
    position:absolute; inset:0; z-index:2;
    display:flex; align-items:center; justify-content:center;
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:10px; font-weight:800; letter-spacing:0.06em;
    white-space:nowrap; font-variant-numeric:tabular-nums; line-height:1;
    user-select:none; pointer-events:none;
  }
  .splash-bar-label.base{color:#000;}
  .splash-bar-fill{
    --rest:100%;
    position:absolute; inset:0;
    clip-path:inset(0 var(--rest) 0 0 round 999px);
    /* ilova palitrasidan iliq ranglar gradiyenti: 200% kenglikda, ikki marta takrorlanadi — siljish uzluksiz bo'ladi */
    background:linear-gradient(90deg,#E9C27D,#D9694F,#E5876F,#C9A66B,#F0D9A8,#C98A6B,#E9C27D,#D9694F,#E5876F,#C9A66B,#F0D9A8,#C98A6B,#E9C27D);
    background-size:200% 100%;
    animation:splashBarRainbow 2.2s linear infinite;
    overflow:hidden;
  }
  .splash-bar-label.top{color:#000;}
  @keyframes splashBarRainbow{
    from{background-position:0% 50%;}
    to{background-position:-100% 50%;}
  }
  .splash-bar-track.is-done .splash-bar-fill{animation:none;}
  .splash-bar-fill::after{
    content:""; position:absolute; top:0; bottom:0; left:-45%; width:45%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,0.42), transparent);
    animation:splashBarShine 1.5s ease-in-out infinite;
  }
  .splash-bar-track.is-done .splash-bar-fill::after{animation:none; opacity:0;}
  @keyframes splashBarShine{
    from{left:-45%;}
    to{left:100%;}
  }
  @media (prefers-reduced-motion: reduce){
    .splash-bar-fill::after{animation:none; opacity:0;}
    .splash-bar-fill{animation:none;}
  }
  .splash-start-btn{
    margin-top:30px;
    padding:12px 34px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.35);
    background:linear-gradient(135deg, var(--accent), var(--gold));
    color:#fff8ef;
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:800;
    font-size:14.5px;
    letter-spacing:0.03em;
    cursor:pointer;
    opacity:0;
    transform:translateY(12px) scale(0.94);
    pointer-events:none;
    transition:opacity .5s ease, transform .5s ease;
    box-shadow:0 10px 26px rgba(217,105,79,0.4);
    touch-action:manipulation;
  }
  .splash-start-btn.show{
    opacity:1;
    transform:translateY(0) scale(1);
    pointer-events:auto;
    animation:splashStartPulse 1.9s ease-in-out .5s infinite;
  }
  .splash-start-btn:active{transform:scale(0.93) !important; animation:none !important;}
  /* Google hisobiga kirilmagunga qadar "Boshlash" tugmasi bosilmaydigan
     va vizual jihatdan "o'chiq" ko'rinishda bo'ladi. */
  .splash-start-btn.show:disabled{
    opacity:0.4 !important;
    cursor:not-allowed;
    filter:grayscale(0.55);
    animation:none !important;
    box-shadow:none !important;
    pointer-events:none;
  }
  .splash-start-hint{
    margin-top:12px;
    max-width:260px;
    text-align:center;
    font-size:12.5px;
    line-height:1.4;
    color:var(--ink-soft);
    opacity:0;
    pointer-events:none;
    transition:opacity .5s ease;
  }
  .splash-start-hint.show{opacity:1;}
  @keyframes splashStartPulse{
    0%,100%{box-shadow:0 10px 26px rgba(217,105,79,0.4);}
    50%{box-shadow:0 10px 34px rgba(217,105,79,0.65);}
  }
  @media (prefers-reduced-motion: reduce){
    .splash-start-btn.show{animation:none !important;}
  }

  /* ---------- SPLASH MUSIC: PLAY/PAUSE TUGMASI + OYNAYOTGANLIK ANIMATSIYASI ----------
     Tugma va ostidagi "eqvalayzer" animatsiyasi bitta guruh (wrap) sifatida birga
     paydo bo'ladi/yashiriladi. Qo'shiq chalinayotganda ustunchalar zarb bilan
     tebranadi; pauza qilinganda tugma play belgisiga aylanadi va ustunchalar
     to'xtab, xiralashadi. */
  .splash-music-wrap{
    position:relative;
    z-index:1;
    margin-top:22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    opacity:0;
    transform:translateY(8px);
    transition:opacity .5s ease .15s, transform .5s ease .15s;
  }
  .splash-music-wrap.show{opacity:1; transform:translateY(0);}
  /* Zamonaviy "glass" kapsula: chapda aylana play/pause, o'rtada matn, o'ngda eqvalayzer */
  .splash-music-toggle{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:11px;
    height:46px;
    padding:6px 18px 6px 6px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.16);
    background:linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    backdrop-filter:blur(14px) saturate(140%);
    box-shadow:0 10px 28px -10px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.18);
    color:var(--ink);
    font-family:'Zen Maru Gothic', sans-serif;
    cursor:pointer;
    transition:transform .2s ease, border-color .3s ease, box-shadow .3s ease, background .3s ease;
    touch-action:manipulation;
  }
  @media (hover:hover){
    .splash-music-toggle:hover{border-color:rgba(201,166,107,0.5); box-shadow:0 12px 30px -10px rgba(0,0,0,0.7), 0 0 22px -6px rgba(201,166,107,0.35), inset 0 1px 0 rgba(255,255,255,0.22);}
  }
  .splash-music-toggle:active{transform:scale(0.95) !important;}
  .splash-music-disc{
    position:relative;
    flex:none;
    width:34px; height:34px;
    display:inline-flex; align-items:center; justify-content:center;
    border-radius:50%;
    background:linear-gradient(135deg, var(--accent), var(--gold));
    color:#fff8ef;
    box-shadow:0 4px 14px rgba(217,105,79,0.45), inset 0 1px 0 rgba(255,255,255,0.35);
    transition:background .3s ease, color .3s ease, box-shadow .3s ease;
  }
  .splash-music-disc::after{
    content:""; position:absolute; inset:-1px; border-radius:50%;
    border:1.5px solid rgba(201,166,107,0.55);
    animation:splashMusicRing 1.8s ease-out infinite;
    pointer-events:none;
  }
  @keyframes splashMusicRing{
    0%{transform:scale(1); opacity:.7;}
    100%{transform:scale(1.55); opacity:0;}
  }
  .splash-music-toggle svg{width:15px; height:15px; flex:none; display:block;}
  .splash-music-toggle .icon-play{display:none; margin-left:1.5px;}
  .splash-music-label{
    display:flex; flex-direction:column; align-items:flex-start; justify-content:center;
    line-height:1.15; text-align:left;
  }
  .splash-music-title{font-size:13px; font-weight:800; letter-spacing:0.04em; color:var(--ink);}
  .splash-music-state{font-size:10.5px; font-weight:500; color:var(--ink-soft); letter-spacing:0.02em;}
  .splash-music-state::before{content:"Ijroda";}
  .splash-music-eq{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:2.5px;
    height:16px;
    margin-left:2px;
  }
  .splash-music-eq span{
    width:2.5px;
    height:100%;
    border-radius:2px;
    background:linear-gradient(to top, var(--accent), var(--gold));
    transform-origin:center;
    animation:splashMusicEq 0.9s ease-in-out infinite;
  }
  .splash-music-eq span:nth-child(1){animation-delay:0s;}
  .splash-music-eq span:nth-child(2){animation-delay:0.15s;}
  .splash-music-eq span:nth-child(3){animation-delay:0.3s;}
  .splash-music-eq span:nth-child(4){animation-delay:0.45s;}
  @keyframes splashMusicEq{
    0%,100%{transform:scaleY(0.25);}
    50%{transform:scaleY(1);}
  }
  /* Pauza holati: disc shishasimon, ustunchalar to'xtaydi, matn "Pauza" bo'ladi */
  .splash-music-wrap.paused .splash-music-toggle{border-color:rgba(255,255,255,0.1); background:rgba(255,255,255,0.04);}
  .splash-music-wrap.paused .splash-music-disc{
    background:rgba(255,255,255,0.1); color:var(--ink-soft); box-shadow:inset 0 0 0 1px rgba(255,255,255,0.14);
  }
  .splash-music-wrap.paused .splash-music-disc::after{animation:none; opacity:0;}
  .splash-music-wrap.paused .icon-pause{display:none;}
  .splash-music-wrap.paused .icon-play{display:block;}

  position:absolute;
  top:26px;
  width:14px; height:16px;
  border-radius:50%;
  background:#2d1b4e;
  overflow:hidden;
  box-shadow:inset 0 1px 3px rgba(0,0,0,0.5), 0 0 4px rgba(157,78,221,0.3);
}
.mochi-eye.left{left:18px;}
.mochi-eye.right{right:18px;}
.mochi-pupil{
  position:absolute;
  top:3px; left:3px;
  width:6px; height:6px;
  border-radius:50%;
  background:#f3e5ff;
  transition:transform .15s ease-out;
}
.mochi-blush{
  position:absolute;
  top:40px;
  width:10px; height:5px;
  border-radius:50%;
  background:rgba(157,78,221,0.35);
  filter:blur(2px);
}
.mochi-blush.left{left:14px;}
.mochi-blush.right{right:14px;}
.mochi-mouth{
  position:absolute;
  top:44px; left:50%; transform:translateX(-50%);
  width:8px; height:4px;
  border-radius:0 0 8px 8px;
  border:1.5px solid #2d1b4e;
  border-top:none;
  background:transparent;
}
.mochi-shadow{
  position:absolute;
  bottom:-10px; left:50%; transform:translateX(-50%);
  width:50px; height:10px;
  border-radius:50%;
  background:rgba(60,20,100,0.25);
  filter:blur(4px);
  animation:mochiShadow 3s ease-in-out infinite;
}
/* Mochi hover reaction */
.mochi-wrap:hover .mochi-body{
  animation:mochiExcited .5s ease-in-out infinite;
}
.mochi-wrap:hover .mochi-shadow{
  animation:none;
  transform:translateX(-50%) scale(0.6);
  opacity:0.4;
}
/* Blink */
.mochi-eye.blink{
  animation:mochiBlink .25s ease-in-out;
}
/* ---------- MOCHI EXPRESSIONS: xursand & hafa ---------- */
/* Asosiy elementlarga silliq qaytish uchun transition */
.mochi-body{
  transition:background 0.8s ease, box-shadow 0.8s ease, filter 0.5s ease;
}
.mochi-eye{
  transition:height 0.55s ease, top 0.55s ease, border-radius 0.55s ease;
}
.mochi-mouth{
  transition:width 0.5s ease, height 0.5s ease, top 0.5s ease, border-radius 0.5s ease, border 0.5s ease, background 0.5s ease, opacity 0.5s ease, border-bottom 0.5s ease, border-top 0.5s ease;
}
.mochi-pupil{
  transition:transform 0.15s ease-out, top 0.45s ease, opacity 0.45s ease, left 0.45s ease;
}
.mochi-blush{
  transition:opacity 0.55s ease, width 0.55s ease, height 0.55s ease, top 0.55s ease, background 0.55s ease;
}
/* ---- HAPPY ---- */
.mochi-body.happy{
  background:radial-gradient(circle at 32% 28%, #f3e5ff 0%, #d8b4fe 30%, #c77dff 55%, #9d4edd 80%, #7b2cbf 100%);
  box-shadow:
    inset -4px -4px 12px rgba(0,0,0,0.15),
    inset 4px 4px 14px rgba(224,170,255,0.35),
    0 8px 32px rgba(157,78,221,0.65),
    0 3px 12px rgba(90,24,154,0.5),
    0 0 50px rgba(199,125,255,0.3);
  animation:mochiHappy .55s cubic-bezier(.34,1.56,.64,1) both;
}
.mochi-body.happy .mochi-mouth{
  width:14px; height:10px;
  border-radius:0 0 14px 14px;
  border:2px solid #2d1b4e;
  border-top:none;
  background:#9d4edd;
  top:42px;
  animation:mochiMouthHappy .4s ease both;
}
.mochi-body.happy .mochi-eye{
  height:18px;
  top:22px;
  animation:mochiEyeHappy .4s ease both;
}
.mochi-body.happy .mochi-blush{
  width:14px; height:7px;
  background:rgba(157,78,221,0.6);
  top:38px;
}
/* ---- SAD: jozibali, och kulrang-oltin, yoqimli ---- */
.mochi-body.sad{
  background:radial-gradient(circle at 32% 28%, #c8b8d8 0%, #a080c0 35%, #8060a8 70%, #604888 100%);
  box-shadow:
    inset -4px -4px 12px rgba(0,0,0,0.15),
    inset 4px 4px 14px rgba(200,180,255,0.15),
    0 6px 20px rgba(100,60,160,0.3),
    0 2px 6px rgba(0,0,0,0.2);
  animation:mochiSad .6s cubic-bezier(.34,1.56,.64,1) both;
}
/* Yoqimli kichik tushkun og'iz: pastga egilgan yumaloq chiziq */
.mochi-body.sad .mochi-mouth{
  width:10px;
  height:5px;
  border-radius:50%;
  background:transparent;
  border:none;
  border-bottom:2.5px solid #2d1b4e;
  top:46px;
  opacity:0.85;
  animation:mochiMouthSad .5s ease both;
}
/* Katta, yoqimli, biroz tushkun ko'zlar (puppy eyes) */
.mochi-body.sad .mochi-eye{
  height:14px;
  top:26px;
  border-radius:50% 50% 48% 48%;
  animation:mochiEyeSad .5s ease both;
}
/* Qorachiq biroz pastga qarab turadi */
.mochi-body.sad .mochi-pupil{
  top:5px;
  left:2px;
  opacity:0.75;
}
/* Xijolat blush biroz xira */
.mochi-body.sad .mochi-blush{
  opacity:0.30;
  width:11px;
  height:5px;
  top:40px;
  background:rgba(157,78,221,0.35);
}
/* ---------- MOCHI SLEEP: Flashcard'da uxlaydi ---------- */
.mochi-body.sleep{
  background:radial-gradient(circle at 32% 28%, #d0c0e8 0%, #b0a0d0 35%, #9080b8 70%, #706098 100%);
  box-shadow:
    inset -4px -4px 12px rgba(0,0,0,0.12),
    inset 4px 4px 14px rgba(200,180,255,0.12),
    0 6px 18px rgba(100,70,160,0.22),
    0 2px 5px rgba(0,0,0,0.15);
  animation:mochiSleep 0.8s ease both;
}
/* Yumiq ko'zlar — oddiy, chiroyli, xotirjam uyqu */
.mochi-body.sleep .mochi-eye{
  width:14px;
  height:14px;
  top:26px;
  border-radius:50%;
  background:transparent;
  box-shadow:none;
  overflow:visible;
  border:none;
}
.mochi-body.sleep .mochi-eye.left{ left:16px; }
.mochi-body.sleep .mochi-eye.right{ right:16px; }
/* Yumshoq, yuqoriga egilgan qovoq chizig'i — xursandchilik bilan */
.mochi-body.sleep .mochi-eye::before{
  content:'';
  position:absolute;
  top:6px; left:0; right:0;
  height:2px;
  background:#2d1b4e;
  border-radius:999px;
  opacity:0.7;
}
/* Pupil yashirin */
.mochi-body.sleep .mochi-pupil{
  opacity:0;
}
.mochi-body.sleep .mochi-pupil{
  opacity:0;
}
.mochi-body.sleep .mochi-mouth{
  width:6px; height:3px;
  border-radius:0 0 6px 6px;
  border:1.2px solid #2d1b4e;
  border-top:none;
  top:46px;
  opacity:0.7;
}
.mochi-body.sleep .mochi-blush{
  opacity:0.20;
  width:9px; height:4px;
  top:40px;
}
.mochi-body.sleep .mochi-shine{
  opacity:0.25;
}
/* Mochi speaking animation */
.mochi-body.speaking .mochi-mouth{
  width:10px; height:8px;
  border-radius:50%;
  background:#2d1b4e;
  border:none;
  animation:speakMouth 0.25s ease-in-out infinite alternate;
}
.mochi-body.speaking .mochi-eye{
  height:16px;
  animation:speakEye 2s ease-in-out infinite;
}
/* Mochi thinking */
.mochi-body.thinking .mochi-eye{
  background:transparent;
  border:2px solid #2d1b4e;
  border-radius:50%;
  box-shadow:none;
  height:14px;
}
.mochi-body.thinking .mochi-eye::before{
  content:'';
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  width:8px; height:2px;
  background:#2d1b4e;
  border-radius:999px;
}
.mochi-body.thinking .mochi-pupil{opacity:0;}
.mochi-body.thinking .mochi-mouth{
  width:6px; height:3px;
  border-radius:50%;
  background:#2d1b4e;
  border:none;
  top:48px;
}
.mochi-body{
  animation:mochiBreathe 3s ease-in-out infinite, neonPulse 4s ease-in-out infinite;
}
/* Override for states that have their own animations */
.mochi-body.happy{
  animation:mochiHappy .55s cubic-bezier(.34,1.56,.64,1) both, neonPulse 2s ease-in-out infinite;
}
.mochi-body.sad{
  animation:mochiSad .6s cubic-bezier(.34,1.56,.64,1) both;
  filter:grayscale(0.3) brightness(0.85);
}
.mochi-body.sleep{
  animation:mochiSleep 0.8s ease both;
  filter:brightness(0.75) saturate(0.7);
}
.mochi-body.speaking{
  filter:drop-shadow(0 0 15px rgba(157,78,221,0.6)) drop-shadow(0 0 40px rgba(123,44,191,0.3));
}
.mochi-body.thinking{
  filter:drop-shadow(0 0 10px rgba(157,78,221,0.4));
}
@keyframes mochiBlink{
  0%,100%{transform:scaleY(1);}
  50%{transform:scaleY(0.1);}
}
@keyframes mochiBreathe{
  0%,100%{transform:scale(1) translateY(0);}
  50%{transform:scale(1.04) translateY(-3px);}
}
@keyframes mochiExcited{
  0%,100%{transform:scale(1.08) translateY(-4px); filter: brightness(1.1);}
  50%{transform:scale(1.12) translateY(-8px); filter: brightness(1.25) drop-shadow(0 0 20px rgba(157,78,221,0.6));}
}
@keyframes mochiEyeHappy{
  from{height:16px; top:26px;}
  to{height:18px; top:22px;}
}
@keyframes mochiEyeSad{
  from{height:16px; top:26px; border-radius:50%;}
  to{height:14px; top:26px; border-radius:50% 50% 48% 48%;}
}
@keyframes mochiHappy{
  0%{transform:scale(1) translateY(0);}
  40%{transform:scale(1.18) translateY(-14px);}
  70%{transform:scale(1.08) translateY(-6px);}
  100%{transform:scale(1.1) translateY(-8px);}
}
@keyframes mochiMouthHappy{
  from{width:8px; height:4px; border-radius:0 0 8px 8px;}
  to{width:14px; height:10px; border-radius:0 0 14px 14px;}
}
@keyframes mochiMouthSad{
  from{width:8px; height:4px; border-bottom:1.5px solid #1a1208; top:44px; opacity:0.4;}
  to{width:10px; height:5px; border-bottom:2.5px solid #2d1b4e; top:46px; opacity:0.85;}
}
@keyframes mochiSad{
  0%{transform:scale(1) translateY(0);}
  40%{transform:scale(0.96) translateY(3px);}
  100%{transform:scale(0.97) translateY(2px);}
}
@keyframes mochiShadow{
  0%,100%{transform:translateX(-50%) scale(1); opacity:1;}
  50%{transform:translateX(-50%) scale(0.75); opacity:0.55;}
}
@keyframes mochiSleep{
  0%{transform:scale(1) translateY(0);}
  100%{transform:scale(0.98) translateY(2px);}
}
@keyframes neonPulse{
  0%,100%{filter:drop-shadow(0 0 8px rgba(157,78,221,0.3)) drop-shadow(0 0 20px rgba(123,44,191,0.15));}
  50%{filter:drop-shadow(0 0 12px rgba(157,78,221,0.5)) drop-shadow(0 0 30px rgba(123,44,191,0.25));}
}
@keyframes speakEye{
  0%,100%{transform:scaleY(1);}
  50%{transform:scaleY(1.05);}
}
@keyframes speakMouth{
  from{transform:translateX(-50%) scaleY(0.6);}
  to{transform:translateX(-50%) scaleY(1.2);}
}

<script>
/* ---------- YUKLANISH CHIZIG'I (haqiqiy yuklanishga bog'liq) ---------- */
(function(){
  var W = {dom:10, load:25, fonts:25, art:20, audio:10, auth:10};
  var done = {}, cbs = [], finished = false, shown = 0, t0 = Date.now(), lastP = -1;
  var track = document.getElementById('splashBarTrack');
  var fill = document.getElementById('splashBarFill');
  var lb = document.getElementById('splashBarLabelBase');
  var lt = document.getElementById('splashBarLabelTop');
  function mark(n){ if(W[n]) done[n] = true; }
  function doneW(){ var s = 0; for(var k in done) s += W[k]; return s; }
  function paint(){
    var p = Math.min(100, Math.floor(shown));
    if(p === lastP) return;
    lastP = p;
    var txt = p >= 100 ? 'Tayyor ✓' : ('Yuklanmoqda… ' + p + '%');
    if(fill) fill.style.setProperty('--rest', (100 - Math.min(100, shown)).toFixed(2) + '%');
    if(lb) lb.textContent = txt;
    if(lt) lt.textContent = txt;
    if(track) track.setAttribute('aria-valuenow', String(p));
  }
  function finish(){
    if(finished) return;
    finished = true;
    clearInterval(timer);
    if(track) track.classList.add('is-done');
    setTimeout(function(){ var l = cbs.splice(0); l.forEach(function(f){ try{ f(); }catch(e){} }); }, 420);
  }
  function tick(){
    var dw = doneW(), ad = dw >= 100, pend = 100 - dw;
    var allowance = pend * 0.3 * (1 - Math.exp(-(Date.now() - t0) / 4000));
    var tgt = ad ? 100 : Math.min(99, dw + allowance);
    if(tgt > shown) shown = Math.min(tgt, shown + Math.max((tgt - shown) * 0.08, 0.35));
    paint();
    if(ad && shown >= 99.99){ shown = 100; paint(); finish(); }
  }
  var timer = setInterval(tick, 40);

  mark('dom');
  if(document.readyState === 'complete') mark('load');
  else window.addEventListener('load', function(){ mark('load'); });

  if(document.fonts && document.fonts.ready){
    Promise.race([document.fonts.ready, new Promise(function(r){ setTimeout(r, 3000); })])
      .then(function(){ mark('fonts'); });
  } else { mark('fonts'); }

  (function art(){
    var img = document.querySelector('#splashArtwork img');
    var ok = function(){ mark('art'); };
    if(!img || img.complete) ok();
    else { img.addEventListener('load', ok); img.addEventListener('error', ok); }
  })();

  (function audio(){
    var a = document.getElementById('splashPhonkAudio');
    var ok = function(){ mark('audio'); };
    if(!a || a.readyState >= 2){ ok(); return; }
    ['loadeddata','canplay','canplaythrough','error','abort'].forEach(function(ev){ a.addEventListener(ev, ok, {once:true}); });
    setTimeout(ok, 3500);
  })();

  // auth: module (Firebase) birinchi holatni aniqlaganda chaqiradi; aks holda 8s dan keyin o'tadi
  setTimeout(function(){ mark('auth'); }, 8000);

  window.__splashLoader = {
    done: mark,
    whenDone: function(cb){ if(finished) cb(); else cbs.push(cb); }
  };
  window.__splashLoader.whenDone(function(){
    if(track) track.classList.add('faded');   // joy saqlanadi, faqat ko'rinmaydi
    window.__loaderDone = true;
    if(window.__startRefreshMenu) window.__startRefreshMenu();
  });
})();
</script>
<script>
  const SplashLineFX = (function(){
    let canvas, ctx, W=0, H=0, dpr=1;
    let rafId=null, lastT=null, running=false, resizeHandler=null;
    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // har bir chiziq o'ziga xos parametrlar bilan — shu sabab ikkinchisi
    // birinchisiga o'xshab yurmaydi (boshqa tezlik oralig'i, boshqa
    // to'lqin chastotalari, boshqa burilish xarakteri, boshqa radius,
    // boshqa iz masofasi)
    const lines = [
      { // 1-chiziq — asosiy, o'rtacha tezlik, keng radius, uzunroq iz
        x:0, y:0, angle:0, spA:0, spB:0, tp:0,
        spAFreq:0.55, spBFreq:1.35, tpFreq:0.7, turnJitter:0.5, turnAmp:0.9,
        baseSpeed:14, speedRange:46, radiusFactor:0.34, steerBack:0.05,
        alpha:0.5, width:1.4, trailDist:230, trail:[]
      },
      { // 2-chiziq — sekinroq boshlanadi, keskinroq burilib turadi,
        // to'lqinlari butunlay boshqa chastotada, izi ham qisqaroq —
        // mustaqil xarakter
        x:0, y:0, angle:0, spA:0, spB:0, tp:0,
        spAFreq:0.31, spBFreq:0.92, tpFreq:1.6, turnJitter:1.1, turnAmp:0.5,
        baseSpeed:6, speedRange:34, radiusFactor:0.24, steerBack:0.08,
        alpha:0.36, width:1.1, trailDist:150, trail:[]
      },
      { // 3-chiziq — tezroq va kengroq radiusda suzadi, iz o'rtacha
        // uzunlikda, to'lqin chastotalari 1 va 2-chiziqdan farqli
        x:0, y:0, angle:0, spA:0, spB:0, tp:0,
        spAFreq:0.42, spBFreq:1.65, tpFreq:1.05, turnJitter:0.75, turnAmp:0.7,
        baseSpeed:20, speedRange:38, radiusFactor:0.42, steerBack:0.06,
        alpha:0.3, width:1.2, trailDist:190, trail:[]
      },
      { // 4-chiziq — eng sekin va nozik, ingichka iz, kichikroq radiusda
        // asta suzadi — orqa fonga qo'shimcha chuqurlik beradi
        x:0, y:0, angle:0, spA:0, spB:0, tp:0,
        spAFreq:0.22, spBFreq:0.68, tpFreq:0.45, turnJitter:0.35, turnAmp:1.15,
        baseSpeed:9, speedRange:22, radiusFactor:0.18, steerBack:0.1,
        alpha:0.22, width:1.0, trailDist:120, trail:[]
      }
    ];

    function resize(){
      dpr = document.documentElement.classList.contains('perf') ? 1 : Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = Math.max(1, Math.round(W*dpr));
      canvas.height = Math.max(1, Math.round(H*dpr));
      canvas.style.width = W+'px';
      canvas.style.height = H+'px';
      ctx.setTransform(dpr,0,0,dpr,0,0);
    }

    // eskirgan, belgilangan masofadan (trailDist) uzoqroq qolgan
    // nuqtalarni ro'yxatdan butunlay olib tashlaydi — shu bilan iz
    // aynan shu masofada tugaydi, undan keyin hech narsa qolmaydi
    function trimTrail(L){
      let total = 0;
      for(let i=L.trail.length-1;i>0;i--){
        const a = L.trail[i], b = L.trail[i-1];
        const dx = a.x-b.x, dy = a.y-b.y;
        total += Math.sqrt(dx*dx+dy*dy);
        if(total > L.trailDist){
          L.trail.splice(0, i);
          return;
        }
      }
    }

    function stepLine(L, dt){
      L.spA += dt*L.spAFreq;
      L.spB += dt*L.spBFreq;
      L.tp  += dt*L.tpFreq;
      const wave = (Math.sin(L.spA)*0.5+0.5)*0.75 + (Math.sin(L.spB)*0.5+0.5)*0.45;
      const speed = L.baseSpeed + wave*L.speedRange;

      L.angle += (Math.sin(L.tp)*L.turnAmp + (Math.random()-0.5)*L.turnJitter) * dt;

      const nx = L.x + Math.cos(L.angle)*speed*dt;
      const ny = L.y + Math.sin(L.angle)*speed*dt;

      const cx = W/2, cy = H/2;
      const maxR = Math.min(W,H)*L.radiusFactor;
      const dx = nx-cx, dy = ny-cy;
      if(Math.sqrt(dx*dx+dy*dy) > maxR){
        const toCenter = Math.atan2(cy-ny, cx-nx);
        let diff = toCenter - L.angle;
        while(diff > Math.PI) diff -= Math.PI*2;
        while(diff < -Math.PI) diff += Math.PI*2;
        L.angle += diff * L.steerBack;
      }

      L.x = nx; L.y = ny;
      L.trail.push({x:nx, y:ny});
      trimTrail(L);

      // iz bo'ylab — eng eskisi (dumi) butunlay ko'rinmas (alpha 0)
      // dan boshlab, eng yangi uchigacha asta yorqinlashib boradi
      const n = L.trail.length;
      for(let i=1;i<n;i++){
        const t = i/(n-1); // 0 = dum (eng eski), 1 = bosh (eng yangi)
        const a = L.alpha * t*t;
        if(a <= 0.003) continue;
        ctx.strokeStyle = `rgba(236,231,220,${a})`; // --ink — rangsiz, kulrang-oq
        ctx.lineWidth = L.width;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(L.trail[i-1].x, L.trail[i-1].y);
        ctx.lineTo(L.trail[i].x, L.trail[i].y);
        ctx.stroke();
      }
    }

    function step(ts){
      if(!running) return;
      if(lastT !== null && ts - lastT < 40 && document.documentElement.classList.contains('perf')){
        rafId = requestAnimationFrame(step);   // yengil rejim: ~24fps
        return;
      }
      if(lastT === null) lastT = ts;
      let dt = (ts - lastT)/1000;
      lastT = ts;
      if(dt > 0.1) dt = 0.1;

      // har kadrda TO'LIQ tozalash — hech qanday qoldiq/xira dog'
      // yig'ilib qolmaydi, faqat hozir "tirik" (trailDist ichidagi)
      // qism qayta chiziladi
      ctx.clearRect(0,0,W,H);

      lines.forEach(L=>stepLine(L, dt));

      rafId = requestAnimationFrame(step);
    }

    function start(){
      canvas = document.getElementById('splashLineCanvas');
      if(!canvas || !canvas.getContext || reduceMotion || document.documentElement.classList.contains('perf')) return;
      ctx = canvas.getContext('2d', { alpha: true });
      resize();
      lines.forEach((L)=>{
        L.x = W/2; L.y = H/2;
        L.angle = Math.random()*Math.PI*2;
        L.trail = [{x:L.x, y:L.y}];
      });
      resizeHandler = ()=>{ if(running) resize(); };
      window.addEventListener('resize', resizeHandler, {passive:true});
      running = true;
      lastT = null;
      rafId = requestAnimationFrame(step);
    }

    function stop(){
      running = false;
      if(rafId) cancelAnimationFrame(rafId);
      if(resizeHandler) window.removeEventListener('resize', resizeHandler);
    }

    return { start, stop };
  })();
  SplashLineFX.start(); // splash ekrani ko'rinishi bilanoq boshlanadi
</script>
<script>
  // ---------- RASMNING MUSIQA RITMIGA HAMOHANG "ZARBA" ANIMATSIYASI ----------
  // Ilgari rasm shunchaki belgilangan 1.05s tsiklda pulslardi (haqiqiy
  // qo'shiqqa bog'liq emas edi). Endi Web Audio API orqali haqiqiy audio
  // oqimining bas (past chastota) energiyasi har kadrda o'lchanadi va har bir
  // zarb (kick/bass hit) sezilganda rasm bir zumda "ezilib" yaqinlashadi,
  // so'ng tabiiy tarzda asta uzoqlashib (kichrayib) yana tinch holatga
  // qaytadi — xuddi ekvalayzer indikatorlari kabi qo'shiqning o'ziga qarab.
  const BeatSync = (function(){
    const audio = document.getElementById('splashPhonkAudio');
    const artwork = document.getElementById('splashArtwork');
    const waves = document.getElementById('splashArtworkWaves');
    const AudioCtor = window.AudioContext || window.webkitAudioContext;
    if(!audio || !artwork || !AudioCtor) return { start(){}, stop(){} };
    // Harakatni kamaytirish yoqilgan bo'lsa rasm qimirlamaydi
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      return { start(){}, stop(){} };
    }

    let ctx = null, source = null, lowpass = null, analyser = null, sink = null, timeData = null;
    let ready = false, graphFailed = false, useFloat = false;
    let rafId = null, lastT = 0;
    let punch = 0;          // zarbadan keyin tez so'nadigan "ezilish" kuchi (0..1)
    let level = 0;          // bas balandligiga qarab silliq o'zgaruvchi doimiy komponent (0..1)
    let avg = 0;            // bas energiyasining qisqa o'rtachasi (~0.5s)
    let peak = 0.02;        // bas energiyasining sekin so'nuvchi cho'qqisi (normallashtirish uchun)
    let prevE = 0, lastBeat = 0, silentFrames = 0, fallback = false;

    const MIN_BEAT_INTERVAL_MS = 230; // ketma-ket zarblar orasidagi eng kichik oraliq
    const PUNCH_DECAY = 0.88;         // 60fps dagi har kadr uchun so'nish (kadr tezligiga qarab moslanadi)
    const MAX_SCALE_DELTA = 0.085;    // eng kuchli zarbdagi maksimal kattalashuv
    const BEAT_RATIO = 1.25;          // lahzalik energiya qisqa o'rtachadan necha barobar oshsa — zarb
    const ENERGY_FLOOR = 0.012;       // bundan past (deyarli jimlik) bo'lsa zarb sanalmaydi
    const SILENT_LIMIT = 0.0008;      // bundan past energiya — "tahlil ishlamayapti yoki jimlik"

    function ensureGraph(){
      if(ready) return true;
      if(graphFailed) return false;
      try{
        ctx = new AudioCtor();
        source = ctx.createMediaElementSource(audio);
      }catch(e){
        // Bu bosqichda xato bo'lsa audio element o'z holicha chalinaveradi
        ctx = null; source = null; graphFailed = true;
        return false;
      }
      try{
        // Eshitiladigan yo'l: source -> destination (o'zgarishsiz).
        // Tahlil yo'li: source -> past chastotali filtr (kick/bas) -> analyser (ovozsiz).
        lowpass = ctx.createBiquadFilter();
        lowpass.type = 'lowpass';
        lowpass.frequency.value = 150;
        lowpass.Q.value = 0.7;
        analyser = ctx.createAnalyser();
        analyser.fftSize = 1024;
        analyser.smoothingTimeConstant = 0;
        sink = ctx.createGain();
        sink.gain.value = 0;
        source.connect(ctx.destination);
        source.connect(lowpass);
        lowpass.connect(analyser);
        analyser.connect(sink);
        sink.connect(ctx.destination);
        useFloat = typeof analyser.getFloatTimeDomainData === 'function';
        timeData = useFloat ? new Float32Array(analyser.fftSize) : new Uint8Array(analyser.fftSize);
        ready = true;
        return true;
      }catch(e){
        try{ source.connect(ctx.destination); }catch(_){}
        graphFailed = true;
        return false;
      }
    }

    // Filtrlangan (faqat bas) signalning haqiqiy amplitudasi — RMS (chiziqli shkala)
    function bassRms(){
      let sum = 0;
      const n = timeData.length;
      if(useFloat){
        analyser.getFloatTimeDomainData(timeData);
        for(let i = 0; i < n; i++){ const v = timeData[i]; sum += v * v; }
      } else {
        analyser.getByteTimeDomainData(timeData);
        for(let i = 0; i < n; i++){ const v = (timeData[i] - 128) / 128; sum += v * v; }
      }
      return Math.sqrt(sum / n);
    }

    // Tahlil ishlamasa (AudioContext uxlab qolgan, audio cheklangan va h.k.) rasm qotib
    // qolmasligi uchun eski CSS "nafas olish" animatsiyasiga qaytamiz.
    // Bas urilganda rasm ramkasi o'lchamida qizil to'lqin chiqaradi (tashqariga kengayib so'nadi)
    const MAX_WAVES = 5;
    function spawnWave(strength){
      if(!waves) return;
      while(waves.childElementCount >= MAX_WAVES) waves.removeChild(waves.firstChild);
      const w = document.createElement('div');
      w.className = 'splash-wave';
      w.style.setProperty('--wa', (0.5 + 0.45 * strength).toFixed(2));
      w.addEventListener('animationend', ()=>{ if(w.parentNode) w.parentNode.removeChild(w); }, {once:true});
      waves.appendChild(w);
    }

    function enterFallback(){
      if(fallback) return;
      fallback = true;
      artwork.style.transform = '';
      artwork.style.removeProperty('--beat');
      artwork.style.animation = '';
    }
    function exitFallback(){
      if(!fallback) return;
      fallback = false;
      artwork.style.animation = 'none';
    }

    function loop(now){
      rafId = requestAnimationFrame(loop);
      const dt = Math.min(3, lastT ? (now - lastT) / 16.667 : 1);
      lastT = now;
      if(!ready || audio.paused) return;
      if(ctx.state === 'suspended'){ ctx.resume().catch(()=>{}); }

      const e = bassRms();

      // Jimlik / tahlil ishlamayotganini aniqlash
      if(e < SILENT_LIMIT){
        silentFrames++;
        if(silentFrames > 60 && audio.currentTime > 0.5 && audio.volume > 0.3) enterFallback();
      } else {
        silentFrames = 0;
        if(fallback) exitFallback();
      }
      if(fallback) return;

      // Moslashuvchan o'lchamlar: cho'qqi sekin so'nadi, o'rtacha tez yangilanadi
      peak = Math.max(0.01, e, peak * Math.pow(0.997, dt));
      avg += (e - avg) * (1 - Math.pow(0.97, dt));

      const rising = e > prevE;
      prevE = e;
      if(rising && e > avg * BEAT_RATIO && e > ENERGY_FLOOR && e > peak * 0.35 && (now - lastBeat) > MIN_BEAT_INTERVAL_MS){
        lastBeat = now;
        punch = Math.min(1, 0.55 + 0.45 * (e / peak)); // kuchli zarb — kuchliroq "ezilish"
        spawnWave(punch);                              // shu zarbda qizil to'lqin ham tarqaladi
      }
      punch *= Math.pow(PUNCH_DECAY, dt);

      // Zarb aniqlanmay qolsa ham rasm bas balandligiga qarab silliq harakatlanadi
      const n = Math.min(1, e / peak);
      const target = n * n;
      level += (target - level) * (1 - Math.pow(target > level ? 0.5 : 0.85, dt));

      const drive = Math.max(punch, level * 0.5);
      artwork.style.transform = 'scale(' + (1 + drive * MAX_SCALE_DELTA).toFixed(4) + ')';
      artwork.style.setProperty('--beat', drive.toFixed(3)); // nur (glow) ham ritmga mos
    }

    // Brauzer/iOS audio kontekstni to'xtatib qo'ygan bo'lsa — teginishda qayta yoqamiz
    document.addEventListener('pointerdown', ()=>{
      if(ctx && ctx.state === 'suspended' && !audio.paused) ctx.resume().catch(()=>{});
    }, {passive:true});

    function resetState(){
      punch = 0; level = 0; avg = 0; peak = 0.02; prevE = 0;
      lastBeat = 0; silentFrames = 0; fallback = false; lastT = 0;
    }

    return {
      start(){
        if(!ensureGraph()) return; // tahlil imkonsiz bo'lsa — eski CSS puls animatsiyasi ishlayveradi
        if(ctx.state === 'suspended') ctx.resume().catch(()=>{});
        resetState();
        // Endi rasmni JS boshqaradi — statik CSS puls animatsiyasi o'chiriladi
        artwork.style.animation = 'none';
        if(!rafId) rafId = requestAnimationFrame(loop);
      },
      stop(){
        if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
        artwork.style.transform = '';
        artwork.style.animation = '';
        artwork.style.removeProperty('--beat');
        if(waves) waves.textContent = '';
        resetState();
      }
    };
  })();

  // ---------- SPLASH PHONK MUSIQA ----------
  // Sahifa ochilishi bilan (avtoplay siyosati ruxsat bersa) qisqa phonk
  // klipni pastdan yuqoriga sekin ovoz bilan chalamiz; brauzer avtomatik
  // ijroni bloklasa, birinchi teginish/bosishda o'zi ishga tushadi.
  // "Boshlash" bosilganda musiqa asta pasayib to'xtaydi.
  const PhonkFX = window.PhonkFX = (function(){
    const audio = document.getElementById('splashPhonkAudio');
    const toggle = document.getElementById('splashMusicToggle');
    const wrap = document.getElementById('splashMusicWrap');
    const artwork = document.getElementById('splashArtwork');
    if(!audio || !toggle) return {fadeOutAndStop(){}, pauseForApp(){}, resumeFromApp(){}};

    const TARGET_VOLUME = 0.55;
    let userPaused = false; // foydalanuvchi tugma bilan to'xtatganmi
    let started = false;
    let fadeTimer = null;
    // "Boshlash" bosilgach butunlay to'xtatilganini bildiradi — shundan keyin
    // audio.play() ning kechikib kelgan (async) va'dasi ham qo'shiqni qayta
    // yoqib yubormasligi uchun kerak (aks holda ba'zida musiqa "qolib ketardi")
    let stopped = false;
    let pausedByApp = false; // kanji/lug'at ochilganda vaqtincha to'xtatilganmi

    audio.volume = 0;

    function setToggleState(){
      const showPaused = userPaused || audio.paused;
      if(wrap) wrap.classList.toggle('paused', showPaused);
      if(artwork) artwork.classList.toggle('playing', !showPaused);
      toggle.setAttribute('aria-pressed', showPaused ? 'false' : 'true');
      toggle.setAttribute('aria-label', showPaused ? "Qo'shiqni davom ettirish" : "Qo'shiqni pauza qilish");
    }

    function fadeTo(target, ms, onDone){
      if(fadeTimer) clearInterval(fadeTimer);
      const steps = 20;
      const stepMs = Math.max(16, ms / steps);
      const startVol = audio.volume;
      const diff = target - startVol;
      let i = 0;
      fadeTimer = setInterval(()=>{
        i++;
        audio.volume = Math.max(0, Math.min(1, startVol + diff * (i/steps)));
        if(i >= steps){
          clearInterval(fadeTimer);
          fadeTimer = null;
          if(onDone) onDone();
        }
      }, stepMs);
    }

    function tryStart(){
      if(started || userPaused || stopped) return;
      const p = audio.play();
      if(p && typeof p.then === 'function'){
        p.then(()=>{
          // "Boshlash" bosilib ulgurgan bo'lsa (play() va'dasi kech kelgan
          // bo'lsa ham) — musiqani qayta yoqmasdan, darhol to'xtatamiz
          if(stopped){ try{ audio.pause(); }catch(e){} return; }
          started = true;
          fadeTo(TARGET_VOLUME, 900);
          setToggleState();
          BeatSync.start();
        }).catch(()=>{
          // Avtoplay bloklandi — birinchi foydalanuvchi teginishida qayta urinamiz
        });
      } else {
        if(stopped){ try{ audio.pause(); }catch(e){} return; }
        started = true;
        fadeTo(TARGET_VOLUME, 900);
        setToggleState();
        BeatSync.start();
      }
    }

    // Sahifa yuklanganda darrov urinib ko'ramiz
    tryStart();
    // Bloklangan bo'lsa — birinchi teginish/bosish/tugma zarbida ishga tushamiz
    ['pointerdown', 'keydown', 'touchstart'].forEach(evt=>{
      document.addEventListener(evt, tryStart, {once:true, passive:true});
    });

    // Play/Pause (davom ettirish) tugmasi — qo'shiqni haqiqatan pauza/davom qiladi
    toggle.addEventListener('click', ()=>{
      if(audio.paused){
        userPaused = false;
        started = false;
        tryStart();
      } else {
        userPaused = true;
        fadeTo(0, 300, ()=>{ audio.pause(); BeatSync.stop(); });
      }
      setToggleState();
    });

    setToggleState();

    return {
      pauseForApp(){
        if(audio.paused){ pausedByApp = false; return; }
        pausedByApp = true;
        if(fadeTimer) clearInterval(fadeTimer);
        fadeTo(0, 250, ()=>{ try{ audio.pause(); }catch(e){} BeatSync.stop(); });
      },
      resumeFromApp(){
        if(!pausedByApp) return;
        pausedByApp = false;
        if(userPaused || stopped) return;
        const p = audio.play();
        if(p && p.catch) p.catch(()=>{});
        fadeTo(TARGET_VOLUME, 600);
        setToggleState();
        BeatSync.start();
      },
      fadeOutAndStop(ms){
        stopped = true;
        userPaused = true;
        if(fadeTimer) clearInterval(fadeTimer);
        fadeTo(0, ms || 700, ()=>{
          try{
            audio.pause();
            audio.currentTime = 0; // keyingi safar tasodifan qayta ishga tushsa ham, boshidan boshlansin
          }catch(e){}
          BeatSync.stop();
        });
      }
    };
  })();


  (function(){
    var m = document.getElementById('splashMusicWrap');
    if(m) m.classList.add('show');
  })();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged,
    RecaptchaVerifier, signInWithPhoneNumber, updateProfile
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  // Asosiy sahifa (index.html) bilan bir xil loyiha. Auth holati bir xil
  // origin'da saqlanadi, shuning uchun kirgan foydalanuvchi Kanji/Lug'atda ham kirgan bo'ladi.
  const firebaseConfig = {
    apiKey: "AIzaSyALayFF0xGeWLUTO-96Kf8wUgOVldEFS1w",
    authDomain: "kanjiflashcard-93be1.firebaseapp.com",
    projectId: "kanjiflashcard-93be1",
    storageBucket: "kanjiflashcard-93be1.firebasestorage.app",
    messagingSenderId: "919253211986",
    appId: "1:919253211986:web:5f6ad32cbd978a273af88b",
    measurementId: "G-M0ZY600TGF"
  };

  document.getElementById("creditYear").textContent = String(new Date().getFullYear());
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });

  const loginBtn  = document.getElementById("loginBtn");
  const loginGroup = document.getElementById("loginGroup");
  const phoneBtn = document.getElementById("phoneBtn");
  const phoneModal = document.getElementById("phoneModal");
  const phoneStep1 = document.getElementById("phoneStep1");
  const phoneStep2 = document.getElementById("phoneStep2");
  const phoneName = document.getElementById("phoneName");
  const phoneNumber = document.getElementById("phoneNumber");
  const phoneCode = document.getElementById("phoneCode");
  const phoneErr1 = document.getElementById("phoneErr1");
  const phoneErr2 = document.getElementById("phoneErr2");
  const phoneSentTo = document.getElementById("phoneSentTo");
  const phoneSend = document.getElementById("phoneSend");
  const phoneVerify = document.getElementById("phoneVerify");
  let recaptcha = null, confirmation = null, pendingName = "";
  const userLine  = document.getElementById("userLine");
  const userName  = document.getElementById("userName");
  const userEmail = document.getElementById("userEmail");
  const avatarImg = document.getElementById("userAvatarImg");
  const avatarInitial = document.getElementById("userAvatarInitial");
  const logoutBtn = document.getElementById("logoutBtn");
  const kanjiBtn  = document.getElementById("kanjiBtn");
  const vocabBtn  = document.getElementById("vocabBtn");
  const menuHint  = document.getElementById("menuHint");
  const sections  = [kanjiBtn, vocabBtn];

  function setSectionsEnabled(on){
    sections.forEach((b) => {
      b.classList.toggle("locked", !on);
      b.classList.toggle("ready", on);
      b.setAttribute("aria-disabled", on ? "false" : "true");
      b.tabIndex = on ? 0 : -1;
    });
    menuHint.textContent = on ? "" : (auth.currentUser ? "Yuklanmoqda…" : "Davom etish uchun avval Google hisobingizga kiring");
  }
  // ikki shart: Google bilan kirish + yuklash 100% bo'lishi
  function refreshMenu(){
    setSectionsEnabled(!!auth.currentUser && !!window.__loaderDone);
  }
  window.__startRefreshMenu = refreshMenu;

  // ---------- Ilovalarni menyu ustida ochish (sahifa qayta yuklanmaydi) ----------
  const appOverlay = document.getElementById("appOverlay");
  const appFrames = {};
  function openApp(href){
    let fr = appFrames[href];
    if(!fr){
      fr = document.createElement("iframe");
      fr.src = href;
      fr.title = href;
      fr.setAttribute("allow", "autoplay; clipboard-write; microphone");
      appOverlay.appendChild(fr);
      appFrames[href] = fr;
    }
    // boshqa ilovalar (masalan, Kanji) yashirilishidan oldin ularga "yashirildi" signalini yuboramiz,
    // shunda ularning musiqasi ham to'xtaydi
    Object.keys(appFrames).forEach((k) => {
      if(appFrames[k] !== fr){
        try{ appFrames[k].contentWindow.postMessage({ type: "kanji-app-hide" }, "*"); }catch(e){}
      }
      appFrames[k].style.display = (appFrames[k] === fr) ? "block" : "none";
    });
    if(window.PhonkFX) window.PhonkFX.pauseForApp();
    try{ fr.contentWindow.postMessage({ type: "kanji-app-show" }, "*"); }catch(e){}
    appOverlay.classList.add("open");
  }
  function closeApp(){
    appOverlay.classList.remove("open");
    Object.keys(appFrames).forEach((k) => {
      try{ appFrames[k].contentWindow.postMessage({ type: "kanji-app-hide" }, "*"); }catch(e){}
    });
    if(window.PhonkFX) window.PhonkFX.resumeFromApp();
  }
  window.addEventListener("message", (e) => {
    if(!e.data || e.data.type !== "kanji-home") return;
    const known = Object.keys(appFrames).some((k) => appFrames[k].contentWindow === e.source);
    if(known) closeApp();
  });

  sections.forEach((b) => {
    b.addEventListener("click", (e) => {
      if (!auth.currentUser || !window.__loaderDone) { e.preventDefault(); e.stopPropagation(); return; }
      e.preventDefault();
      openApp(b.getAttribute("href"));
    });
  });

  loginBtn.addEventListener("click", () => {
    signInWithPopup(auth, provider).catch((err) => {
      console.error("Kirishda xatolik:", err.message);
      menuHint.textContent = "Kirishda xatolik. Qayta urinib ko'ring.";
    });
  });

  // ---------- Telefon orqali kirish (SMS kod) ----------
  const PHONE_ERRORS = {
    "auth/invalid-phone-number": "Telefon raqami noto'g'ri. +998 bilan boshlang.",
    "auth/missing-phone-number": "Telefon raqamini kiriting.",
    "auth/too-many-requests": "Juda ko'p urinish. Keyinroq qayta urinib ko'ring.",
    "auth/invalid-verification-code": "SMS kod noto'g'ri.",
    "auth/code-expired": "Kod muddati tugagan. Qayta kod yuboring.",
    "auth/missing-verification-code": "SMS kodni kiriting.",
    "auth/captcha-check-failed": "Xavfsizlik tekshiruvi o'tmadi. Sahifani yangilab qayta urinib ko'ring.",
    "auth/operation-not-allowed": "Telefon orqali kirish yoqilmagan (Firebase sozlamasi).",
    "auth/quota-exceeded": "SMS limiti tugagan. Keyinroq urinib ko'ring."
  };
  function phoneErrText(e){ return PHONE_ERRORS[e && e.code] || ("Xatolik: " + ((e && e.message) || "noma'lum")); }
  function getRecaptcha(){
    if(!recaptcha){ recaptcha = new RecaptchaVerifier(auth, "recaptcha-container", { size: "invisible" }); }
    return recaptcha;
  }
  // xato bo'lsa: eski verifier'ni tozalab, konteynerni yangisi bilan almashtiramiz
  // (bir konteynerga ikki marta render qilish "already been rendered" xatosini beradi)
  function resetRecaptcha(){
    try{ if(recaptcha){ recaptcha.clear(); } }catch(_){}
    recaptcha = null;
    const old = document.getElementById("recaptcha-container");
    if(old){
      const fresh = document.createElement("div");
      fresh.id = "recaptcha-container";
      old.replaceWith(fresh);
    }
  }
  function openPhone(){
    phoneModal.hidden = false;
    phoneStep1.hidden = false; phoneStep2.hidden = true;
    phoneErr1.textContent = ""; phoneErr2.textContent = "";
    setTimeout(() => phoneName.focus(), 50);
  }
  function closePhone(){ phoneModal.hidden = true; }
  phoneBtn.addEventListener("click", openPhone);
  document.getElementById("phoneClose").addEventListener("click", closePhone);
  document.getElementById("phoneBackdrop").addEventListener("click", closePhone);

  phoneStep1.addEventListener("submit", (e) => {
    e.preventDefault();
    const name = phoneName.value.trim();
    const num = phoneNumber.value.replace(/[\s-]/g, "");
    phoneErr1.textContent = "";
    if(!name){ phoneErr1.textContent = "Ismingizni kiriting."; return; }
    if(!/^\+\d{9,15}$/.test(num)){ phoneErr1.textContent = "Raqamni +998 bilan to'liq kiriting."; return; }
    phoneSend.disabled = true;
    signInWithPhoneNumber(auth, num, getRecaptcha()).then((cr) => {
      confirmation = cr;
      pendingName = name;
      phoneSentTo.textContent = num + " raqamiga kod yuborildi";
      phoneStep1.hidden = true; phoneStep2.hidden = false;
      setTimeout(() => phoneCode.focus(), 50);
    }).catch((err) => {
      phoneErr1.textContent = phoneErrText(err);
      // reCAPTCHA buzilgan bo'lsa, keyingi urinish uchun qayta yaratamiz
      resetRecaptcha();
    }).finally(() => { phoneSend.disabled = false; });
  });

  phoneStep2.addEventListener("submit", (e) => {
    e.preventDefault();
    phoneErr2.textContent = "";
    const code = phoneCode.value.trim();
    if(!confirmation){ phoneErr2.textContent = "Avval kod yuboring."; return; }
    phoneVerify.disabled = true;
    confirmation.confirm(code).then((res) => {
      // chatda ko'rinadigan ism: kiritilgan ismni saqlaymiz
      return updateProfile(res.user, { displayName: pendingName }).catch(() => {}).then(() => {
        userName.textContent = pendingName;
        closePhone();
      });
    }).catch((err) => {
      phoneErr2.textContent = phoneErrText(err);
    }).finally(() => { phoneVerify.disabled = false; });
  });

  logoutBtn.addEventListener("click", () => { signOut(auth).catch(() => {}); });

  setSectionsEnabled(false);

  onAuthStateChanged(auth, (user) => {
    if (window.__splashLoader) window.__splashLoader.done("auth");
    if (user) {
      userName.textContent = user.displayName || "Foydalanuvchi";
      userEmail.textContent = user.email || user.phoneNumber || "";
      if (user.photoURL) {
        avatarImg.src = user.photoURL;
        avatarImg.hidden = false;
        avatarInitial.hidden = true;
      } else {
        avatarImg.hidden = true;
        avatarInitial.hidden = false;
        avatarInitial.textContent = (user.displayName || user.email || "?").trim().charAt(0).toUpperCase();
      }
      userLine.hidden = false;
      loginGroup.hidden = true;
    } else {
      userLine.hidden = true;
      loginGroup.hidden = false;
    }
    refreshMenu();
  });
</script>
<div id="recaptcha-container"></div>
<div class="phone-modal" id="phoneModal" hidden>
  <div class="phone-backdrop" id="phoneBackdrop"></div>
  <div class="phone-card" role="dialog" aria-modal="true" aria-labelledby="phoneTitle">
    <button class="phone-close" id="phoneClose" type="button" aria-label="Yopish">&times;</button>
    <div class="phone-title" id="phoneTitle">Telefon orqali kirish</div>
    <form class="phone-step" id="phoneStep1" novalidate>
      <label class="phone-label">Ismingiz (chatda ko'rinadi)
        <input class="phone-input" id="phoneName" type="text" maxlength="40" placeholder="Masalan: Ali" autocomplete="name">
      </label>
      <label class="phone-label">Telefon raqam
        <input class="phone-input" id="phoneNumber" type="tel" value="+998" autocomplete="tel" inputmode="tel">
      </label>
      <div class="phone-err" id="phoneErr1"></div>
      <button class="phone-submit" id="phoneSend" type="submit">Kod yuborish</button>
    </form>
    <form class="phone-step" id="phoneStep2" novalidate hidden>
      <div class="phone-hint" id="phoneSentTo"></div>
      <label class="phone-label">SMS kod
        <input class="phone-input phone-code" id="phoneCode" type="text" inputmode="numeric" maxlength="6" placeholder="123456" autocomplete="one-time-code">
      </label>
      <div class="phone-err" id="phoneErr2"></div>
      <button class="phone-submit" id="phoneVerify" type="submit">Tasdiqlash</button>
    </form>
  </div>
</div>
<div id="appOverlay" aria-hidden="false"></div>
</body>
</html>
