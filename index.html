<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Kanji Flashcard</title>

<!-- ---------- PWA: ilova sifatida o'rnatish va brauzer panellarisiz ochilishi uchun ---------- -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0D10">
<meta name="background-color" content="#0B0D10">
<!-- Android/Chrome: standalone (brauzer oynasi elementlarisiz) rejimda ochilishi -->
<meta name="mobile-web-app-capable" content="yes">
<!-- iOS/Safari: "Bosh ekranga qo'shish" orqali ochilganda ham to'liq ilova ko'rinishida bo'lishi -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kanji">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230B0D10'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23D9694F' font-family='serif'%3E%E6%BC%A2%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Shrift render-bloklamasin: avval 'preload' sifatida so'raladi, orqa fonda
     yuklanadi, tayyor bo'lgach 'stylesheet'ga aylanadi — shu bilan sahifa
     birinchi chizilishi (first paint) shriftni kutib turmaydi va yanada
     silliq/tez ochiladi. font-display:swap allaqachon so'ralganda ham
     matn darhol zaxira shrift bilan ko'rinadi. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;800&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;800&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    --bg-1:#0B0D10;
    --bg-2:#15181c;
    --ink:#ECE7DC;
    --ink-soft:#9BA1A6;
    --ink-faint:#6b7075;
    --panel-1:#1D2126;
    --panel-2:#24282e;
    --back-1:#152731;
    --back-2:#0d1b22;
    --accent:#D9694F;
    --accent-soft:#e5876f;
    --gold:#C9A66B;
    --moss:#7C9A6B;
    --moss-soft:#93b17f;
    --card-w: min(84vw, 360px);
    --card-h: min(120vw, 460px);

    --glass-bg: rgba(255,255,255,0.07);
    --glass-bg-strong: rgba(255,255,255,0.12);
    --glass-border: rgba(255,255,255,0.32);
    --glass-border-soft: rgba(255,255,255,0.14);
    --glass-highlight: rgba(255,255,255,0.55);
    --glass-shadow: rgba(0,0,0,0.45);

    /* glass blur/saturation levels — kept as variables so low-power (lite) mode
       can cheaply turn every backdrop-filter down at once instead of editing
       each rule individually */
    --blur-1:14px;
    --blur-2:18px;
    --blur-3:20px;
    --blur-4:22px;
    --sat-1:150%;
    --sat-2:160%;
    --blob-blur:70px;
  }
  /* ---------- LITE MODE (auto-detected weak/low-end devices) ----------
     Lowering blur radius (not disabling it) keeps the glassy look intact
     while cutting the GPU compositing cost dramatically on cheap Android
     phones, where large backdrop-filter blurs are the single biggest
     source of jank. */
  html.lite{
    --blur-1:6px;
    --blur-2:7px;
    --blur-3:8px;
    --blur-4:9px;
    --sat-1:120%;
    --sat-2:120%;
    --blob-blur:36px;
  }
  html.lite .bg-scene .blob{ animation:none !important; }
  html.lite .bg-scene .blob.b3,
  html.lite .bg-scene .blob.b4{ display:none; }
  html.lite .card.flipped .face.back{ animation:none !important; }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  html{scrollbar-gutter:stable both-edges; overscroll-behavior-y:none;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg-1);
    color:var(--ink);
    font-family:'Zen Maru Gothic', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow-x:hidden;
    position:relative;
    isolation:isolate;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
    /* standalone rejimda (ilova sifatida ochilganda) notch/status-bar ostida
       kontent yashirinib qolmasligi uchun xavfsiz zona bo'shliqlari */
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
  }

  /* ---------- LIVING BACKDROP (soft blurred color, so the glass has something nice to catch) ---------- */
  .bg-scene{
    position:fixed;
    inset:0;
    z-index:-1;
    overflow:hidden;
    background:var(--bg-1);
    contain:strict;
  }
  .bg-scene .blob{
    position:absolute;
    border-radius:50%;
    filter:blur(var(--blob-blur));
    opacity:0.55;
    will-change:transform;
    contain:layout style paint;
  }
  .bg-scene .blob.b1{
    width:60vw; height:60vw; max-width:480px; max-height:480px;
    top:-14%; left:-18%;
    background:radial-gradient(circle, var(--accent) 0%, transparent 70%);
    animation:drift1 22s ease-in-out infinite;
  }
  .bg-scene .blob.b2{
    width:55vw; height:55vw; max-width:440px; max-height:440px;
    bottom:-16%; right:-14%;
    background:radial-gradient(circle, var(--moss) 0%, transparent 70%);
    animation:drift2 26s ease-in-out infinite;
  }
  .bg-scene .blob.b3{
    width:44vw; height:44vw; max-width:360px; max-height:360px;
    top:38%; right:4%;
    background:radial-gradient(circle, var(--gold) 0%, transparent 70%);
    opacity:0.35;
    animation:drift3 20s ease-in-out infinite;
  }
  .bg-scene .blob.b4{
    width:38vw; height:38vw; max-width:320px; max-height:320px;
    bottom:20%; left:6%;
    background:radial-gradient(circle, var(--back-1) 0%, transparent 70%);
    opacity:0.5;
    animation:drift1 30s ease-in-out infinite reverse;
  }
  .bg-scene::after{
    content:"";
    position:absolute; inset:0;
    background:rgba(11,13,16,0.35);
  }
  @keyframes drift1{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(6%, 8%) scale(1.08); }
  }
  @keyframes drift2{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(-7%, -6%) scale(1.1); }
  }
  @keyframes drift3{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(-5%, 10%) scale(0.92); }
  }
  @media (prefers-reduced-motion: reduce){
    .bg-scene .blob{animation:none !important;}
  }

  /* ---------- KO'TARILUVCHI NUQTALAR (kartochka/tugmalar ortidagi ambient qatlam) ----------
     bg-scene blob'lari kabi fixed va butun sahifa balandligida — shu sababli
     scroll ta'sir qilmaydi. z-index -1 bo'lgani uchun oddiy kontent (app-shell,
     kartochkalar, tugmalar) doim uning ustida ko'rinadi. */
  .dots-canvas{
    position:fixed;
    inset:0;
    z-index:-1;
    display:block;
    pointer-events:none;
    contain:strict;
  }

  /* ---------- SVAYP QILGANDA EKRAN CHETLARINING YONISHI ----------
     kartochka chapga/o'ngga tortilganda, ekranning tegishli cheti sekin
     yorishadi va markazga qarab xiralashib boradi (chap — yashil/moss,
     o'ng — qizil). Fon (bg-scene/dots) ustida, lekin kartochka ostida
     turadi (z-index:-1, background qatlamidan keyin joylashgani uchun
     ular ustidan, kartochka esa buning ustidan chiqadi). */
  .swipe-edge-glow{
    position:fixed;
    top:0; bottom:0;
    width:46vw;
    max-width:300px;
    z-index:-1;
    pointer-events:none;
    opacity:0;
    filter:blur(14px);
    transition:opacity .16s ease;
    will-change:opacity;
  }
  .swipe-edge-glow.left{
    left:-6vw;
    background:linear-gradient(to right,
      rgba(124,154,107,0.85) 0%,
      rgba(124,154,107,0.4) 30%,
      rgba(124,154,107,0.12) 62%,
      transparent 100%);
  }
  .swipe-edge-glow.right{
    right:-6vw;
    background:linear-gradient(to left,
      rgba(217,60,52,0.82) 0%,
      rgba(217,60,52,0.38) 30%,
      rgba(217,60,52,0.11) 62%,
      transparent 100%);
  }
  @media (prefers-reduced-motion: reduce){
    .swipe-edge-glow{ transition:none; }
  }

  header{
    width:100%;
    max-width:480px;
    padding:26px 20px 8px;
    text-align:center;
    position:relative;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:0.32em;
    color:var(--accent);
    font-weight:700;
    text-transform:uppercase;
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-size:24px;
    margin:6px 0 0;
    font-weight:600;
    letter-spacing:0.01em;
    color:var(--ink);
  }

  /* ---------- QIDIRUV (search) ---------- */
  .search-toggle-btn{
    position:absolute;
    top:22px;
    right:16px;
    width:36px;
    height:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    border:1px solid var(--glass-border-soft);
    background:var(--glass-bg);
    backdrop-filter:var(--blur-1) saturate(var(--sat-1));
    -webkit-backdrop-filter:var(--blur-1) saturate(var(--sat-1));
    color:var(--ink-soft);
    cursor:pointer;
    transition:all .2s ease;
  }
  .search-toggle-btn:active{transform:scale(0.92);}
  .search-toggle-btn.active{
    background:linear-gradient(165deg, rgba(217,105,79,0.5), rgba(217,105,79,0.28));
    border-color:var(--accent);
    color:var(--accent-soft);
  }
  .search-toggle-btn svg{width:17px; height:17px; display:block;}

  .search-panel{
    width:100%;
    max-width:480px;
    padding:0 20px;
    display:grid;
    grid-template-rows:0fr;
    opacity:0;
    transition:grid-template-rows .3s cubic-bezier(.4,0,.2,1), opacity .25s ease;
  }
  .search-panel.open{
    grid-template-rows:1fr;
    opacity:1;
    padding:6px 20px 4px;
  }
  .search-panel-inner{overflow:hidden; min-height:0;}
  .search-input-row,
  .search-results{
    opacity:0;
    transform:translateY(-6px);
    transition:opacity .22s ease, transform .22s ease;
  }
  .search-panel.open .search-input-row{
    opacity:1;
    transform:translateY(0);
    transition-delay:.08s;
  }
  .search-panel.open .search-results{
    opacity:1;
    transform:translateY(0);
    transition-delay:.13s;
  }
  .search-input-row{
    display:flex;
    align-items:center;
    gap:8px;
    border:1px solid var(--glass-border);
    background:var(--glass-bg-strong);
    backdrop-filter:var(--blur-1) saturate(var(--sat-1));
    -webkit-backdrop-filter:var(--blur-1) saturate(var(--sat-1));
    border-radius:14px;
    padding:9px 12px;
  }
  .search-input-row svg{width:15px; height:15px; flex-shrink:0; color:var(--ink-faint);}
  #searchInput{
    flex:1;
    min-width:0;
    background:none;
    border:none;
    outline:none;
    color:var(--ink);
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:14.5px;
  }
  #searchInput::placeholder{color:var(--ink-faint);}
  .search-clear-x{
    flex-shrink:0;
    width:20px; height:20px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,0.1);
    color:var(--ink-soft);
    font-size:12px;
    line-height:1;
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
  }
  .search-clear-x.show{display:flex;}

  .search-results{
    margin-top:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height:min(56vh, 460px);
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .search-hint, .search-empty{
    text-align:center;
    color:var(--ink-faint);
    font-size:12.5px;
    padding:14px 4px 6px;
  }
  .search-result-item{
    border:1px solid var(--glass-border-soft);
    background:rgba(255,255,255,0.05);
    border-radius:14px;
    padding:10px 12px;
    cursor:pointer;
    transition:border-color .15s ease, background-color .15s ease;
  }
  .search-result-item:active{transform:scale(0.99);}
  .search-result-item.expanded{
    border-color:rgba(217,105,79,0.45);
    background:linear-gradient(165deg, rgba(217,105,79,0.16), rgba(217,105,79,0.06));
  }
  .sri-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
  }
  .sri-kanji{
    font-family:'Shippori Mincho', serif;
    font-size:19px;
    color:var(--ink);
  }
  .sri-day{
    flex-shrink:0;
    font-size:10px;
    font-weight:700;
    color:var(--ink-faint);
    letter-spacing:0.02em;
  }
  .sri-sub{
    margin-top:2px;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .sri-sub .sri-romaji{color:var(--accent-soft); font-weight:600;}
  .sri-detail{
    margin-top:8px;
    padding-top:8px;
    border-top:1px solid var(--glass-border-soft);
    font-size:12px;
    color:var(--ink-soft);
    line-height:1.5;
    display:none;
  }
  .search-result-item.expanded .sri-detail{display:block;}
  .sri-detail b{color:var(--ink);}

  .known-banner{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    margin:16px auto 0;
    max-width:480px;
    width:calc(100% - 40px);
    border:1px solid rgba(124,154,107,0.45);
    background:linear-gradient(165deg, rgba(124,154,107,0.28), rgba(124,154,107,0.14));
    backdrop-filter:var(--blur-1) saturate(var(--sat-1));
    -webkit-backdrop-filter:var(--blur-1) saturate(var(--sat-1));
    color:var(--moss-soft);
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:800;
    font-size:14px;
    letter-spacing:0.02em;
    padding:11px 14px;
    border-radius:16px;
    cursor:pointer;
    transition:all .25s ease;
  }
  .known-banner:active{transform:scale(0.98);}
  .known-banner.active{
    background:linear-gradient(165deg, rgba(124,154,107,0.5), rgba(124,154,107,0.28));
    border-color:var(--moss);
    color:#eafce0;
  }
  .known-banner-icon{font-size:16px;}
  .known-banner-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:22px;
    font-size:11.5px;
    background:var(--moss);
    color:#0B0D10;
    padding:2px 7px;
    border-radius:999px;
    font-weight:900;
  }

  .banner-row{
    display:flex;
    gap:10px;
    margin:16px auto 0;
    max-width:480px;
    width:calc(100% - 40px);
  }
  .banner-row .known-banner, .banner-row .all-banner{
    margin:0;
    width:auto;
    flex:1;
  }
  .all-banner{
    border-color:rgba(201,166,107,0.45);
    background:linear-gradient(165deg, rgba(201,166,107,0.28), rgba(201,166,107,0.14));
    color:var(--gold);
  }
  .all-banner.active{
    background:linear-gradient(165deg, rgba(201,166,107,0.5), rgba(201,166,107,0.28));
    border-color:var(--gold);
    color:#fff4de;
  }
  .all-banner .known-banner-badge{background:var(--gold);}

  .all-day-group{margin:0;}
  .all-day-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin:18px 4px 8px;
    cursor:pointer;
    user-select:none;
  }
  .all-day-group:first-child .all-day-heading{margin-top:4px;}
  .all-day-heading-left{
    display:flex;
    align-items:center;
    gap:7px;
    min-width:0;
  }
  .all-day-arrow{
    flex-shrink:0;
    width:9px;
    height:9px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .all-day-arrow::before{
    content:"";
    display:block;
    width:7px;
    height:7px;
    border-right:2px solid var(--ink-soft);
    border-bottom:2px solid var(--ink-soft);
    transform:rotate(-45deg);
    transition:transform .2s ease;
  }
  .all-day-group.collapsed .all-day-arrow::before{transform:rotate(45deg);}
  .all-day-heading-label{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:800;
    font-size:13px;
    letter-spacing:0.04em;
    color:var(--ink-soft);
    text-transform:uppercase;
  }
  .all-day-heading-count{
    font-size:10.5px;
    font-weight:600;
    color:var(--ink-soft);
    opacity:0.6;
    flex-shrink:0;
  }
  .all-kanji-collapse{
    display:grid;
    grid-template-rows:1fr;
    transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1), opacity .28s ease;
    opacity:1;
  }
  .all-kanji-collapse > .all-kanji-grid{
    overflow:hidden;
    min-height:0;
  }
  .all-day-group.collapsed .all-kanji-collapse{
    grid-template-rows:0fr;
    opacity:0;
  }
  .all-day-select-btn{
    flex-shrink:0;
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.01em;
    color:var(--ink-soft);
    background:rgba(255,255,255,0.06);
    border:1px solid var(--glass-border-soft);
    padding:4px 10px;
    border-radius:999px;
    cursor:pointer;
    transition:all .2s ease;
  }
  .all-day-select-btn:active{transform:scale(0.94);}
  .all-day-select-btn.all-selected{
    color:var(--accent-soft);
    border-color:rgba(217,105,79,0.4);
    background:rgba(217,105,79,0.14);
  }
  .all-kanji-grid{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:10px;
  }
  .all-kanji-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    border:1px solid var(--glass-border-soft);
    background:rgba(255,255,255,0.05);
    border-radius:12px;
    padding:8px 2px 6px;
    cursor:pointer;
    transition:border-color .15s ease, background-color .15s ease, transform .15s ease;
    min-width:0;
    contain:content;
  }
  .all-kanji-item:active{transform:scale(0.95);}
  .all-kanji-item .aki-kanji{
    font-family:'Shippori Mincho', serif;
    font-size:19px;
    line-height:1.15;
    color:var(--ink);
    max-width:100%;
    overflow-wrap:break-word;
    text-align:center;
  }
  .all-kanji-item .aki-romaji{
    font-size:9px;
    color:var(--ink-soft);
    font-weight:600;
    text-align:center;
    overflow-wrap:break-word;
    max-width:100%;
  }
  .all-kanji-item.selected{
    border-color:var(--accent);
    background:linear-gradient(165deg, rgba(217,105,79,0.32), rgba(217,105,79,0.16));
  }
  .all-kanji-item.selected .aki-kanji, .all-kanji-item.selected .aki-romaji{
    color:var(--accent-soft);
  }
  .all-selected-note{
    text-align:center;
    font-size:12.5px;
    color:var(--ink-soft);
    margin:14px 0 2px;
  }
  .all-clear-btn{
    display:block;
    margin:8px auto 0;
    background:rgba(217,105,79,0.14);
    border:1px solid rgba(217,105,79,0.4);
    color:var(--accent-soft);
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:0.02em;
    padding:5px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:opacity .2s ease, transform .2s ease;
    opacity:1;
    transform:scale(1);
  }
  .all-clear-btn:active{transform:scale(0.95);}
  /* kept in normal flow (space reserved) instead of display:none, so the
     kanji grid below never jumps when the button appears/disappears */
  .all-clear-btn.slot-empty{
    opacity:0;
    pointer-events:none;
    visibility:hidden;
  }

  .tabs-wrap{
    margin:18px auto 0;
    max-width:480px;
    width:calc(100% - 40px);
  }
  .tabs-wrap.tabs-hidden{
    display:none;
  }
  nav.tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:0;
    width:100%;
  }
  .tab-btn{
    flex:1;
    min-width:64px;
    border:1px solid var(--glass-border-soft);
    background:var(--glass-bg);

  /* ---------- STAGE / SWIPE CARD ---------- */
  .stage{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    height:var(--card-h);
    touch-action:pan-y;
  }
  .card{
    position:relative;
    width:var(--card-w);
    height:var(--card-h);
    cursor:grab;
    user-select:none;
    will-change:transform;
    touch-action:pan-y;
    perspective:1400px;
    -webkit-perspective:1400px;
  }
  .card:active{cursor:grabbing;}
  .card-inner{
    width:100%; height:100%;
    position:relative;
    transform-style:preserve-3d;
    -webkit-transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.2,.8,.2,1);
    transform:rotateY(0deg);
    -webkit-transform:rotateY(0deg);
  }
  .card.flipped .card-inner{transform:rotateY(180deg); -webkit-transform:rotateY(180deg);}

  /* ---- maxsus kartochka hosil bo'lish animatsiyasi ---- */
  @keyframes cardFormSpin{
    0%{ transform:rotateY(0deg) scale(.22); opacity:0; }
    14%{ opacity:1; }
    100%{ transform:rotateY(1080deg) scale(1); opacity:1; }
  }
  .card.card-forming{
    animation:cardFormSpin 1.2s cubic-bezier(.16,1,.3,1) both;
    pointer-events:none;
  }

  /* haqiqiy suv to'lqini effekti — AMOLED ekranlarda chinakam qora rangga
     tegmasligi uchun backdrop-filter ISHLATILMAYDI (u orqa fondagi piksellarni
     "namlab", kulrangsimon tuman hosil qilardi). Buning o'rniga faqat o'zining
     yorug'ligini chiqaradigan, tashqariga kengayib boruvchi nozik yorug' halqa
     ishlatiladi — atrofdagi qora piksellarga umuman tegmaydi. */
  .ripple-overlay{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:9999;
    overflow:hidden;
  }
  .ripple-ring{
    position:absolute;
    left:0; top:0;
    width:40px; height:40px;
    margin:-20px 0 0 -20px;
    border-radius:50%;
    background:transparent;
    border:1.4px solid rgba(255,255,255,0.4);
    box-shadow:
      0 0 10px 1px rgba(236,231,220,0.18),
      inset 0 0 10px 1px rgba(236,231,220,0.1);
    filter:blur(0.6px);
    opacity:0;
    transform:scale(.12);
    animation:rippleExpand 1.4s cubic-bezier(.16,.7,.3,1) forwards;
  }
  @keyframes rippleExpand{
    0%{ transform:scale(.12); opacity:0; }
    12%{ opacity:.5; }
    70%{ opacity:.16; }
    100%{ transform:scale(var(--ripple-scale, 22)); opacity:0; }
  }

  .card.flipped .face.back{
    animation:cardGlow 2.2s ease-in-out infinite;
  }
  @keyframes cardGlow{
    0%,100%{
      border-color:var(--glass-border-soft);
      box-shadow:
        0 24px 50px -16px var(--glass-shadow),
        0 2px 10px rgba(0,0,0,0.3),
        inset 0 1px 0 rgba(255,255,255,0.18),
        inset 0 0 0 1px rgba(255,255,255,0.04),
        0 0 0 0 rgba(201,166,107,0);
    }
    50%{
      border-color:var(--gold);
      box-shadow:
        0 24px 50px -16px var(--glass-shadow),
        0 2px 10px rgba(0,0,0,0.3),
        inset 0 1px 0 rgba(255,255,255,0.18),
        inset 0 0 0 1px rgba(255,255,255,0.04),
        0 0 26px 6px rgba(201,166,107,0.55);
    }
  }

  .face{
    position:absolute; inset:0;
    border-radius:22px;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    -webkit-transform:translateZ(0) rotateY(0deg);
    transform:translateZ(0) rotateY(0deg);
    display:flex;
    flex-direction:column;
    padding:26px 22px;
    box-shadow:
      0 24px 50px -16px var(--glass-shadow),
      0 2px 10px rgba(0,0,0,0.3),
      inset 0 1px 0 rgba(255,255,255,0.18),
      inset 0 0 0 1px rgba(255,255,255,0.04);
    border:1px solid var(--glass-border-soft);
    background:var(--glass-bg);
    backdrop-filter:var(--blur-4) saturate(var(--sat-2));
    -webkit-backdrop-filter:var(--blur-4) saturate(var(--sat-2));
    overflow:hidden;
  }
  .face::before{
    /* glass sheen streak */
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:55%;
    background:linear-gradient(180deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0.03) 60%, transparent 100%);
    pointer-events:none;
  }
  .face::after{
    /* subtle border glow to sell the glass edge */
    content:"";
    position:absolute; inset:0;
    border-radius:22px;
    border:1px solid transparent;
    background:linear-gradient(160deg, var(--glass-highlight), transparent 30%, transparent 70%, rgba(255,255,255,0.15)) border-box;
    -webkit-mask:linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    opacity:0.35;
    pointer-events:none;
  }
  .face.front{
    justify-content:center;
    align-items:center;
  }
  .face.front > *{ position:relative; z-index:1; }
  /* Old tarafning ramkasida — bir burchakdan boshlanib qarama-qarshi burchakda so'nadigan,
     ingichka, oynaga xos statik yorug'lik chizig'i (aylanmaydi). */
  .face.front::after{
    content:"";
    position:absolute; inset:0;
    border-radius:22px;
    border:1.4px solid transparent;
    background:
      linear-gradient(135deg,
        rgba(255,255,255,0.98) 0%,
        rgba(255,255,255,0.8)  4%,
        rgba(255,255,255,0.42) 11%,
        rgba(255,255,255,0.14) 21%,
        rgba(255,255,255,0.03) 33%,
        transparent 46%,
        transparent 82%,
        rgba(255,255,255,0.05) 94%,
        rgba(255,255,255,0.14) 100%
      ) border-box;
    -webkit-mask:linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    filter:drop-shadow(0 0 2px rgba(255,255,255,0.45));
    opacity:0.95;
    pointer-events:none;
  }
  .face.back{
    transform:translateZ(0) rotateY(180deg);
    -webkit-transform:translateZ(0) rotateY(180deg);
    color:var(--ink);
    justify-content:space-between;
    background:linear-gradient(165deg, rgba(21,39,49,0.35), rgba(13,27,34,0.28)), var(--glass-bg);
  }
  .face.back > *{ position:relative; z-index:1; }

  // ---------- QIDIRUV (search) ----------
  // Kanji, romaji va o'zbekcha tarjima bo'yicha bir vaqtda qidiradi.
  // O'quv navbati (queues/known)ga tegmaydi — faqat lug'at sifatida ishlaydi.
  (function(){
    const toggleBtn = document.getElementById('searchToggleBtn');
    const panel = document.getElementById('searchPanel');
    const input = document.getElementById('searchInput');
    const clearX = document.getElementById('searchClearX');
    const resultsWrap = document.getElementById('searchResults');
    let open = false;
    let expandedId = null;

    // apostrof variantlarini bittasiga tenglashtirish + kichik harfga o'tkazish,
    // shunda "tog'", "tog'", "togʻ" kabi turli klaviatura belgilari ham topiladi
    function norm(s){
      return (s || '')
        .toLowerCase()
        .replace(/[’ʻʼ`´‘]/g, "'")
        .trim();
    }

    function searchWords(qRaw){
      const q = norm(qRaw);
      if(!q) return [];
      const scored = [];
      for(const w of WORDS){
        const kanji = w.kanji, romaji = norm(w.romaji), uz = norm(w.uz);
        const kanjiHit = w.kanji.includes(qRaw.trim());
        const romajiHit = romaji.includes(q);
        const uzHit = uz.includes(q);
        if(!kanjiHit && !romajiHit && !uzHit) continue;
        // tartib: aniq moslik > boshidan moslik > ichida moslik
        let score = 3;
        if(kanji === qRaw.trim() || romaji === q || uz === q) score = 0;
        else if(romaji.startsWith(q) || uz.startsWith(q)) score = 1;
        else if(kanjiHit) score = 2;
        scored.push({w, score});
      }
      scored.sort((a,b)=> a.score - b.score || a.w.day - b.w.day);
      return scored.map(s=>s.w).slice(0, 40);
    }

    function renderResults(qRaw){
      const q = qRaw.trim();
      if(!q){
        resultsWrap.innerHTML = `<div class="search-hint">Kanji, romaji (masalan "yama") yoki tarjima (masalan "tog'") — qanday yozsangiz ham topiladi.</div>`;
        return;
      }
      const found = searchWords(q);
      if(found.length === 0){
        resultsWrap.innerHTML = `<div class="search-empty">Hech narsa topilmadi 🍂</div>`;
        return;
      }
      resultsWrap.innerHTML = found.map(w=>`
        <div class="search-result-item${expandedId===w.id ? ' expanded' : ''}" data-id="${w.id}">
          <div class="sri-top">
            <span class="sri-kanji">${w.kanji}</span>
            <span class="sri-day">${DAY_LABELS[w.day] || ''}</span>
          </div>
          <div class="sri-sub"><span class="sri-romaji">${w.romaji}</span> — ${w.uz}</div>
          <div class="sri-detail">
            <div><b>O'qilishi:</b> ${w.reading || '—'}</div>
            ${w.otherReadings ? `<div><b>Boshqa o'qilishlar:</b> ${w.otherReadings}</div>` : ''}
            <div><b>Turi:</b> ${w.type || '—'}</div>
          </div>
        </div>
      `).join('');
    }

    resultsWrap.addEventListener('click', (e)=>{
      const item = e.target.closest('.search-result-item');
      if(!item) return;
      const id = item.getAttribute('data-id');
      expandedId = (expandedId === id) ? null : id;
      renderResults(input.value);
    });

    input.addEventListener('input', ()=>{
      clearX.classList.toggle('show', input.value.length > 0);
      expandedId = null;
      renderResults(input.value);
    });

    clearX.addEventListener('click', ()=>{
      input.value = '';
      clearX.classList.remove('show');
      expandedId = null;
      renderResults('');
      input.focus();
    });

    toggleBtn.addEventListener('click', ()=>{
      open = !open;
      toggleBtn.classList.toggle('active', open);
      panel.classList.toggle('open', open);
      if(open){
        renderResults(input.value);
        setTimeout(()=>input.focus(), 250);
      }
    });
  })();

  // ---------- STATE ----------
  // Har bir kun uchun alohida navbat (queue)
  let queues = {};
  DAY_ORDER.forEach(d=>{ queues[d] = WORDS.filter(w=>w.day===d).map(w=>w.id); });
  queues[CUSTOM_DAY_ID] = []; // maxsus kartochka navbati — "Hammasi" bo'limidan tanlab qo'shiladi
  let customDeckExists = false; // maxsus kartochka tabi hech bo'lmasa bir marta yasalganmi
  let customFadingOut = false; // hammasi ko'rib chiqilgach, tab sekin yo'qolish animatsiyasida
  let customKnownSet = new Set(); // Maxsus Flashcard orqali "bilaman"ga o'tkazilgan so'zlar — Bilganlarimda alohida guruhlanadi
  let known = [];
  let currentDay = DAY_ORDER[0];
  let flipped = false;
  let currentTab = "learn";
  let selectedKanji = new Set();

  function hanko(id){
    return byId[id] ? byId[id].group : "";
  }

  // ---------- PERSISTENCE ----------
  const STORAGE_KEY = 'kanji-flashcard-state';
  // Ilova (artifact) muhitida window.storage bo'ladi — bo'lmasa, brauzerning
  // o'zida (shu qurilmada) saqlash uchun localStorage'ga tushamiz.
  const hasArtifactStorage = typeof window !== 'undefined'
    && window.storage
    && typeof window.storage.get === 'function'
    && typeof window.storage.set === 'function';

  async function loadState(){
    try{
      let raw = null;
      if(hasArtifactStorage){
        try{
          const res = await window.storage.get(STORAGE_KEY);
          raw = res ? res.value : null;
        }catch(e){ raw = null; } // hali saqlangan holat yo'q
      } else {
        raw = localStorage.getItem(STORAGE_KEY);
      }
      if(raw){
        const data = JSON.parse(raw);
        const validIds = new Set(WORDS.map(w=>w.id));
        if(data.queues && typeof data.queues === 'object'){
          DAY_ORDER.forEach(d=>{
            const saved = Array.isArray(data.queues[d]) ? data.queues[d].filter(id=>validIds.has(id)) : [];
            queues[d] = saved;
          });
          // Maxsus Flashcard navbati saqlanmaydi — har safar sayt ochilganda bo'sh
          // holatda boshlanadi, faqat "Flashcardga aylantirish" bosilganda paydo bo'ladi.
        } else if(Array.isArray(data.queue)){
          // eski format bilan moslik (bitta umumiy navbat)
          queues[DAY_ORDER[0]] = data.queue.filter(id=>validIds.has(id));
        }
        known = Array.isArray(data.known) ? data.known.filter(id=>validIds.has(id)) : [];
        // customDeckExists ataylab tiklanmaydi — kunlar ro'yxatida sayt ochilganda ko'rinmasligi kerak
        const knownSet = new Set(known);
        customKnownSet = new Set(
          Array.isArray(data.customKnown) ? data.customKnown.filter(id=>validIds.has(id) && knownSet.has(id)) : []
        );
        // har bir so'z aynan bitta joyda (navbat yoki bilganlar) bo'lishini ta'minlash
        const seen = new Set([...DAY_ORDER.flatMap(d=>queues[d]), ...known]);
        WORDS.forEach(w=>{ if(!seen.has(w.id)) queues[w.day].push(w.id); });
        if(DAY_ORDER.includes(data.currentDay)){
          currentDay = data.currentDay;
        }
      }
    }catch(e){ /* no saved state yet — use defaults */ }
  }

  async function saveState(){
    try{
      const payload = JSON.stringify({queues, known, currentDay, customDeckExists, customKnown:[...customKnownSet]});
      if(hasArtifactStorage){
        await window.storage.set(STORAGE_KEY, payload);
      } else {
        localStorage.setItem(STORAGE_KEY, payload);
      }
    }catch(e){ console.error('Saqlashda xatolik:', e); }
  }

  // ---------- TABS (faqat kunlar) ----------
  const tabsWrap = document.getElementById('tabsWrap');
  const tabsNav = document.getElementById('tabsNav');
  const tabsOlderCollapse = document.getElementById('tabsOlderCollapse');
  const tabsOlderGrid = document.getElementById('tabsOlderGrid');
  const RECENT_DAY_COUNT = 2; // faqat oxirgi shuncha kun asosiy qatorda ko'rinadi
  let kunlarOpen = false;

  function dayTabBtn(d, onSelect){
    const btn = document.createElement('button');
    btn.type = 'button';

    btn.innerHTML = `${DAY_LABELS[d]} <span class="badge" id="dayCount-${d}">${queues[d].length}</span>`;
    btn.addEventListener('click', onSelect);
    return btn;
  }

  // maxsus kartochka uchun alohida tab tugmasi — kunlar ro'yxatining pastida,
  // faqat "Hammasi" bo'limidan kamida bir marta kartochka yasalgandan keyin ko'rinadi
  function customDayTabBtn(){
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'tab-btn tab-btn-custom'

  // ---------- SWIPE / DRAG ----------
  const edgeGlowLeft = document.getElementById('edgeGlowLeft');
  const edgeGlowRight = document.getElementById('edgeGlowRight');
  // ---------- MAXSUS KARTOCHKA HOSIL BO'LISH ANIMATSIYASI (ovoz + aylanish + mozayik nuqtalar) ----------
  let creationAudioCtx = null;
  let creationReverbNode = null;
  function getCreationAudioCtx(){
    try{
      if(!creationAudioCtx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return null;
        creationAudioCtx = new AC();
      }
      if(creationAudioCtx.state === 'suspended') creationAudioCtx.resume();
      return creationAudioCtx;
    }catch(e){ return null; }
  }

  // kichik, tabiiy "xona" aksi — tashqi audio fayl kerak emas, oq shovqindan
  // eksponensial so'nuvchi impulse response yasab, ConvolverNode uchun ishlatamiz.
  // Bu qattiq "tap" tovushini yumshoq, quloqqa yoqimli tarzda cho'zib beradi.
  function getCreationReverb(ctx){
    if(!creationReverbNode){
      try{
        const dur = 0.5, decay = 3.4;
        const length = Math.max(1, Math.floor(ctx.sampleRate * dur));
        const impulse = ctx.createBuffer(2, length, ctx.sampleRate);
        for(let ch=0; ch<2; ch++){
          const data = impulse.getChannelData(ch);
          for(let i=0;i<length;i++){
            data[i] = (Math.random()*2-1) * Math.pow(1 - i/length, decay);
          }
        }
        const conv = ctx.createConvolver();
        conv.buffer = impulse;
        creationReverbNode = conv;
      }catch(e){ creationReverbNode = null; }
    }
    return creationReverbNode;
  }

  // uzluksiz "vviz" (whoosh) — havoda aylanib borayotgan kartochkaning yagona,
  // silliq tovushi. Uch bo'lakka bo'lingan "shuf-shuf-shuf" o'rniga endi bitta
  // tovush: chastotasi asta pasayadi (uzoqlashib, sekinlashayotgandek) va
  // ustiga past chastotali LFO bilan yumshoq "tebranish" (flutter) qo'shiladi —
  // bu tebranish tezligi ham asta sekinlashadi, xuddi kartochka aylanishi
  // sekinlashib, joyiga cho'kayotgandek tuyuladi.
  function creationSpinWhoosh(ctx, time, dur){
    const n = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buffer = ctx.createBuffer(1, n, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<n;i++){ data[i] = Math.random()*2-1; }
    const src = ctx.createBufferSource();
    src.buffer = buffer;

    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.Q.value = 1.0;
    bp.frequency.setValueAtTime(2100, time);
    bp.frequency.exponentialRampToValueAtTime(460, time + dur*0.92);

    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 200;

    // umumiy hajm — yumshoq kirish, saqlanish, "buff"dan oldin yumshoq chiqish
    const envGain = ctx.createGain();
    envGain.gain.setValueAtTime(0.0001, time);
    envGain.gain.linearRampToValueAtTime(0.15, time + 0.1);
    envGain.gain.setValueAtTime(0.15, time + dur*0.55);
    envGain.gain.linearRampToValueAtTime(0.0001, time + dur);

    // tebranish (flutter) — tezligi asta pasayadi, aylanish sekinlashayotganini
    // his qildiradi
    const lfo = ctx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.setValueAtTime(9, time);
    lfo.frequency.exponentialRampToValueAtTime(2.2, time + dur);
    const lfoDepth = ctx.createGain();
    lfoDepth.gain.value = 0.45;
    const tremGain = ctx.createGain();
    tremGain.gain.value = 0.6;
    lfo.connect(lfoDepth); lfoDepth.connect(tremGain.gain);

    src.connect(bp); bp.connect(hp); hp.connect(tremGain); tremGain.connect(envGain); envGain.connect(ctx.destination);
    src.start(time); src.stop(time + dur + 0.05);
    lfo.start(time); lfo.stop(time + dur + 0.05);
  }

  // "buff" — kartochka joyiga tushganda eshitiladigan yumshoq, iliq gumbir:
  // og'irlik beruvchi past ton + kontakt uchun juda qisqa "tik" + tabiiy,
  // sekin so'nuvchi past ovozli akс (reverb), bu tovushni sun'iy emas, yumshoq
  // va quloqqa yoqimli qiladi.
  function creationThud(ctx, time){
    const dur = 0.34;

    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(148, time);
    osc.frequency.exponentialRampToValueAtTime(50, time + dur);
    const og = ctx.createGain();
    og.gain.setValueAtTime(0.0001, time);
    og.gain.linearRampToValueAtTime(0.34, time + 0.014);
    og.gain.setTargetAtTime(0.0001, time + 0.014, 0.1);

    const clickBuf = ctx.createBuffer(1, Math.max(1, Math.floor(ctx.sampleRate*0.03)), ctx.sampleRate);
    const cd = clickBuf.getChannelData(0);
    for(let i=0;i<cd.length;i++){ cd[i] = Math.random()*2-1; }
    const clickSrc = ctx.createBufferSource();
    clickSrc.buffer = clickBuf;
    const clickFilter = ctx.createBiquadFilter();
    clickFilter.type = 'bandpass';
    clickFilter.frequency.value = 850;
    clickFilter.Q.value = 1.1;
    const clickGain = ctx.createGain();
    clickGain.gain.setValueAtTime(0.16, time);
    clickGain.gain.exponentialRampToValueAtTime(0.0001, time + 0.035);

    osc.connect(og); og.connect(ctx.destination);
    clickSrc.connect(clickFilter); clickFilter.connect(clickGain); clickGain.connect(ctx.destination);

    const reverb = getCreationReverb(ctx);
    if(reverb){
      const tailGain = ctx.createGain();
      tailGain.gain.value = 0.14;
      og.connect(tailGain); clickGain.connect(tailGain);
      tailGain.connect(reverb); reverb.connect(ctx.destination);
    }

    osc.start(time); osc.stop(time + dur + 0.02);
    clickSrc.start(time); clickSrc.stop(time + 0.04);
  }

  // animatsiya (cardFormSpin) aynan 1.2s davom etadi va 1080deg aylanadi —
  // shuning uchun uchta "shuf" ovozi shu vaqt oralig'iga teng taqsimlangan,
  // "buff" esa aylanish deyarli tugab, kartochka joyiga tushadigan zumda eshitiladi.
  function scheduleCreationSound(ctx){
    const t0 = ctx.currentTime + 0.03;
    creationSpinWhoosh(ctx, t0, 1.05); // 1080deg aylanish davomida yagona, silliq "vviz"
    creationThud(ctx, t0 + 1.10);      // buff — joyiga tushganda
  }

  // kartochka joyiga tushgach, mozayik nuqtalar markazdan suv tomchisidek tarqaladi
  function runWaterRipple(card){
    const rect = card.getBoundingClientRect();
    if(rect.width < 10 || rect.height < 10) return;
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;

    // to'lqin kartichkadan tashqariga, ekran (oyna) bo'yicha ham yoyilishi uchun
    const maxDiameter = Math.min(Math.max(window.innerWidth, window.innerHeight) * 0.85, 1100);
    const scaleEnd = maxDiameter / 40; // ring bazaviy diametri 40px, shunga nisbatan kattalashadi

    const overlay = document.createElement('div');
    overlay.className = 'ripple-overlay';
    document.body.appendChild(overlay);

    const RING_COUNT = 3;
    const STAGGER_S = 0.24;
    let finished = 0;
    for(let i=0;i<RING_COUNT;i++){
      const ring = document.createElement('div');
      ring.className = 'ripple-ring';
      ring.style.left = cx + 'px';
      ring.style.top = cy + 'px';
      ring.style.setProperty('--ripple-scale', scaleEnd.toFixed(2));
      ring.style.animationDelay = (i * STAGGER_S) + 's';
      ring.addEventListener('animationend', ()=>{
        finished++;
        if(finished >= RING_COUNT) overlay.remove();
      }, {once:true});
      overlay.appendChild(ring);
    }
    // ehtiyot chorasi — agar animationend qandaydir sababdan kelmasa ham overlay tozalansin
    setTimeout(()=>{ overlay.remove(); }, 1400 + RING_COUNT*STAGGER_S*1000 + 200);
  }

  // umumiy orkestrator: tugma bosilib, yangi kartochka ekranga chiqqach chaqiriladi
  function playCardCreationAnimation(){
    const card = document.getElementById('activeCard');
    if(!card) return;
    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduceMotion) return; // kamaytirilgan animatsiya afzal ko'rilsa, kartochka oddiy ko'rinishda qoladi

    card.style.pointerEvents = 'none';
    card.classList.add('card-forming');

    try{
      const ctx = getCreationAudioCtx();
      if(ctx) scheduleCreationSound(ctx);
    }catch(e){ /* ovoz ishlamasa ham vizual animatsiya davom etadi */ }

    card.addEventListener('animationend', function onEnd(){
      card.removeEventListener('animationend', onEnd);
      runWaterRipple(card);
      setTimeout(()=>{
        card.classList.remove('card-forming');
        card.style.pointerEvents = '';
      }, 180);
    }, {once:true});
  }

  function attachCardEvents(card){
    // decided: null = not yet decided, 'h' = horizontal drag, 'v' = vertical scroll (ignore)
    let startX=0, startY=0, curX=0, dragging=false, moved=false, decided=null, rafId=null, pendingDx=0;
    const inner = card.querySelector('.card-inner');
    const tagLeft = card.querySelector('.swipe-tag.left');
    const tagRight = card.querySelector('.swipe-tag.right');

    // real finger taps always wobble a few pixels — this must be big enough that a tap
    // never gets mistaken for the start of a drag, but small enough that an intentional
    // swipe still feels immediate.
    const INTENT_PX = 14;

    function pointerDown(e){
      dragging = true; moved = false; decided = null;
      const p = e.touches ? e.touches[0] : e;
      startX = p.clientX; startY = p.clientY; curX = 0;
      inner.style.transition = 'none';
    }
    function applyTransform(dx){
      const rot = dx / 18;
      card.style.transform = `translateX(${dx}px) rotate(${rot}deg)`;
      const op = Math.min(Math.abs(dx)/80, 1);
      if(dx < 0){
        tagLeft.style.opacity = op; tagRight.style.opacity = 0;
        edgeGlowLeft.style.opacity = op; edgeGlowRight.style.opacity = 0;
      } else {
        tagRight.style.opacity = op; tagLeft.style.opacity = 0;
        edgeGlowRight.style.opacity = op; edgeGlowLeft.style.opacity = 0;
      }
    }
    function pointerMove(e){
      if(!dragging || decided === 'v') return;
      const p = e.touches ? e.touches[0] : e;
      const dx = p.clientX - startX;
      const dy = p.clientY - startY;

      if(decided === null){
        const adx = Math.abs(dx), ady = Math.abs(dy);
        if(adx < INTENT_PX && ady < INTENT_PX) return; // still just a tap-sized wobble, do nothing yet
        if(adx > ady * 1.3){
          decided = 'h'; // clear sideways intent — start the card drag
        } else {
          decided = 'v'; // vertical/ambiguous intent — let the page scroll, don't touch the card
          dragging = false;
          return;
        }
      }

      moved = true;
      curX = dx;
      pendingDx = dx;
      if(rafId === null){
        rafId = requestAnimationFrame(()=>{ applyTransform(pendingDx); rafId = null; });
      }
      e.preventDefault && e.cancelable && e.preventDefault();
    }
    function pointerUp(){
      if(rafId !== null){ cancelAnimationFrame(rafId); rafId = null; }
      if(!dragging){ return; }
      dragging = false;
      inner.style.transition = '';
      const threshold = 90;
      if(curX <= -threshold){
        flyOut(-1, markKnown);
      } else if(curX >= threshold){
        flyOut(1, markLater);
      } else if(moved){
        card.style.transition = 'transform .35s cubic-bezier(.2,.8,.2,1)';
        card.style.transform = '';
        tagLeft.style.opacity = 0; tagRight.style.opacity = 0;
        edgeGlowLeft.style.opacity = 0; edgeGlowRight.style.opacity = 0;
        setTimeout(()=>{ card.style.transition=''; }, 350);
      }
    }
    function flyOut(dir, cb){
      card.style.transition = 'transform .4s ease, opacity .4s ease';
      card.style.transform = `translateX(${dir*600}px) rotate(${dir*35}deg)`;
      card.style.opacity = '0';
      edgeGlowLeft.style.opacity = 0; edgeGlowRight.style.opacity = 0;
      setTimeout(cb, 220);
    }
    function click(){
      if(moved) return; // was a drag, not a tap
      card.classList.toggle('flipped');
    }

    card.addEventListener('mousedown', pointerDown);
    window.addEventListener('mousemove', pointerMove);
    window.addEventListener('mouseup', pointerUp);
    card.addEventListener('touchstart', pointerDown, {passive:true});
    card.addEventListener('touchmove', pointerMove, {passive:false});
    card.addEventListener('touchend', pointerUp);
    card.addEventListener('click', click);
  }

  function markKnown(){
    const wasCustom = currentDay === CUSTOM_DAY_ID;
    const id = queues[currentDay].shift();
    const wasAlreadyKnown = known.indexOf(id) !== -1; // maxsus kartochka orqali ikki marta qo'shilib ketmasin
    if(!wasAlreadyKnown) known.push(id);
    if(wasCustom && !wasAlreadyKnown){
      customKnownSet.add(id); // Maxsus Flashcarddan bilinganlar alohida guruhlanadi
    }
    saveState();
    renderStage();
    updateCounts(); // joriy kun tugmasidagi son (badge) darhol yangilansin — aks holda "muzlab" qolib, tab almashtirilgunicha eski son ko'rinaverar edi
    // hammasi ko'rib chiqilgach (navbat bo'shagach), Maxsus Flashcard tabi sekin yo'qoladi
    if(wasCustom && queues[CUSTOM_DAY_ID].length === 0 && customDeckExists && !customFadingOut){
      triggerCustomFadeOut();
    }
  }
  // Maxsus Flashcard navbati to'liq ko'rib chiqilganda, tab kunlar ro'yxatidan
  // sekin (fade) yo'qoladi — animatsiya tugagach butunlay ro'yxatdan olib tashlanadi
  function triggerCustomFadeOut(){
    customFadingOut = true;
    const btn = document.querySelector('.tab-btn-custom');
    if(btn){
      void btn.offsetWidth; // reflow — o'tish animatsiyasi joriy holatdan boshlansin
      btn.classList.add('fading-out');
      // fade tugagach, tugma egallab turgan joy (balandlik/bo'shliq) ham asta
      // yig'iladi — shu sababli pastidagi yozuvlar birdan tepaga sirg'anib
      // qolmaydi, balki tekis, sekin ko'tariladi
      setTimeout(()=>{
        if(!btn.isConnected) return;
        btn.style.maxHeight = btn.offsetHeight + 'px';
        void btn.offsetWidth;
        btn.classList.add('collapsing');
        btn.style.maxHeight = '0px';
      }, 480);
    }
    setTimeout(()=>{
      customDeckExists = false;
      customFadingOut = false;
      renderTabs();
    }, 480 + 340);
  }
  function markLater(){
    const id = queues[currentDay].shift();
    queues[currentDay].push(id);
    saveState();
    renderStage();
    updateCounts();
  }

  // ---------- KNOWN VIEW (faqat umumiy statistika) ----------

  // shu kunning bilganlar ro'yxatidagi so'zlarini yana navbatga (kartochka bo'limiga) qaytarish
  function requeueDay(d){
    const ids = known.filter(id=>byId[id].day===d && !customKnownSet.has(id));
    if(ids.length === 0) return;
    known = known.filter(id=>!(byId[id].day===d && !customKnownSet.has(id)));
    queues[d] = [...ids, ...queues[d]];
    saveState();
    currentDay = d;
    saveState();
    updateCounts();
    renderKnown();

  // "Maxsus Flashcard" guruhidagi bilganlarni "Bilganlarim"dan butunlay olib tashlab,
  // har bir so'zni o'zining asl kuni navbatiga qaytarish
  function removeCustomKnown(){
    const ids = known.filter(id=>customKnownSet.has(id));
    if(ids.length === 0) return;
    known = known.filter(id=>!customKnownSet.has(id));
    ids.forEach(id=>{
      customKnownSet.delete(id);
      const d = byId[id].day;
      if(!queues[d].includes(id)) queues[d].push(id);

  // ---------- TABS ----------
  const views = {
    learn: document.getElementById('view-learn'),
    known: document.getElementById('view-known'),
    all: document.getElementById('view-all'),
    quiz: document.getElementById('view-quiz'),
  };
  function showTab(tab){
    currentTab = tab;
    Object.keys(views).forEach(k=>{
      const el = views[k];
      const isTarget = k===tab;
      el.classList.toggle('hidden', !isTarget);
      if(isTarget){

        el.classList.remove('view-enter');

        el.classList.add('view-enter');

    });

    if(tab!=='learn') kunlarOpen = false;
    if(tab!=='quiz' && timedRevealTimeout){ clearTimeout(timedRevealTimeout); timedRevealTimeout = null; }
    if(tab!=='quiz' && timedUrgentTimeout){ clearTimeout(timedUrgentTimeout); timedUrgentTimeout = null; }

    if(tab==='known') renderKnown();

  // ---------- QUIZ ----------
  let quizItems = [], quizIdx = 0, quizScore = 0, quizReturnTab = 'known', quizPool = [], quizType = 'translate';
  let timedRevealTimeout = null;
  let timedUrgentTimeout = null;

  function startQuiz(ids, returnTab, mode){
    if(ids.length === 0) return;
    quizPool = ids.slice();
    quizItems = shuffle([...ids]);
    quizIdx = 0; quizScore = 0;
    quizReturnTab = returnTab;
    quizType = mode === 'romaji' ? 'romaji' : mode === 'timed' ? 'timed' : 'translate';
    showTab('quiz');
    renderQuizQuestion();
  }

  document.getElementById('btnQuizTranslate').addEventListener('click', ()=>{

  });
  document.getElementById('btnQuizRomaji').addEventListener('click', ()=>{
    startQuiz(known, 'known', 'romaji');
  });
  document.getElementById('btnQuizTimed').addEventListener('click', ()=>{
    startQuiz(known, 'known', 'timed');
  });

  function shuffle(arr){
    const a = [...arr];
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function renderQuizQuestion(){
    if(timedRevealTimeout){ clearTimeout(timedRevealTimeout); timedRevealTimeout = null; }
    if(timedUrgentTimeout){ clearTimeout(timedUrgentTimeout); timedUrgentTimeout = null; }
    const wrap = document.getElementById('quizWrap');
    if(quizIdx >= quizItems.length){
      renderQuizResult();
      return;
    }
    if(quizType === 'timed'){
      renderTimedQuizQuestion();
      return;
    }
    const word = byId[quizItems[quizIdx]];
    // build 4 options: correct + 3 distractors (shu viktorina o'z manbasidan, kifoya bo'lmasa hammasidan)
    const pool = quizPool.length >= 4 ? quizPool : WORDS.map(w=>w.id);
    let distractors = shuffle(pool.filter(id=>id!==word.id)).slice(0,3);
    const options = shuffle([word.id, ...distractors]);

    const modeLabel = quizType === 'romaji' ? "Kanjining romajisini toping" : "Kanjining ma'nosini toping";
    wrap.innerHTML = `
      <div class="quiz-progress">
        <span>Savol ${quizIdx+1} / ${quizItems.length}</span>
        <span class="score">Ball: ${quizScore}</span>
      </div>
      <div class="quiz-bar"><div class="quiz-bar-fill" style="width:${(quizIdx/quizItems.length)*100}%"></div></div>
      <div class="quiz-mode-label">${modeLabel}</div>
      <div class="quiz-feedback" id="quizFeedback"></div>
      <div class="quiz-card">
        <div class="quiz-kanji">${word.kanji}</div>
      </div>
      <div class="quiz-options">
        ${options.map(id=>`<button class="quiz-opt" data-id="${id}">${quizType === 'romaji' ? byId[id].romaji : byId[id].uz}</button>`).join('')}
      </div>
    `;
    wrap.querySelectorAll('.quiz-opt').forEach(btn=>{
      btn.addEventListener('click', ()=>handleQuizAnswer(btn, word.id, options));
    });
  }

  // ---------- VAQT SINOVI (timed recall quiz) ----------
  // Markazda kanji chiqadi, 10 soniya beriladi; chiziq o'ng tarafdan chap
  // tarafga qarab kamayadi. Vaqt tugagach (yoki kartaga bosilsa) romaji va
  // tagida kichikroq tarjima ochiladi, so'ng keyingi so'zga o'tiladi.
  const TIMED_QUIZ_SECONDS = 10;
  const TIMED_QUIZ_URGENT_AT = 3; // oxirgi necha soniyada chiziq qizarib milt-milt qiladi
  function renderTimedQuizQuestion(){
    const wrap = document.getElementById('quizWrap');
    const word = byId[quizItems[quizIdx]];
    wrap.innerHTML = `
      <div class="quiz-progress">
        <span>Savol ${quizIdx+1} / ${quizItems.length}</span>
      </div>
      <div class="quiz-bar"><div class="quiz-bar-fill" style="width:${(quizIdx/quizItems.length)*100}%"></div></div>
      <div class="quiz-mode-label">10 soniyada eslashga harakat qiling</div>
      <div class="quiz-mode-sublabel">Bilsangiz, ovoz chiqarib o'qing!</div>
      <div class="quiz-card quiz-card-timed" id="timedCard">
        <div class="quiz-kanji">${word.kanji}</div>
      </div>
      <div class="quiz-timer-bar"><div class="quiz-timer-fill" id="timedFill"></div></div>
      <div class="quiz-timed-status">
        <div class="quiz-timed-hint" id="timedHint">Javobni oldinroq ko'rish uchun kartaga bosing</div>
        <div class="quiz-reveal" id="timedReveal">
          <div class="qr-romaji">${word.romaji}</div>
          <div class="qr-uz">${word.uz}</div>
        </div>
      </div>
      <button class="quiz-timed-next" id="timedNext" disabled>Keyingisi →</button>
    `;
    const fill = document.getElementById('timedFill');
    const card = document.getElementById('timedCard');
    const nextBtn = document.getElementById('timedNext');
    let revealed = false;

    function reveal(){
      if(revealed) return;
      revealed = true;
      if(timedRevealTimeout){ clearTimeout(timedRevealTimeout); timedRevealTimeout = null; }
      if(timedUrgentTimeout){ clearTimeout(timedUrgentTimeout); timedUrgentTimeout = null; }
      fill.style.transition = 'none';
      fill.style.width = '0%';
      fill.classList.remove('urgent');
      document.getElementById('timedHint').classList.add('hide');
      document.getElementById('timedReveal').classList.add('show');
      nextBtn.disabled = false;
    }

    // chiziqni o'ng tarafdan chap tarafga qarab kamaytirish
    requestAnimationFrame(()=>{
      fill.style.transition = `width ${TIMED_QUIZ_SECONDS}s linear`;
      fill.style.width = '0%';
    });
    timedRevealTimeout = setTimeout(reveal, TIMED_QUIZ_SECONDS * 1000);
    // oxirgi 3 soniyada chiziq qizarib, milt-milt qiladi
    timedUrgentTimeout = setTimeout(()=>{ fill.classList.add('urgent'); }, (TIMED_QUIZ_SECONDS - TIMED_QUIZ_URGENT_AT) * 1000);

    card.addEventListener('click', reveal);
    nextBtn.addEventListener('click', ()=>{
      quizIdx++;
      renderQuizQuestion();
    });
  }

  // ---------- JAVOB HIS-TUYG'USI (quvonch/afsus emoji + o'zbekcha yozuv) ----------
  const CORRECT_FEEDBACK = [
    {emoji:"🎉", text:"Ajoyib!"},
    {emoji:"🌟", text:"Zo'r ketyapsiz!"},
    {emoji:"🔥", text:"Aynan shunday!"},
    {emoji:"👏", text:"Barakalla!"},
    {emoji:"✅", text:"To'g'ri javob!"},
    {emoji:"🏯", text:"Mukammal!"}
  ];
  const WRONG_FEEDBACK = [
    {emoji:"😅", text:"Yo'q, boshqacha edi"},
    {emoji:"🤔", text:"Deyarli! Yana urinib ko'ring"},
    {emoji:"📖", text:"Bu safar xato, davom eting"},
    {emoji:"💭", text:"Boshqa variant edi"},
    {emoji:"😮‍💨", text:"Hechqisi yo'q, mashq qilamiz"}
  ];
  function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  // matnni haqiqiy piksel kengligida O'LCHAB, uni doim belgi ramkasi ichiga
  // to'liq (na boshi, na oxiri, na emoji kesilmasdan) sig'diradigan aniq
  // shrift o'lchamini hisoblaydi — taxminiy harf-sanoq emas, haqiqiy o'lchov
  function measureTextWidth(text, fontSizePx){
    const span = document.createElement('span');
    span.style.position = 'absolute';
    span.style.visibility = 'hidden';
    span.style.whiteSpace = 'nowrap';
    span.style.fontFamily = "'Zen Maru Gothic',sans-serif";
    span.style.fontWeight = '800';
    span.style.letterSpacing = '0.01em';
    span.style.fontSize = fontSizePx + 'px';
    span.textContent = text;
    document.body.appendChild(span);
    const w = span.offsetWidth;
    document.body.removeChild(span);
    return w;
  }
  const FB_BASE_FS = 16, FB_MIN_FS = 8.5, FB_PAD_X = 12, FB_GAP = 5;
  function showQuizFeedback(isCorrect){
    const el = document.getElementById('quizFeedback');
    if(!el) return;
    const f = isCorrect ? pickRandom(CORRECT_FEEDBACK) : pickRandom(WRONG_FEEDBACK);
    el.innerHTML = `<span class="quiz-feedback-badge ${isCorrect?'correct':'wrong'}" id="fbBadge" style="font-size:${FB_BASE_FS}px"><span class="fb-emoji" id="fbEmoji">${f.emoji}</span><span class="fb-text" id="fbText">${f.text}</span></span>`;
    requestAnimationFrame(()=>{
      const badge = document.getElementById('fbBadge');
      const emojiEl = document.getElementById('fbEmoji');
      if(!badge) return;
      const containerW = el.clientWidth;
      const emojiW = emojiEl ? emojiEl.offsetWidth : (FB_BASE_FS + 5);
      const available = containerW - FB_PAD_X*2 - FB_GAP - emojiW - 4; // 4px — xavfsizlik zaxirasi
      const naturalW = measureTextWidth(f.text, FB_BASE_FS);
      let fs = FB_BASE_FS;
      if(available > 0 && naturalW > available){
        fs = Math.max(FB_MIN_FS, FB_BASE_FS * (available / naturalW));
      }
      badge.style.fontSize = fs.toFixed(2) + 'px';
      if(emojiEl) emojiEl.style.fontSize = (fs + 4.5).toFixed(2) + 'px';
    });
  }

  function handleQuizAnswer(btn, correctId, options){
    const chosenId = btn.getAttribute('data-id');
    const allBtns = document.querySelectorAll('.quiz-opt');
    allBtns.forEach(b=>b.classList.add('disabled'));
    if(chosenId === correctId){
      btn.classList.add('correct');
      quizScore++;
      flashPage('flash-correct');
      playCorrectSound();
      showQuizFeedback(true);
    } else {
      btn.classList.add('wrong');
      allBtns.forEach(b=>{ if(b.getAttribute('data-id')===correctId) b.classList.add('correct'); });
      flashPage('flash-wrong');
      playWrongSound();
      showQuizFeedback(false);
    }
    setTimeout(()=>{
      quizIdx++;
      renderQuizQuestion();
    }, 1300);
  }

  // ---------- SAHIFA FLESHI (to'g'ri/noto'g'ri javob his-tuyg'usi) ----------
  const pageFlashEl = document.getElementById('pageFlash');
  function flashPage(type){
    pageFlashEl.classList.remove('flash-correct','flash-wrong');
    void pageFlashEl.offsetWidth; // reflow — animatsiyani qayta ishga tushirish uchun
    pageFlashEl.classList.add(type);
    setTimeout(()=>pageFlashEl.classList.remove(type), 820);
  }

  // ---------- TOVUSH EFFEKTLARI (Web Audio API, fayl talab qilmaydi) ----------
  let audioCtx = null;
  function getAudioCtx(){
    if(!audioCtx){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return null;
      audioCtx = new Ctx();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function playTone(freq, startOffset, duration, type, peakGain){
    const ctx = getAudioCtx();
    if(!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime + startOffset);
    gain.gain.setValueAtTime(0.0001, ctx.currentTime + startOffset);
    gain.gain.linearRampToValueAtTime(peakGain, ctx.currentTime + startOffset + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + startOffset + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime + startOffset);
    osc.stop(ctx.currentTime + startOffset + duration + 0.03);
  }
  function playCorrectSound(){
    try{
      // quvnoq, yorqin ko'tarilib boruvchi mayor arpeggio — o'yin g'alabasiga
      // o'xshash ijobiy tuyg'u beradi, lekin qisqa va yumshoq eshitiladi
      playTone(523.25,  0,    0.16, 'sine', 0.13); // C5
      playTone(659.25,  0.07, 0.18, 'sine', 0.13); // E5
      playTone(783.99,  0.14, 0.20, 'sine', 0.12); // G5
      playTone(1046.50, 0.21, 0.34, 'sine', 0.115);// C6 — yorqin, davomli yakun
    }catch(e){}
  }
  function playWrongSound(){
    try{
      // yumshoq, past ohangda pastga tushuvchi ikki ton — xafa qilmaydigan,
      // "hechqisi yo'q" degandek iliq va bosiq tovush (keskin emas)
      playTone(311.13, 0,    0.24, 'triangle', 0.085); // Eb4
      playTone(246.94, 0.10, 0.34, 'triangle', 0.075); // B3 — pastga, yumshoq so'nish
    }catch(e){}
  }

  function renderQuizResult(){
    const wrap = document.getElementById('quizWrap');
    const backLabel = quizReturnTab==='learn' ? 'Kartochkalarga qaytish' : quizReturnTab==='all' ? 'Hammasiga qaytish' : 'Bilganlarimga qaytish';
    // qayta boshlash — xuddi shu so'zlar to'plami, rejim va qaytish tabi bilan
    const restartPool = quizPool.slice();
    const restartReturnTab = quizReturnTab;
    const restartType = quizType;
    if(quizType === 'timed'){
      wrap.innerHTML = `
        <div class="quiz-result">
          <div class="big-em">⏱️</div>
          <h2>${quizItems.length} ta so'z takrorlandi</h2>
          <p>Vaqt sinovi tugadi. Mashqni davom ettiring!</p>
          <div class="quiz-result-actions">
            <button class="quiz-result-restart" id="btnRestartQuiz">Qayta boshlash</button>
            <button id="btnBackKnown">${backLabel}</button>
          </div>
        </div>
      `;
      document.getElementById('btnBackKnown').addEventListener('click', ()=>showTab(quizReturnTab));
      document.getElementById('btnRestartQuiz').addEventListener('click', ()=>startQuiz(restartPool, restartReturnTab, restartType));
      return;
    }
    const pct = Math.round((quizScore/quizItems.length)*100);
    let emoji = "🌱", msg = "Davom eting, mashq — mahorat kaliti!";
    if(pct === 100){ emoji="🏯"; msg="Mukammal! Barcha so'zlarni bilasiz!"; }
    else if(pct >= 70){ emoji="🎋"; msg="Ajoyib natija!"; }
    wrap.innerHTML = `
      <div class="quiz-result">
        <div class="big-em">${emoji}</div>
        <h2>${quizScore} / ${quizItems.length} to'g'ri</h2>
        <p>${msg}</p>
        <div class="quiz-result-actions">
          <button class="quiz-result-restart" id="btnRestartQuiz">Qayta boshlash</button>
          <button id="btnBackKnown">${backLabel}</button>
        </div>
      </div>
    `;
    document.getElementById('btnBackKnown').addEventListener('click', ()=>showTab(quizReturnTab));
    document.getElementById('btnRestartQuiz').addEventListener('click', ()=>startQuiz(restartPool, restartReturnTab, restartType));
  }

  // ---------- KO'TARILUVCHI NUQTALAR (kartochka/tugmalar ortidagi ambient animatsiya) ----------
  // Bitta doimiy requestAnimationFrame sikli orqali ishlaydi. Canvas butun
  // ilova umri davomida DOM'da qoladi (tablar faqat hidden klassini
  // almashtiradi, hech narsani destroy qilmaydi), shu sababli bu animatsiya:
  //  - sahifa skroll qilinganda to'xtamaydi (canvas fixed pozitsiyada);
  //  - boshqa menyu/tabga o'tilganda qayta boshlanmaydi (loop davom etaveradi);
  //  - "Boshlash" tugmasi bosilgunga qadar umuman ishga tushmaydi.
  // PERFORMANS: aura (aylanma nur) har bir kadrda gradient hisoblamaydi —
  // har rang uchun bitta "glow sprite" oldindan (start paytida) tayyorlanadi
  // va keyin faqat drawImage bilan chizib qo'yiladi (juda arzon amal).
  // Shuningdek canvas ichki piksel zichligi ekran o'lchamidan pastroq
  // qilib olinadi (RENDER_SCALE) — aura tabiiy yumshoqligi tufayli sifat
  // yo'qolmaydi, lekin har kadrda tozalanadigan/chizib chiqiladigan piksel
  // soni sezilarli kamayadi — bu esa sekin telefonlarda ham silliqlikni
  // ta'minlaydi.
  const DotsFX = (function(){
    const canvas = document.getElementById('dotsCanvas');
    if(!canvas || !canvas.getContext) return { start(){} };
    const ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });
    let W = 0, H = 0, scale = 1;
    let particles = [];
    let started = false, running = false, rafId = null, lastT = null;
    let resizeTimer = null;

    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const isLite = document.documentElement.classList.contains('lite');
    const COUNT = reduceMotion ? 0 : (isLite ? 14 : 26);
    // ichki render piksel zichligi — CSS o'lchami o'zgarmaydi, faqat
    // canvas'ning haqiqiy piksel "orqa qatlami" pastroq zichlikda chiziladi
    const RENDER_SCALE = isLite ? 0.55 : 0.75;
    // palitra :root o'zgaruvchilaridan olingan rgb qiymatlar — accent, gold, moss, ink
    const COLORS = ['217,105,79', '201,166,107', '124,154,107', '236,231,220'];
    const sprites = []; // har rang uchun oldindan tayyorlangan aura sprite'i

    function buildSprites(){
      if(sprites.length) return;
      const SZ = 64; // sprite fizik o'lchami (px) — kichik va bir marta yasaladi
      COLORS.forEach(color=>{
        const off = document.createElement('canvas');
        off.width = SZ; off.height = SZ;
        const octx = off.getContext('2d');
        const g = octx.createRadialGradient(SZ/2,SZ/2,0, SZ/2,SZ/2,SZ/2);
        g.addColorStop(0,   `rgba(${color},0.95)`);
        g.addColorStop(0.22,`rgba(${color},0.55)`);
        g.addColorStop(0.55,`rgba(${color},0.16)`);
        g.addColorStop(1,   `rgba(${color},0)`);
        octx.fillStyle = g;
        octx.beginPath();
        octx.arc(SZ/2,SZ/2,SZ/2,0,Math.PI*2);
        octx.fill();
        sprites.push(off);
      });
    }

    function resize(){
      W = window.innerWidth; H = window.innerHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      scale = dpr * RENDER_SCALE;
      canvas.width = Math.max(1, Math.round(W*scale));
      canvas.height = Math.max(1, Math.round(H*scale));
      canvas.style.width = W+'px';
      canvas.style.height = H+'px';
      ctx.setTransform(scale,0,0,scale,0,0);
    }

    function makeParticle(seedAnywhere){
      const r = 0.7 + Math.random()*1.3;    // kichikroq nuqta — orqa fonda his qilinishi uchun
      const startY = seedAnywhere ? Math.random()*H : H + r + Math.random()*60;
      const reach = 60 + Math.random()*50; // ekran tepasidan qanchalik "oshib" ko'tarilib g'oyib bo'lishi
      const colorIdx = (Math.random()*COLORS.length)|0;
      return {
        x: Math.random()*W,
        y: startY,
        startY: startY,
        endY: -reach,
        r: r,
        auraR: (r*4.5) + Math.random()*2.5,  // aura kichikroq va yumshoqroq
        speed: 9 + Math.random()*13,         // sekinroq — uzoqda, orqa fonda suzayotgandek tuyuladi
        drift: (Math.random()-0.5)*6,
        swayPhase: Math.random()*Math.PI*2,
        swayFreq: 0.3 + Math.random()*0.4,
        colorIdx: colorIdx,
        color: COLORS[colorIdx],
        maxAlpha: 0.12 + Math.random()*0.16,
      };
    }

    function seed(){
      particles = [];
      for(let i=0;i<COUNT;i++) particles.push(makeParticle(true));
    }

    function envelope(p){
      // vaqt emas, balki bosib o'tilgan MASOFAGA qarab so'nadi — shu sababli
      // nuqta doim deyarli ekran tepasigacha ko'tarilib ulguradi, so'ngra
      // asta yo'qoladi (avvalgidek yarim yo'lda erta so'nib qolmaydi)
      const total = p.startY - p.endY;
      const traveled = p.startY - p.y;
      const t = total > 0 ? traveled/total : 1;
      const inEnd = 0.12, outStart = 0.78;
      if(t < inEnd) return t/inEnd;
      if(t > outStart) return Math.max(0, 1-(t-outStart)/(1-outStart));
      return 1;
    }

    function step(ts){
      if(!running) return;
      if(lastT === null) lastT = ts;
      let dt = (ts - lastT)/1000;
      lastT = ts;
      if(dt > 0.12) dt = 0.12; // fon rejimidan qaytganda katta sakrashning oldini olamiz
      ctx.clearRect(0,0,W,H);
      for(let i=0;i<particles.length;i++){
        const p = particles[i];
        p.y -= p.speed*dt;
        p.x += Math.sin(p.swayPhase + (p.startY-p.y)*0.01*p.swayFreq) * p.drift * dt;
        if(p.y < p.endY){
          particles[i] = makeParticle(false);
          continue;
        }
        const a = envelope(p) * p.maxAlpha;
        if(a <= 0.004) continue;
        // aura — oldindan tayyorlangan sprite, arzon drawImage
        ctx.globalAlpha = a;
        const s = p.auraR*2;
        ctx.drawImage(sprites[p.colorIdx], p.x-s/2, p.y-s/2, s, s);
        // yorqin markaz — nuqtaning o'zi biroz aniqroq ko'rinishi uchun
        ctx.globalAlpha = Math.min(1, a*1.3);
        ctx.beginPath();
        ctx.fillStyle = `rgba(${p.color},1)`;
        ctx.arc(p.x, p.y, p.r*0.55, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      rafId = requestAnimationFrame(step);
    }

    function start(){
      if(started) return;         // faqat bir marta — qayta boshlanmaydi
      started = true;
      if(COUNT === 0) return;     // reduced-motion — sokin, animatsiyasiz
      // og'ir ishni (sprite yasash, canvas o'lchash) "Boshlash" tugmasi
      // bosilgan zumdagi o'tish animatsiyasidan keyingi kadrga suramiz —
      // shu orqali splash yopilish animatsiyasi hech qanday sakrashsiz,
      // yanada silliqroq ishlaydi
      requestAnimationFrame(()=>{
        buildSprites();
        resize();
        seed();
        running = true;
        lastT = null;
        rafId = requestAnimationFrame(step);
      });
    }

    window.addEventListener('resize', ()=>{
      if(!started) return;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(resize, 150); // debounce — mobil brauzer panellari tez-tez resize otadi
    }, {passive:true});
    document.addEventListener('visibilitychange', ()=>{
      if(!started || COUNT===0) return;
      if(document.hidden){
        running = false;
        if(rafId) cancelAnimationFrame(rafId);
      } else if(!running){
        running = true;
        lastT = null;            // vaqt hisobini qayta boshlaymiz, nuqtalar holati saqlanib qoladi
        rafId = requestAnimationFrame(step);
      }
    });

    return { start };
  })();

  // ---------- SPLASH / INTRO ----------
  // yumshoq "ting" jiringlagan qo'ng'iroq ohangi — mavjud playTone infratuzilmasidan
  // foydalanadi (zen qo'ng'irog'iga o'xshash yumshoq, jaranglagan tovush)
  let introTingPlayed = false;
  function playTing(){
    try{
      // toza, iliq "ding" qo'ng'irog'i — ikkita uyg'un ton (kvinta oralig'ida),
      // biroz kechikib jaranglaydi va sekin-asta so'nadi; hech qanday
      // detune yoki tembr aralashmasi yo'q, shu bois toza va sokin eshitiladi
      playTone(587.33, 0,    1.5, 'sine', 0.20); // D5 — asosiy urg'u
      playTone(880.00, 0.14, 1.8, 'sine', 0.14); // A5 — mos keluvchi kvinta, davomli
    }catch(e){ /* audio ijozat berilmagan yoki qo'llab-quvvatlanmaydi — sezilmasdan o'tkazib yuboriladi */ }
  }
  // Brauzerlar sahifa ochilgan zahoti, foydalanuvchi hali birror joyga tegmasdan
  // turib tovush chiqarishga ruxsat bermaydi. Shu sababli avval urinib ko'ramiz;
  // agar brauzer bloklab qo'ysa (odatiy holat), foydalanuvchi ekranga birinchi
  // marta tegishi bilanoq — xuddi o'sha kirish animatsiyasi ohangi bir marta chalinadi.
  function tryPlayIntroTing(){
    if(introTingPlayed) return;
    const ctx = getAudioCtx();
    if(!ctx) return;
    if(ctx.state === 'running'){
      introTingPlayed = true;
      playTing();
    } else {
      ctx.resume().then(()=>{
        if(!introTingPlayed && ctx.state === 'running'){
          introTingPlayed = true;
          playTing();
        }
      }).catch(()=>{});
    }
  }
  // "Boshlash" tugmasi bosilganda chaqiriladi — bu haqiqiy foydalanuvchi
  // teginishi bo'lgani uchun brauzer tovushni bemalol ruxsat beradi.
  function hideSplash(evt){
    const splash = document.getElementById('splashScreen');
    if(!splash || splash.classList.contains('splash-hide')) return;

    // aynan bosilgan nuqtani aniqlaymiz — bo'lmasa (masalan xavfsizlik
    // taymeri chaqirsa) ekran markazini olamiz
    let ox = window.innerWidth / 2, oy = window.innerHeight / 2;
    if(evt){
      if(evt.changedTouches && evt.changedTouches.length){
        ox = evt.changedTouches[0].clientX; oy = evt.changedTouches[0].clientY;
      } else if(typeof evt.clientX === 'number' && (evt.clientX || evt.clientY)){
        ox = evt.clientX; oy = evt.clientY;
      }
    }
    document.documentElement.style.setProperty('--origin-x', ox + 'px');
    document.documentElement.style.setProperty('--origin-y', oy + 'px');

    splash.classList.add('splash-hide');
    DotsFX.start(); // "Boshlash" bosilgan zahoti — ko'tariluvchi nuqtalar shu yerda boshlanadi
    const shell = document.getElementById('appShell');
    const flare = document.getElementById('introFlare');
    const ripple = document.getElementById('introRipple');

    if(ripple){
      ripple.classList.add('play');
      setTimeout(()=>ripple.classList.remove('play'), 950);
    }
    if(shell) shell.classList.add('app-shell-reveal');
    if(flare){
      flare.classList.add('play');
      tryPlayIntroTing();
      setTimeout(()=>flare.classList.remove('play'), 1400);
    }
    setTimeout(()=>{ splash.style.display = 'none'; }, 750);
  }
  // yuklanish tugagach shu funksiya chaqiriladi — endi ekran avtomatik yopilmaydi,
  // "Boshlash" tugmasi ko'rinadigan bo'ladi va foydalanuvchi bosishini kutadi
  function showStartButton(){
    const track = document.getElementById('splashBarTrack');
    const btn = document.getElementById('splashStartBtn');
    if(track) track.classList.add('splash-bar-fade');
    if(btn){
      btn.classList.add('show');
      btn.addEventListener('click', (e)=>hideSplash(e), {once:true});
    }
  }
  // xavfsizlik: nimadir noto'g'ri ketib, tugma hech qachon bosilmasa ham,
  // ilova abadiy osilib qolmasligi uchun (tovushsiz, sokin o'tadi)
  setTimeout(hideSplash, 20000);

  // ---------- PWA: SERVICE WORKER RO'YXATDAN O'TKAZISH ----------
  // Sahifa to'liq yuklanganidan keyin, fonda, hech narsani sekinlashtirmasdan.
  // Ilova bosh ekranga qo'shilganda brauzer panellarisiz ochilishi va
  // internetsiz ham ishlashi shu orqali ta'minlanadi.
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('./sw.js').catch(()=>{ /* sokin o'tkazib yuboriladi */ });
    });
  }

  // ---------- INIT ----------
  (async function init(){
    const splashStart = Date.now();
    await loadState();
    showTab('learn');
    updateCounts();
    const MIN_SPLASH_MS = 2400;
    const wait = Math.max(0, MIN_SPLASH_MS - (Date.now() - splashStart));
    setTimeout(showStartButton, wait);
  })();

})();
</script>
</body>
</html>
