/* ============================================================
   MOCHI AI — Aqlli yordamchi tizimi
   ============================================================ */
class MochiAI {
  constructor(){
    this.bubble = document.getElementById('mochiBubble');
    this.content = document.getElementById('mochiBubbleContent');
    this.input = document.getElementById('mochiInput');
    this.sendBtn = document.getElementById('mochiSend');
    this.micBtn = document.getElementById('mochiMic');
    this.typing = document.getElementById('mochiTyping');
    this.chips = document.getElementById('mochiChips');
    this.hint = document.getElementById('mochiHint');
    this.mochiBody = document.querySelector('.mochi-body');
    this.isOpen = false;
    this.isSpeaking = false;
    this.context = 'flash';
    this.lastQuizResult = null;
    this.voiceEnabled = 'speechSynthesis' in window;
    this.isListening = false;
    this.recognition = null;
    this.conversationHistory = [];
    this.greeted = false;

    // ============================================
    // AI BACKEND MANZILI: kalit saytda emas, serverda (Cloudflare Worker) saqlanadi
    // ============================================
    this.API_URL = 'https://mochi-ai.vestatvmistick.workers.dev/chat';
    this.askedForKey = false;

    this.setupSpeechRecognition();
    this.init();
  }

  init(){
    this.sendBtn.addEventListener('click', ()=>this.handleUserInput());
    this.input.addEventListener('keypress', (e)=>{ if(e.key==='Enter') this.handleUserInput(); });
    if(this.micBtn) this.micBtn.addEventListener('click', ()=>this.toggleListening());

    this.chips.querySelectorAll('.mochi-chip').forEach(chip=>{
      chip.addEventListener('click', ()=>this.handleChipClick(chip.dataset.chip));
    });

    [tabFlash, tabQuiz, tabKnown].forEach((btn, i)=>{
      const contexts = ['flash', 'quiz', 'known'];
      btn.addEventListener('click', ()=>{
        this.context = contexts[i];
        this.lastQuizResult = null;
        this.updateChipsForContext();
      });
    });

    this.hookQuizEvents();
    this.updateChipsForContext();
  }

  hookQuizEvents(){
    const originalSubmit = window.submitAnswer;
    if(originalSubmit){
      window.submitAnswer = (isCorrect, selectedBtn)=>{
        this.lastQuizResult = isCorrect ? 'correct' : 'wrong';
        originalSubmit(isCorrect, selectedBtn);
      };
    }
  }

  setupSpeechRecognition(){
    const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SpeechRecognitionCtor){
      if(this.micBtn){
        this.micBtn.classList.add('unsupported');
        this.micBtn.title = "Bu brauzerda ovozli kiritish qo'llanmaydi";
      }
      return;
    }
    this.recognition = new SpeechRecognitionCtor();
    this.recognition.lang = 'uz-UZ';
    this.recognition.interimResults = false;
    this.recognition.maxAlternatives = 1;
    this.recognition.continuous = false;

    this.recognition.onstart = ()=>{
      this.isListening = true;
      if(this.micBtn) this.micBtn.classList.add('listening');
      this.input.placeholder = "Tinglayapman...";
    };
    this.recognition.onresult = (event)=>{
      this.input.value = event.results[0][0].transcript;
      this.handleUserInput();
    };
    this.recognition.onerror = (event)=>{
      if(event.error === 'no-speech') this.showHint("Ovoz eshitilmadi 🎤");
      else if(event.error === 'not-allowed') this.showHint("Mikrofonga ruxsat bering 🎙️");
    };
    this.recognition.onend = ()=>{
      this.isListening = false;
      if(this.micBtn) this.micBtn.classList.remove('listening');
      this.input.placeholder = "Savol yozing yoki gapiring...";
    };
  }

  toggleListening(){
    if(!this.recognition) return;
    if(!this.isOpen) this.open();
    if(this.isListening){ this.recognition.stop(); return; }
    this.stopSpeaking();
    try{ this.recognition.start(); }catch(err){}
  }

  toggle(){ this.isOpen ? this.close() : this.open(); }

  open(){
    this.isOpen = true;
    this.bubble.classList.add('show');
    if(!this.greeted){
      this.greeted = true;
      this.typeMessage(this.getGreeting());
    }
    this.input.focus();
  }

  close(){
    this.isOpen = false;
    this.bubble.classList.remove('show');
    this.stopSpeaking();
  }

  showHint(text){
    if(!this.hint || this.isOpen) return;
    this.hint.textContent = text;
    this.hint.classList.add('show');
    setTimeout(()=>this.hint.classList.remove('show'), 3500);
  }

  updateChipsForContext(){
    const chipsData = {
      flash: [
        {k:'explain', t:"So'z tushuntirish"},
        {k:'practice', t:"Mashq qilish"},
        {k:'tip', t:"Yodlash usuli"}
      ],
      quiz: [
        {k:'hint', t:"Yordam ber"},
        {k:'encourage', t:"Motivatsiya"},
        {k:'explain', t:"Xatoni tushuntir"}
      ],
      known: [
        {k:'review', t:"Qayta ko'rib chiqish"},
        {k:'challenge', t:"Qiyinroq savol"},
        {k:'tip', t:"Yangi so'z"}
      ]
    };
    const data = chipsData[this.context] || chipsData.flash;
    this.chips.innerHTML = data.map(d=>`<button class="mochi-chip" data-chip="${d.k}">${d.t}</button>`).join('');
    this.chips.querySelectorAll('.mochi-chip').forEach(chip=>{
      chip.addEventListener('click', ()=>this.handleChipClick(chip.dataset.chip));
    });
  }

  getGreeting(){
    const greetings = {
      flash: "Salom! Men Mochi — yapon tilidagi yordamchingizman. Savol berishingiz yoki so'z haqida so'rashingiz mumkin! 🎌",
      quiz: "Viktorina vaqti! 💪 Savollarga javob bering, men yordam beraman!",
      known: "Bilaman bo'limi! Siz allaqachon ko'p narsalarni o'rgandingiz. 🌟"
    };
    return greetings[this.context] || greetings.flash;
  }

  handleChipClick(type){
    const prompts = {
      help: "Menga yapon tilida qanday yordam bera olishingni tushuntir",
      explain: "Menga tasodifiy yapon so'zini tushuntirib ber va uni qanday yodlashni ayt",
      practice: "Menga yapon tilida qisqa mashq ber",
      tip: "Yodlash bo'yicha samarali usul ayt",
      hint: "Viktorinada yordam berish uchun maslahat ber",
      encourage: "Meni ruhlantir",
      review: "Qayta ko'rib chiqish uchun maslahat ber",
      challenge: "Menga qiyinroq yapon tili savoli ber",
      word: "Menga tasodifiy so'z tushuntirib ber"
    };
    const text = prompts[type] || type;
    this.input.value = text;
    this.handleUserInput();
  }

  async handleUserInput(){
    const text = this.input.value.trim();
    if(!text) return;
    this.input.value = '';

    this.addMessage(text, 'user');

    this.typing.classList.add('show');
    this.mochiBody.classList.add('thinking');
    this.stopSpeaking();

    // API kalit mavjudligini tekshirish
    const hasKey = !!this.API_URL && !this.API_URL.includes('YOUR-WORKER');

    // Avval local javobni sinab ko'ramiz — tez va ishonchli
    const localReply = this.getLocalReply(text);

    try{
      let reply;
      if(hasKey){
        reply = await this.askGroq(text);
      } else {
        // API kalit yo'q — local javob + kalit so'rash
        reply = localReply || this.getDefaultLocalReply(text);
      }

      this.typing.classList.remove('show');
      this.mochiBody.classList.remove('thinking');
      this.mochiBody.classList.add('speaking');

      const replyDiv = document.createElement('div');
      replyDiv.style.marginBottom = '8px';
      replyDiv.style.fontSize = '12.5px';
      replyDiv.innerHTML = reply;
      this.content.appendChild(replyDiv);
      this.content.scrollTop = this.content.scrollHeight;

      const plain = reply.replace(/<[^>]*>/g, '');
      this.speak(plain);

      const speakTime = Math.max(2000, reply.length * 40);
      setTimeout(()=>{ this.mochiBody.classList.remove('speaking'); }, speakTime);

      if(this.lastQuizResult === 'correct'){
        mochiHappy(); this.lastQuizResult = null;
      } else if(this.lastQuizResult === 'wrong'){
        mochiSad(); this.lastQuizResult = null;
      }

    }catch(err){
      console.error('Groq xatosi:', err);
      this.typing.classList.remove('show');
      this.mochiBody.classList.remove('thinking');

      // API xatoligida ham local javob ko'rsatamiz
      const fallbackReply = localReply || this.getDefaultLocalReply(text);

      this.mochiBody.classList.add('speaking');
      const replyDiv = document.createElement('div');
      replyDiv.style.marginBottom = '8px';
      replyDiv.style.fontSize = '12.5px';
      replyDiv.innerHTML = fallbackReply + '<br><br><em style="color:var(--muted);font-size:11px;">⚡ Local javob (API vaqtinchalik ishlamayapti: ' + (err && err.message ? err.message : 'noma\'lum') + ')</em>';
      this.content.appendChild(replyDiv);
      this.content.scrollTop = this.content.scrollHeight;

      const plain = fallbackReply.replace(/<[^>]*>/g, '');
      this.speak(plain);

      setTimeout(()=>{ this.mochiBody.classList.remove('speaking'); }, 2500);
    }
  }

  /* ---------- LOCAL FALLBACK REPLIES ---------- */
  getLocalReply(text){
    const t = text.toLowerCase();

    // So'z qidirish — lug'atdan
    const foundWord = ALL_WORDS.find(w => 
      t.includes(w.uz.toLowerCase()) || 
      t.includes(w.romaji.toLowerCase()) ||
      w.accepted.some(a => t.includes(a.toLowerCase()))
    );

    if(foundWord && (t.includes('so\'z') || t.includes('tushun') || t.includes('maq') || t.includes('nim') || t.includes('word'))){
      return `<b>${foundWord.uz}</b><br>🇯🇵 <b>${foundWord.kana}</b><br>🔊 ${foundWord.romaji}<br>📂 ${foundWord.group}<br><br>${foundWord.note ? '📝 ' + foundWord.note + '<br>' : ''}Bu so'zni yodlash uchun uni ovoz chiqarib 3 marta takrorlang va misol jumlada ishlating! ✨`;
    }

    if(t.includes('mashq') || t.includes('mashq') || t.includes('practice') || t.includes('exercise')){
      const pool = shuffle(ALL_WORDS).slice(0,4);
      const correct = pool[0];
      const opts = shuffle(pool.map(w => w.kana));
      return `<b>🎯 Mashq: To'g'ri javobni tanlang</b><br><br><b>${correct.uz}</b> — qaysi?<br><br>${opts.map((o,i) => `${i+1}) ${o}`).join('<br>')}<br><br>✅ Javob: <b>${correct.kana}</b> (${correct.romaji})`;
    }

    if(t.includes('yodlash') || t.includes('tip') || t.includes('usul') || t.includes('maslahat') || t.includes('advice')){
      const tips = [
        "<b>🧠 Yodlash usuli: Mnemonika</b><br>Hiragana harflarini tasavvur qiling. Masalan, 'あ' (a) ni ochildiq og'iz shakli deb eslang.<br><br>Har bir so'zni rasmla bog'lab yodlang!",
        "<b>🔄 Takrorlash jadvali</b><br>Yangi so'zni 1 soatdan keyin, keyin 1 kundan keyin, 3 kundan keyin va 1 haftadan keyin takrorlang. Bu Spaced Repetition usuli.<br><br>Flashcard'larni har kuni 10 daqiqa ko'rib chiqing!",
        "<b>🎧 Eshitish orqali</b><br>Har bir so'zni ovoz chiqarib o'qing. Yapon tilida intonatsiya muhim!<br><br>Romajidan foydalanib to'g'ri talaffuzni o'rganing.",
        "<b>✍️ Yozish orqali</b><br>So'zni 5 marta yozing: avval kana, keyin romaji, keyin ma'nosi. Qo'l mushaklari xotirani mustahkamlaydi!"
      ];
      return tips[Math.floor(Math.random()*tips.length)];
    }

    if(t.includes('salom') || t.includes('hello') || t.includes('hi ')){
      return `Salom! 👋 Men Mochi — yapon tilidagi yordamchingizman.<br><br>Quyidagilarni qila olaman:<br>• So'zlarni tushuntirish<br>• Mashqlar berish<br>• Yodlash usullarini ko'rsatish<br>• Viktorinada yordam berish<br><br>Savol berishingiz mumkin! 🎌`;
    }

    if(t.includes('yordam') || t.includes('help') || t.includes('qila ol')){
      return `<b>🌟 Mochi nima qila oladi?</b><br><br>1️⃣ <b>So'z tushuntirish</b> — istalgan so'z haqida ma'lumot<br>2️⃣ <b>Mashq qilish</b> — 4 variantli testlar<br>3️⃣ <b>Yodlash usuli</b> — samarali metodlar<br>4️⃣ <b>Viktorina yordami</b> — motivatsiya va maslahat<br><br>Tezkor tugmalardan foydalaning yoki savol yozing!`;
    }

    if(foundWord){
      return `<b>${foundWord.uz}</b> — bu so'zni bilasizmi?<br><br>🇯🇵 <b>${foundWord.kana}</b><br>🔊 ${foundWord.romaji}<br>📂 ${foundWord.group}<br><br>Flashcard bo'limida bu so'zni ko'rib chiqing! 🃏`;
    }

    return null; // Local javob topilmadi — default reply ishlatiladi
  }

  getDefaultLocalReply(text){
    const t = text.toLowerCase();
    if(t.includes('qanday') || t.includes('nima')){
      return `Bu haqida to'liq ma'lumot berish uchun <b>API kalit</b> kerak.<br><br>Lekin sizga yordam bera olaman:<br>• Istagan so'zni tushuntirishim mumkin<br>• Mashq berishim mumkin<br>• Yodlash usuli ko'rsatishim mumkin<br><br>Quyidagi tugmalardan birini bosing yoki so'z nomini yozing! 🎯`;
    }
    return `Tushundim! 💬<br><br>Hozircha to'liq AI javob berishim uchun API kalit kerak. Lekin sizga boshqa yo'llar bilan yordam bera olaman:<br><br>• <b>So'z tushuntirish</b> — istalgan so'z haqida<br>• <b>Mashq qilish</b> — testlar<br>• <b>Yodlash usuli</b> — samarali metodlar<br><br>Quyidagi tugmalardan foydalaning! 👇`;
  }

  /* ========== TO'G'RIDAN-TO'G'RI GROQ API ========== */async askGroq(userText){
    this.conversationHistory.push({role:'user', content:userText});
    if(this.conversationHistory.length > 20){
      this.conversationHistory = this.conversationHistory.slice(-20);
    }

    const messages = [
      {role: 'system', content: this.buildSystemPrompt()},
      ...this.conversationHistory
    ];

    let response;
    try{
      response = await fetch(this.API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: messages })
      });
    }catch(networkErr){
      // CORS yoki network xatosi
      console.error('Tarmoq xatosi:', networkErr);
      if(networkErr.name === 'TypeError' && networkErr.message.includes('fetch')){
        throw new Error('CORS_BLOCKED');
      }
      throw new Error('NETWORK_ERROR');
    }

    if(!response.ok){
      let errText = '';
      try{ errText = await response.text(); }catch(e){}
      if(response.status === 401) throw new Error('API_KEY_INVALID');
      if(response.status === 429) throw new Error('RATE_LIMIT');
      throw new Error('API_ERROR:' + response.status);
    }

    const data = await response.json();
    const rawText = data.choices?.[0]?.message?.content || "Javob yo'q";

    this.conversationHistory.push({role:'assistant', content: rawText});
    return this.formatAIText(rawText);
  }

  buildSystemPrompt(){
    const contextNames = {flash:"Flashcard", quiz:"Viktorina", known:"Bilaman"};
    const currentScreen = contextNames[this.context] || contextNames.flash;
    let quizNote = '';
    if(this.context === 'quiz' && this.lastQuizResult){
      quizNote = this.lastQuizResult === 'correct'
        ? "\nFoydalanuvchi hozirgina viktorinada TO'G'RI javob berdi."
        : "\nFoydalanuvchi hozirgina viktorinada XATO javob berdi.";
    }
    return `Sen "Mochi" ismli, do'stona va quvnoq AI yordamchisan. O'zbek tilida so'zlashuvchi foydalanuvchiga yapon tilini o'rganishda yordam berasan.

Qoidalar:
- FAQAT o'zbek tilida javob ber (yapon so'zlari, kana va romaji bundan mustasno).
- Javoblar qisqa, iliq va tushunarli bo'lsin (2-5 gap).
- Emoji va HTML <b>, <br>, <em> teglaridan foydalan.
- Foydalanuvchi hozir "${currentScreen}" bo'limida.${quizNote}
- Erkin suhbat qura olasan, savollarga chinakam javob ber.

Lug'at (JSON): ${this.buildVocabContext()}`;
  }

  buildVocabContext(){
    if(this._vocabCache) return this._vocabCache;
    const compact = ALL_WORDS.slice(0, 200).map(w=>({
      uz:w.uz, kana:w.kana, romaji:w.romaji, group:w.group
    }));
    this._vocabCache = JSON.stringify(compact);
    return this._vocabCache;
  }

  formatAIText(text){
    const escaped = text
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;');
    return escaped
      .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      .replace(/\n/g, '<br>');
  }

  addMessage(text, sender){
    const div = document.createElement('div');
    div.style.marginBottom = '8px';
    div.style.fontSize = '12.5px';
    if(sender === 'user'){
      div.style.color = 'var(--gold)';
      div.style.textAlign = 'right';
      div.innerHTML = `<b>${text}</b>`;
    }
    this.content.appendChild(div);
    this.content.scrollTop = this.content.scrollHeight;
  }

  typeMessage(html){
    this.typing.classList.add('show');
    this.mochiBody.classList.add('thinking');
    this.stopSpeaking();
    setTimeout(()=>{
      this.typing.classList.remove('show');
      this.mochiBody.classList.remove('thinking');
      this.mochiBody.classList.add('speaking');
      const msgDiv = document.createElement('div');
      msgDiv.style.marginBottom = '8px';
      msgDiv.style.fontSize = '12.5px';
      msgDiv.innerHTML = html;
      this.content.appendChild(msgDiv);
      this.content.scrollTop = this.content.scrollHeight;
      // Xabarni ovoz chiqarish
      const plain = html.replace(/<[^>]*>/g, '').replace(/😔|🎌|💪|🌟/g, '');
      this.speak(plain);
      const speakTime = Math.max(2000, html.length * 40);
      setTimeout(()=>{ this.mochiBody.classList.remove('speaking'); }, speakTime);
    }, 600);
  }

  speak(text){
    if(!this.voiceEnabled || !text) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 1.05;
    utter.pitch = 1.1;
    utter.volume = 0.85;

    // Brauzer ovozlarini yuklash — ba'zi brauzerlarda darhol bo'sh qaytadi
    const setVoice = ()=>{
      const voices = window.speechSynthesis.getVoices();
      // Avval o'zbek/ingliz ovozi, keyin yapon ovozi
      const preferred = voices.find(v=>v.lang.includes('uz')) || 
                        voices.find(v=>v.lang.includes('en')) ||
                        voices.find(v=>v.lang.includes('ja') || v.lang.includes('JP'));
      if(preferred) utter.voice = preferred;
    };
    setVoice();
    if(window.speechSynthesis.onvoiceschanged !== undefined){
      window.speechSynthesis.onvoiceschanged = setVoice;
    }

    utter.onstart = ()=>{ this.isSpeaking = true; };
    utter.onend = ()=>{ this.isSpeaking = false; };
    window.speechSynthesis.speak(utter);
  }

  stopSpeaking(){
    if(this.voiceEnabled) window.speechSynthesis.cancel();
    this.isSpeaking = false;
    this.mochiBody.classList.remove('speaking');
  }
}

<script id="home-nav-script">
  (function(){
    var curtain = document.getElementById('pageCurtain');
    var startX = 0, startY = 0, active = false, going = false;
    // ikki barmoq chapdan o'ngga surilsa — bosh sahifaga (index.html) qaytish
    function goHome(){
      if(going) return;
      going = true;
      if(curtain) curtain.classList.add('leaving');
      setTimeout(function(){ window.location.href = 'index.html'; }, 360);
    }
    window.addEventListener('touchstart', function(e){
      if(e.touches.length === 2){
        var a = e.touches[0], b = e.touches[1];
        startX = (a.clientX + b.clientX) / 2;
        startY = (a.clientY + b.clientY) / 2;
        active = true;
      } else {
        active = false;
      }
    }, {passive:true});
    window.addEventListener('touchmove', function(e){
      if(!active) return;
      if(e.touches.length !== 2){ active = false; return; }
      var a = e.touches[0], b = e.touches[1];
      var x = (a.clientX + b.clientX) / 2, y = (a.clientY + b.clientY) / 2;
      var dx = x - startX, dy = y - startY;
      if(dx > 110 && Math.abs(dy) < 70){ active = false; goHome(); }
    }, {passive:true});
    window.addEventListener('touchend', function(){ active = false; }, {passive:true});
    window.addEventListener('touchcancel', function(){ active = false; }, {passive:true});
    // orqaga (bfcache) qaytilganda parda qolib ketmasin
    window.addEventListener('pageshow', function(e){
      if(e.persisted && curtain){
        curtain.classList.remove('leaving');
        curtain.style.animation = 'none';
        curtain.style.opacity = '0';
        going = false;
      }
    });
  })();
</script>
<script id="page-load-script">
  (function(){
    var c = document.getElementById('pageCurtain');
    if(!c) return;
    var t0 = Date.now(), finished = false;
    function finish(){
      if(finished) return; finished = true;
      c.classList.add('burst');                                 // iliq to'lqin markazdan yoyiladi
      setTimeout(function(){ c.classList.add('done'); }, 520); // parda sekin ochiladi
    }
    function ready(){ setTimeout(finish, Math.max(0, 900 - (Date.now() - t0))); }
    if(document.readyState === 'complete') ready();
    else window.addEventListener('load', ready);
    setTimeout(finish, 5000); // zaxira: hech qachon qotib qolmasin
  })();
</script>
<script>
(function(){
  const mochi = document.getElementById('mochi');
  const btn = document.getElementById('mochiToggleBtn');
  if(!mochi || !btn) return;
  window.mochiShown = true;
  window.mochiAwakeOverride = true;   // sahifa yuklanganda Mochi aktiv (uxlamaydi)
  function setBtn(){ btn.classList.toggle('on', !!window.mochiShown); }
  let hideTimer = null;
  const chatWindow = document.getElementById('mochiBubble');
  // Faqat ishlatilmagan holatda yo'qoladi: 20 soniya davomida hech qanday harakat bo'lmasa
  function onIdle(){
    if(chatWindow && chatWindow.classList.contains('show')){ armHide(); return; }
    window.mochiAwakeOverride = false;
    if(window.mochiShown) window.mochiFadeOut();
  }
  function armHide(){
    clearTimeout(hideTimer);
    hideTimer = setTimeout(onIdle, 20000);
  }
  // Har qanday harakat (bosish, yozish, sudrash) taymerni yangilaydi
  ['pointerdown','keydown','input','touchstart'].forEach(function(ev){
    document.addEventListener(ev, function(){ if(window.mochiShown) armHide(); }, true);
  });
  window.mochiFadeOut = function(){
    window.mochiShown = false;
    clearTimeout(hideTimer);
    setBtn();
    mochi.classList.remove('mochi-fade-in');
    mochi.classList.add('mochi-fade-out');
    setTimeout(function(){
      if(!window.mochiShown){
        document.body.classList.add('mochi-off');
        mochi.classList.remove('mochi-fade-out');
      }
    }, 2500);
  };
  function showMochi(){
    window.mochiShown = true;
    window.mochiAwakeOverride = true;   // tugma bosilganda Mochi uyg'oq bo'ladi
    armHide();
    setBtn();
    document.body.classList.remove('mochi-off');
    mochi.classList.remove('mochi-fade-out');
    mochi.classList.add('mochi-fade-in');
    if(window.mochiUpdateState) window.mochiUpdateState();
  }
  btn.addEventListener('click', function(){
    if(window.mochiShown){
      window.mochiAwakeOverride = false;
      window.mochiFadeOut();
    } else {
      showMochi();
    }
  });
  setBtn();
  // Yuklanganda Mochi aktiv; agar ishlatilmasa, 20 soniyadan keyin asta yo'qoladi
  armHide();
})();
</script>

<script type="module">
  // Lug'at sahifasida kirgan foydalanuvchi index1 dagi "Foydalanuvchilar" ro'yxatida
  // "Lug'at da" deb ko'rinadi. Index2 da tugma yo'q — akkaunt index1 orqali kiriladi
  // (bir xil origin, Firebase sessiyasi umumiy).
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // index1 bilan bir xil Firebase loyihasi
  const app = initializeApp({
    apiKey: "AIzaSyALayFF0xGeWLUTO-96Kf8wUgOVldEFS1w",
    authDomain: "kanjiflashcard-93be1.firebaseapp.com",
    projectId: "kanjiflashcard-93be1",
    storageBucket: "kanjiflashcard-93be1.firebasestorage.app",
    messagingSenderId: "919253211986",
    appId: "1:919253211986:web:5f6ad32cbd978a273af88b",
    measurementId: "G-M0ZY600TGF"
  });
  const auth = getAuth(app);
  const db = getFirestore(app);
  const HEARTBEAT_MS = 20000;
  let timer = null;

  // Owner o'z holatini yozmaydi (index1 ro'yxatida ham, saytda ham ko'rinmaydi)
  const PRESENCE_OWNER_EMAILS = ["doniyorbektoshmatov7@gmail.com"];
  async function beat(user, online){
    if (user && user.email && PRESENCE_OWNER_EMAILS.includes(String(user.email).trim().toLowerCase())) {
      // owner: faqat identifikatsiya, faollik yo'q
      try { await setDoc(doc(db, "presence", user.uid), { uid: user.uid, nick: (user.displayName || user.email).toString().slice(0, 60), email: user.email, photoURL: user.photoURL || "" }, { merge: true }); } catch(e) {}
      return;
    }
    try{
      await setDoc(doc(db, "presence", user.uid), {
        uid: user.uid,
        nick: (user.displayName || user.email || "Foydalanuvchi").toString().slice(0, 60),
        email: (user.email || "").toString().slice(0, 120),
        photoURL: user.photoURL || "",
        online: online,
        page: "lugat",
        lastSeen: serverTimestamp()
      }, { merge: true });
    }catch(e){ console.error("Presence yozishda xatolik:", e.message); }
  }

  onAuthStateChanged(auth, (user) => {
    if (timer) { clearInterval(timer); timer = null; }
    if (!user) return;
    beat(user, true);
    timer = setInterval(() => beat(user, true), HEARTBEAT_MS);
  });
  document.addEventListener("visibilitychange", () => {
    const user = auth.currentUser;
    if (user) beat(user, document.visibilityState !== "hidden");
  });
  window.addEventListener("pagehide", () => {
    const user = auth.currentUser;
    if (user) beat(user, false);
  });
</script>
